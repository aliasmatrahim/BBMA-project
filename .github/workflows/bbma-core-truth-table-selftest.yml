name: BBMA core truth-table selftest

on:
  pull_request:
    branches:
      - d1-tpw-checkpoint-hardening-dev
      - bbma-core-truth-table-dev
    paths:
      - 'blueprint/source/BBMA_EA.mq4'
      - 'blueprint/contracts/BBMA_CORE_CANONICAL_TRUTH_TABLE_CONTRACT.md'
      - 'blueprint/contracts/BBMA_CORE_END_TO_END_JOURNEY_CONTRACT.md'
      - 'blueprint/contracts/BBMA_CORE_C3_TESTER_COMPATIBILITY_CONTRACT.md'
      - 'blueprint/implementation/BBMA_CORE_PERFECTION_QUEUE_20260829.md'
      - 'blueprint/implementation/BBMA_CORE_C1A_TRUTH_TABLE_RECORD_20260829.md'
      - 'blueprint/implementation/BBMA_CORE_C1B_CANDLE_PRICE_EQUIVALENCE_RECORD_20260829.md'
      - 'blueprint/implementation/BBMA_CORE_C2A_END_TO_END_JOURNEY_RECORD_20260829.md'
      - 'blueprint/implementation/BBMA_CORE_C3B_TESTER_COMPATIBILITY_RECORD_20260829.md'
      - 'blueprint/implementation/BBMA_CORE_C3C_MANUAL_EVIDENCE_CHECKLIST_20260830.md'
      - 'blueprint/implementation/BBMA_CORE_LIVE_DEMO_TEST_LANES_20260831.md'
      - 'blueprint/tools/c3_tester_evidence.py'
      - 'blueprint/tests/fixtures/bbma_core_golden_truth_table.json'
      - 'blueprint/tests/test_bbma_core_canonical_truth_table.py'
      - 'blueprint/tests/test_bbma_core_canonical_source_static.py'
      - 'blueprint/tests/test_bbma_core_candle_price_equivalence.py'
      - 'blueprint/tests/test_bbma_core_candle_price_source_static.py'
      - 'blueprint/tests/test_bbma_core_end_to_end_journey_model.py'
      - 'blueprint/tests/test_bbma_core_end_to_end_journey_static.py'
      - 'blueprint/tests/test_c3_offline_tester_symbol_resolution_model.py'
      - 'blueprint/tests/test_c3_offline_tester_symbol_resolution_static.py'
      - 'blueprint/tests/test_c3_tester_evidence_model.py'
      - 'blueprint/tests/test_live_demo_test_lanes_static.py'
      - '.github/workflows/bbma-core-truth-table-selftest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bbma-core-truth-table:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify deterministic golden truth table
        run: python3 blueprint/tests/test_bbma_core_canonical_truth_table.py

      - name: Verify canonical source and authority boundary
        run: python3 blueprint/tests/test_bbma_core_canonical_source_static.py

      - name: Verify closed-candle price equivalence fixtures
        run: python3 blueprint/tests/test_bbma_core_candle_price_equivalence.py

      - name: Bind price fixtures to current source
        run: python3 blueprint/tests/test_bbma_core_candle_price_source_static.py

      - name: Verify end-to-end journey model
        run: python3 blueprint/tests/test_bbma_core_end_to_end_journey_model.py

      - name: Verify end-to-end source and broker-action ownership
        run: python3 blueprint/tests/test_bbma_core_end_to_end_journey_static.py

      - name: Verify offline tester symbol-resolution model
        run: python3 blueprint/tests/test_c3_offline_tester_symbol_resolution_model.py

      - name: Verify tester-only scope and live-path equivalence
        run: python3 blueprint/tests/test_c3_offline_tester_symbol_resolution_static.py

      - name: Verify manual tester evidence classification
        run: python3 blueprint/tests/test_c3_tester_evidence_model.py

      - name: Verify live/demo test-lane separation and dormant authority
        run: python3 blueprint/tests/test_live_demo_test_lanes_static.py

      - name: Compile C1-A harness
        run: |
          python3 -m py_compile \
            blueprint/tests/test_bbma_core_canonical_truth_table.py \
            blueprint/tests/test_bbma_core_canonical_source_static.py \
            blueprint/tests/test_bbma_core_candle_price_equivalence.py \
            blueprint/tests/test_bbma_core_candle_price_source_static.py \
            blueprint/tests/test_bbma_core_end_to_end_journey_model.py \
            blueprint/tests/test_bbma_core_end_to_end_journey_static.py \
            blueprint/tests/test_c3_offline_tester_symbol_resolution_model.py \
            blueprint/tests/test_c3_offline_tester_symbol_resolution_static.py \
            blueprint/tools/c3_tester_evidence.py \
            blueprint/tests/test_c3_tester_evidence_model.py \
            blueprint/tests/test_live_demo_test_lanes_static.py
          echo 'BBMA_CORE_C1_C2A_C3B_C3C_LIVE_LANES_SELFTEST=PASS'
