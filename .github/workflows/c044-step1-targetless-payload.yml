name: C044 Step1 targetless payload stage

on:
  push:
    branches: [ d1-owner-dev ]
    paths:
      - 'blueprint/.run-c044-step1-targetless'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d1-owner-dev
          fetch-depth: 0

      - name: Verify exact pre-C044 source
        shell: bash
        run: |
          set -euo pipefail
          blob="$(git rev-parse HEAD:blueprint/source/BBMA_EA.mq4)"
          test "$blob" = "4ccd444a96a34b494653143a7560516a4147b5bc"

      - name: Apply deterministic C044 Step1 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_c044_step1.py
          git diff --check

      - name: Commit staged C044 Step1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- blueprint/source/BBMA_EA.mq4 blueprint/C044_STEP1_TARGETLESS_PAYLOAD_IMPLEMENTATION_AUDIT_20260826.md
          if git diff --cached --quiet; then
            echo 'No source changes produced.'
            exit 1
          fi
          git commit -m 'C044 Step1: stage targetless M17/M22 payload support [skip ci]'
          git push origin HEAD:d1-owner-dev
