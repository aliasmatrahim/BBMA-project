name: C044 Step3 owner event evaluator stage

on:
  push:
    branches: [ d1-owner-dev ]
    paths:
      - 'blueprint/.run-c044-step3-owner-event'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d1-owner-dev
          fetch-depth: 0

      - name: Verify exact C044 Step2 source
        shell: bash
        run: |
          set -euo pipefail
          blob="$(git rev-parse HEAD:blueprint/source/BBMA_EA.mq4)"
          test "$blob" = "69771ee092822217b1277f5300b77cf6a99c07ec"

      - name: Stage C044 closed owner event evaluator
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/c044_step3_patch.py
          git diff --check

      - name: Commit C044 Step3 staged evaluator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- blueprint/source/BBMA_EA.mq4 blueprint/C044_STEP3_OWNER_EVENT_EVALUATOR_IMPLEMENTATION_AUDIT_20260826.md
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m "C044 Step3: stage closed owner event evaluator [skip ci]"
          git push origin HEAD:d1-owner-dev
