name: Post-C044 repo reconciliation

on:
  push:
    branches: [d1-owner-dev]
    paths:
      - 'blueprint/.run-c044-step4-selftest'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d1-owner-dev
          fetch-depth: 0
      - name: Run reconciliation
        run: python3 blueprint/tools/post_c044_reconcile_20260826.py
      - name: Commit reconciliation
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '## 2026-08-26 — C044 v4.56 Authoritative Runtime-Blocked Overlay' blueprint/CURRENT.md
          grep -Fq '## 2026-08-26 — Post-C044 Queue Reconciliation / Runtime Blocker Split' blueprint/MASTER_QUEUE.md
          grep -Fq 'PASS / CANONICAL CURRENT+QUEUE RECONCILED TO v4.56' blueprint/POST_C044_REPO_RECONCILIATION_TRIAGE_20260826.md
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blueprint/CURRENT.md blueprint/MASTER_QUEUE.md blueprint/POST_C044_REPO_RECONCILIATION_TRIAGE_20260826.md
          git commit -m 'Reconcile v4.56 current queue and runtime blockers [skip ci]'
          git push origin HEAD:d1-owner-dev
