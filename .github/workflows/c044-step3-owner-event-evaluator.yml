          grep -Fq 'Fatal runtime signature: **NONE**' blueprint/C044_STEP5_V456_MT4_ATTACH_RUNTIME_SMOKE_20260826.md

      - name: Reconcile CURRENT and MASTER_QUEUE
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          current = Path('blueprint/CURRENT.md')
          queue = Path('blueprint/MASTER_QUEUE.md')
          marker = '## 2026-08-26 — C044 v4.56 Authoritative Runtime-Blocked Overlay'

          current_overlay = r'''

