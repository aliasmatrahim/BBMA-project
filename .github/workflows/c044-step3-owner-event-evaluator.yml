name: C044 Step4 deterministic replay selftest

on:
  push:
    branches: [ d1-owner-dev ]
    paths:
      - 'blueprint/.run-c044-step4-selftest'

permissions:
  contents: write

jobs:
  replay-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d1-owner-dev
          fetch-depth: 0

      - name: Verify exact compiled C044 Step4 source
        shell: bash
        run: |
          set -euo pipefail
          src=blueprint/source/BBMA_EA.mq4
          blob="$(git rev-parse HEAD:$src)"
          test "$blob" = "f0f80decbdbda836c12b6073f5dbc6e347662b13"
          grep -Fq 'Version 4.5.6 - C044 Deterministic Replay Stage' "$src"
          grep -Fq '#property version   "4.56"' "$src"
          grep -Fq 'bool           EnableC044Lifecycle                = false;' "$src"
          grep -Fq 'Source Git blob: `f0f80decbdbda836c12b6073f5dbc6e347662b13`' blueprint/C044_STEP4_NATIVE_METAEDITOR_COMPILE_20260826.md
          grep -Fq 'Status: **NATIVE METAEDITOR PASS — 0 ERRORS / 0 WARNINGS**' blueprint/C044_STEP4_NATIVE_METAEDITOR_COMPILE_20260826.md

      - name: Run deterministic replay analyzer and state-machine matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 blueprint/tools/c044_step4_replay_selftest.py | tee /tmp/c044-step4-selftest.txt
          grep -Fq 'C044_STEP4_REPLAY_SELFTEST=PASS' /tmp/c044-step4-selftest.txt
          grep -Fq 'STATIC_INVARIANTS=PASS' /tmp/c044-step4-selftest.txt
          grep -Fq 'CHECKPOINT_ROUNDTRIP=PASS' /tmp/c044-step4-selftest.txt
          grep -Fq 'MATRIX_NO_GAP=PASS' /tmp/c044-step4-selftest.txt
          grep -Fq 'MATRIX_MULTI_CANDLE_MOMENTUM_REARM=PASS' /tmp/c044-step4-selftest.txt
          grep -Fq 'MATRIX_FAILED_MOMENTUM_EXIT=PASS' /tmp/c044-step4-selftest.txt
          grep -Fq 'MATRIX_OPPOSITE_EXTREME_SUPERSESSION=PASS' /tmp/c044-step4-selftest.txt
          grep -Fq 'MATRIX_MISSING_SEED_FAIL_FROZEN=PASS' /tmp/c044-step4-selftest.txt
          grep -Fq 'MATRIX_MISSING_HISTORY_FAIL_FROZEN=PASS' /tmp/c044-step4-selftest.txt
          grep -Fq 'MATRIX_CHRONOLOGICAL_ORDER_GUARD=PASS' /tmp/c044-step4-selftest.txt
          grep -Fq 'FEATURE_GATE=OFF' /tmp/c044-step4-selftest.txt

      - name: Record deterministic replay selftest closure
        shell: bash
        run: |
          set -euo pipefail
          cat > blueprint/C044_STEP4_DETERMINISTIC_REPLAY_SELFTEST_20260826.md <<EOF
          # C044 Step 4 — Deterministic Replay Self-Test Closure — 2026-08-26

          Branch: \`d1-owner-dev\`  
          Build: \`Version 4.5.6 - C044 Deterministic Replay Stage\`  
          Source Git blob: \`f0f80decbdbda836c12b6073f5dbc6e347662b13\`  
          Native compile source SHA-256: \`d2d94e5f7cf0f5b513fd2f8dfd877264fe33aad1425d54e056effccb33d782f4\`  
          Self-test workflow run: \`${GITHUB_RUN_ID}\`

          Status: **PASS — SOURCE-BOUND STATIC INVARIANTS + CHECKPOINT ROUND-TRIP + DETERMINISTIC REPLAY MATRIX**

          ## Passed gates
          - Exact source blob and v4.56 identity: PASS
          - \`EnableC044Lifecycle=false\`: PASS
          - Native MetaEditor closure exists for the same source blob: PASS
          - Re-Entry replay seed Save/Load index-field symmetry: PASS
          - BUY Extreme replay seed Save/Load index-field symmetry: PASS
          - SELL Extreme replay seed Save/Load index-field symmetry: PASS
          - Checkpoint persists/restores replay seed: PASS
          - Trade-open runtime cursor uses latest fully closed owner candle: PASS
          - Canonical M08/M12/M10 functions remain replay authorities: PASS
          - Chronological multi-candle replay loop and final cursor guard: PASS
          - M20 emergency close remains ahead of C044 lifecycle close: PASS

          ## Deterministic lifecycle matrix
          - No-gap / no duplicate owner-candle processing: PASS
          - Multi-candle replay, Momentum hold, next same-direction Re-Entry re-arm: PASS
          - Re-Entry confirmation candle not reused as the new epoch outer-BB test: PASS
          - First subsequent direction-side outer-BB test without canonical Momentum -> failed-Momentum exit latch: PASS
          - Opposite mature Extreme -> cycle-superseded exit with same-candle precedence: PASS
          - Missing/corrupt replay seed -> fail-frozen: PASS
          - Missing exact owner history -> fail-frozen: PASS
          - Out-of-order replay -> rejected by chronological guard: PASS

          ## Scope boundary
          This is a source-bound deterministic analyzer/self-test, not broker/demo runtime evidence. It proves implementation invariants and synthetic lifecycle sequencing against the exact compiled v4.56 source. It does not prove live broker order-close timing, terminal GlobalVariable persistence under real restart, or real-market detector events.

          ## Safety
          \`EnableC044Lifecycle=false\` remains locked OFF. No activation is authorized by this self-test.
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p = Path('blueprint/C044_STEP4_DETERMINISTIC_REPLAY_IMPLEMENTATION_AUDIT_20260826.md')
          s = p.read_text(encoding='utf-8')
          old = '**IMPLEMENTED / STATIC INTEGRITY PASS / DETERMINISTIC MULTI-CANDLE REPLAY / FEATURE GATE OFF / NATIVE METAEDITOR 0E0W PASS / SELF-TEST PENDING**'
          new = '**IMPLEMENTED / STATIC INTEGRITY PASS / DETERMINISTIC MULTI-CANDLE REPLAY / FEATURE GATE OFF / NATIVE METAEDITOR 0E0W PASS / DETERMINISTIC SELF-TEST PASS / BROKER-DEMO RUNTIME EVIDENCE PENDING**'
          if old not in s:
              raise SystemExit('Step4 audit status anchor drift')
          s = s.replace(old, new, 1)
          s = s.replace(
              'Run deterministic replay self-tests against the exact v4.56 blob: checkpoint round-trip integrity, no-gap behavior, one/multi-candle chronological replay, failed-Momentum exit latch, Momentum hold → next Re-Entry re-arm, opposite-Extreme cycle supersession, and missing/corrupt history fail-frozen behavior. No activation is authorized by this audit.',
              'Deterministic replay self-tests against the exact v4.56 blob are PASS: checkpoint round-trip integrity, no-gap behavior, chronological multi-candle replay, failed-Momentum exit latch, Momentum hold → next Re-Entry re-arm, opposite-Extreme cycle supersession, and missing/corrupt history fail-frozen behavior. Remaining gate before any activation decision is broker/demo runtime evidence for real terminal restart persistence and live owner-candle lifecycle behavior. No activation is authorized by this audit.')
          p.write_text(s, encoding='utf-8')
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- blueprint/C044_STEP4_DETERMINISTIC_REPLAY_SELFTEST_20260826.md blueprint/C044_STEP4_DETERMINISTIC_REPLAY_IMPLEMENTATION_AUDIT_20260826.md
          git commit -m "C044 Step4: close deterministic replay selftest [skip ci]"
          git push origin HEAD:d1-owner-dev
