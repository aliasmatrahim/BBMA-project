name: Core V2 closure reconciliation

on:
  push:
    branches: [d1-owner-dev]
    paths:
      - 'blueprint/.run-core-v2-closure'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d1-owner-dev
          fetch-depth: 0
      - name: Apply closure reconciliation
        run: |
          python3 blueprint/tools/reconcile_core_v2_closure.py
          grep -F 'Current unresolved BBMA Core semantic HOLD count: 0.' docs/references/BBMA_STRATEGY_CORE_SOURCE_OF_TRUTH_V2.md
          grep -F 'Advanced repeated-Extreme behavior is a bounded MTF exception' docs/references/BBMA_STRATEGY_CORE_SOURCE_OF_TRUTH_V2.md
          grep -F 'immediately following live source-timeframe candle' docs/references/BBMA_STRATEGY_CORE_SOURCE_OF_TRUTH_V2.md
          git diff --check
      - name: Commit reconciled Core and remove one-shot tooling
        run: |
          rm -f blueprint/.run-core-v2-closure
          rm -f blueprint/tools/reconcile_core_v2_closure.py
          rm -f .github/workflows/core-v2-closure-reconcile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Reconcile Core V2 to zero semantic HOLDs [skip ci]'
          git push origin HEAD:d1-owner-dev
