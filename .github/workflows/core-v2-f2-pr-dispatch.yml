name: CORE-V2-F2 PR dispatch

on:
  pull_request:
    branches: [ blueprint-dev ]
    types: [opened, reopened, synchronize]
    paths:
      - 'blueprint/.f2-dispatch'

permissions:
  contents: write

jobs:
  apply-f2:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: blueprint-dev
          fetch-depth: 0

      - name: Apply CORE-V2-F2 patch and static invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_core_v2_f2.py
          git diff --check

      - name: Commit F2 implementation to blueprint-dev
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- blueprint/source/BBMA_EA.mq4 blueprint/CORE_V2_F2_IMPLEMENTATION_AUDIT.md
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m "CORE-V2-F2: implement Extreme maturity lifecycle"
          git push origin HEAD:blueprint-dev
