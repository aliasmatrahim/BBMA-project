name: CORE-V2-F3 PR dispatch

on:
  pull_request:
    branches: [ blueprint-dev ]
    types: [opened, reopened, synchronize]
    paths:
      - 'blueprint/.f3-dispatch'

permissions:
  contents: write

jobs:
  apply-f3:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: blueprint-dev
          fetch-depth: 0

      - name: Apply CORE-V2-F3 Type1 structural lifecycle and static regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/apply_core_v2_f3.py')
          t = p.read_text(encoding='utf-8')
          old = "if s.count('TYPE1_CTX_DIRECTION_OWNER') < 3 or s.count('TYPE1_CTX_RANGING') < 3:"
          new = "if s.count('TYPE1_CTX_DIRECTION_OWNER') < 3 or s.count('TYPE1_CTX_RANGING') < 2:"
          if old not in t:
              raise SystemExit('F3 static-check patch target not found')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')
          PY
          python3 .github/scripts/apply_core_v2_f3.py
          git diff --check

      - name: Commit F3 implementation to blueprint-dev
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- blueprint/source/BBMA_EA.mq4 \
                     blueprint/CORE_V2_F3_IMPLEMENTATION_AUDIT.md \
                     blueprint/MASTER_QUEUE.md \
                     blueprint/CURRENT.md
          if git diff --cached --quiet; then
            echo 'No F3 source changes to commit.'
            exit 0
          fi
          git commit -m "CORE-V2-F3: implement Type1 structural context"
          git push origin HEAD:blueprint-dev
