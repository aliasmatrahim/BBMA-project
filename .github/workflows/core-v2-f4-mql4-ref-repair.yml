name: CORE-V2-F4 MQL4 reference repair

on:
  pull_request:
    branches: [ blueprint-dev ]
    types: [opened, reopened, synchronize]
    paths:
      - 'blueprint/.f4-ref-repair'

permissions:
  contents: write

jobs:
  repair-f4-refs:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: blueprint-dev
          fetch-depth: 0

      - name: Remove unsupported local reference variables
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/fix_core_v2_f4_mql4_refs.py
          git diff --check
          ! grep -Eq '^[[:space:]]*(PairState|H4DirectionalOwner|TimeframeData)[[:space:]]+&[A-Za-z_][A-Za-z0-9_]*[[:space:]]*=' blueprint/source/BBMA_EA.mq4

      - name: Commit F4 MQL4 compatibility repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- blueprint/source/BBMA_EA.mq4 blueprint/CORE_V2_F4_IMPLEMENTATION_AUDIT.md
          git commit -m "CORE-V2-F4: remove unsupported local reference aliases"
          git push origin HEAD:blueprint-dev
