name: D1 Step 1 M11 owner PR dispatch (temporary F4 runner)

on:
  pull_request:
    branches: [ blueprint-dev ]
    types: [opened, reopened, synchronize]
    paths:
      - 'blueprint/.d1-step1-dispatch'

permissions:
  contents: write

jobs:
  apply-d1-step1:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Materialize D1-01 and run static integrity checks
        shell: bash
        run: |
          set -euo pipefail
          SRC='blueprint/source/BBMA_EA.mq4'
          PATCH='blueprint/patches/0026-d1-step1-m11-strategic-owner-producer.patch'
          AUDIT='blueprint/D1_STEP1_M11_STRATEGIC_OWNER_IMPLEMENTATION_AUDIT_20260824.md'
          test -f "$SRC"
          cp "$SRC" /tmp/BBMA_EA.before.mq4

          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          src = Path('blueprint/source/BBMA_EA.mq4')
          audit = Path('blueprint/D1_STEP1_M11_STRATEGIC_OWNER_IMPLEMENTATION_AUDIT_20260824.md')
          before = Path('/tmp/BBMA_EA.before.mq4').read_text(encoding='utf-8')
          s = src.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, found {count}')
              return text.replace(old, new, 1)

          if 'D1-01 M11 Strategic Owner' not in s:
              s = replace_once(s,
                  '//|                                    Version 4.5.1 - P3-UI-01 Input Panel Cleanup    |',
                  '//| Version 4.5.1 - D1-01 M11 Strategic Owner                        |',
                  'header build id')

              old_enum = '''enum ENUM_H4_OWNER_STATE
{
   H4_OWNER_RECOVERY_UNRESOLVED,
   H4_OWNER_NONE,
   H4_OWNER_ACTIVE
};

enum ENUM_EXTREME_TYPE'''
              new_enum = '''enum ENUM_H4_OWNER_STATE
{
   H4_OWNER_RECOVERY_UNRESOLVED,
   H4_OWNER_NONE,
   H4_OWNER_ACTIVE
};

enum ENUM_D1_OWNER_STATE
{
   D1_OWNER_UNRESOLVED,
   D1_OWNER_BUY_CONFIRMED,
   D1_OWNER_SELL_CONFIRMED,
   D1_TRANSITION
};

enum ENUM_EXTREME_TYPE'''
              s = replace_once(s, old_enum, new_enum, 'D1 owner enum')

              old_struct = '''struct H4DirectionalOwner
{
   ENUM_H4_OWNER_STATE  State;
   ENUM_DIRECTION       Direction;
   ENUM_SIGNAL_TYPE     SourceSignal;
   datetime             SourceCandleTime;
   ENUM_SIGNAL_TYPE     LastAdvanceSignal;
   datetime             LastAdvanceCandleTime;
   datetime             LastProcessedH4CandleTime;
   bool                 IsValid;
   bool                 RecoveryComplete;
   bool                 RecoveredFromCheckpoint;
   string               Reason;
};

struct TimeframeSnapshot'''
              new_struct = '''struct H4DirectionalOwner
{
   ENUM_H4_OWNER_STATE  State;
   ENUM_DIRECTION       Direction;
   ENUM_SIGNAL_TYPE     SourceSignal;
   datetime             SourceCandleTime;
   ENUM_SIGNAL_TYPE     LastAdvanceSignal;
   datetime             LastAdvanceCandleTime;
   datetime             LastProcessedH4CandleTime;
   bool                 IsValid;
   bool                 RecoveryComplete;
   bool                 RecoveredFromCheckpoint;
   string               Reason;
};

struct D1MajorTrendOwner
{
   ENUM_D1_OWNER_STATE  State;
   ENUM_DIRECTION       Direction;
   datetime             SourceCandleTime;
   datetime             LastProcessedD1CandleTime;
   bool                 IsValid;
   string               Reason;
};

struct TimeframeSnapshot'''
              s = replace_once(s, old_struct, new_struct, 'D1 owner struct')

              s = replace_once(s,
                  '   H4DirectionalOwner   h4_direction_owner;\n   double               prev_ema50;',
                  '   H4DirectionalOwner   h4_direction_owner;\n   D1MajorTrendOwner    d1_major_trend_owner;\n   double               prev_ema50;',
                  'PairState D1 owner field')

              old_init = '''   state.h4_direction_owner.IsValid = false;
   state.h4_direction_owner.RecoveryComplete = false;
   state.h4_direction_owner.RecoveredFromCheckpoint = false;
}'''
              new_init = '''   state.h4_direction_owner.IsValid = false;
   state.h4_direction_owner.RecoveryComplete = false;
   state.h4_direction_owner.RecoveredFromCheckpoint = false;

   state.d1_major_trend_owner.State = D1_OWNER_UNRESOLVED;
   state.d1_major_trend_owner.Direction = DIR_NONE;
   state.d1_major_trend_owner.SourceCandleTime = 0;
   state.d1_major_trend_owner.LastProcessedD1CandleTime = 0;
   state.d1_major_trend_owner.IsValid = false;
   state.d1_major_trend_owner.Reason = "D1 owner not evaluated";
}'''
              s = replace_once(s, old_init, new_init, 'InitPairState D1 owner init')

              module12_marker = '''//+------------------------------------------------------------------+
//| MODULE 12: RE-ENTRY ENGINE                                       |'''
              d1_functions = '''void SetD1OwnerUnresolved(PairState &state, string reason)
{
   state.d1_major_trend_owner.State = D1_OWNER_UNRESOLVED;
   state.d1_major_trend_owner.Direction = DIR_NONE;
   state.d1_major_trend_owner.IsValid = false;
   state.d1_major_trend_owner.SourceCandleTime = state.d1_data.candle_time;
   state.d1_major_trend_owner.LastProcessedD1CandleTime = state.d1_data.candle_time;
   state.d1_major_trend_owner.Reason = reason;
}

void TraceD1MajorTrendOwner(string pair, PairState &state)
{
   if(DebugLevel < DBG_SIGNAL) return;

   Print("[D1-01][OWNER] Pair=", pair,
         " Candle=", TimeToString(state.d1_major_trend_owner.SourceCandleTime),
         " State=", EnumToString(state.d1_major_trend_owner.State),
         " Dir=", EnumToString(state.d1_major_trend_owner.Direction),
         " Close=", DoubleToString(state.d1_data.close, state.d1_data.digits),
         " MA50=", DoubleToString(state.current_daily_ema50, state.d1_data.digits),
         " PrevMA50=", DoubleToString(state.prev_daily_ema50, state.d1_data.digits));
}

void UpdateD1MajorTrendOwner(string pair, PairState &state)
{
   if(!state.d1_data.is_valid ||
      !state.d1_data.is_closed ||
      state.d1_data.timeframe != PERIOD_D1 ||
      state.d1_data.candle_time <= 0 ||
      state.d1_data.barIndex < 1)
   {
      SetD1OwnerUnresolved(state, "Invalid/incomplete closed D1 snapshot");
      TraceD1MajorTrendOwner(pair, state);
      return;
   }

   if(state.d1_major_trend_owner.IsValid &&
      state.d1_major_trend_owner.LastProcessedD1CandleTime == state.d1_data.candle_time)
      return;

   double currentMA50 = state.d1_data.ma[4];
   double previousMA50 = EMA(pair, PERIOD_D1, EMA50_PERIOD,
                             state.d1_data.barIndex + 1);

   state.current_daily_ema50 = currentMA50;
   state.prev_daily_ema50 = previousMA50;
   state.d1_major_trend_owner.SourceCandleTime = state.d1_data.candle_time;
   state.d1_major_trend_owner.LastProcessedD1CandleTime = state.d1_data.candle_time;

   if(state.d1_data.close <= 0.0 || currentMA50 <= 0.0 || previousMA50 <= 0.0)
   {
      SetD1OwnerUnresolved(state, "Required closed D1 MA50 history unavailable");
      TraceD1MajorTrendOwner(pair, state);
      return;
   }

   state.d1_major_trend_owner.IsValid = true;

   if(state.d1_data.close > currentMA50 && currentMA50 > previousMA50)
   {
      state.d1_major_trend_owner.State = D1_OWNER_BUY_CONFIRMED;
      state.d1_major_trend_owner.Direction = DIR_BUY;
      state.d1_major_trend_owner.Reason = "Closed D1 above MA50 with rising MA50";
   }
   else if(state.d1_data.close < currentMA50 && currentMA50 < previousMA50)
   {
      state.d1_major_trend_owner.State = D1_OWNER_SELL_CONFIRMED;
      state.d1_major_trend_owner.Direction = DIR_SELL;
      state.d1_major_trend_owner.Reason = "Closed D1 below MA50 with falling MA50";
   }
   else
   {
      state.d1_major_trend_owner.State = D1_TRANSITION;
      state.d1_major_trend_owner.Direction = DIR_NONE;
      state.d1_major_trend_owner.Reason =
         "Closed D1 price-side and MA50 slope do not confirm one direction";
   }

   TraceD1MajorTrendOwner(pair, state);
}

'''
              s = replace_once(s, module12_marker, d1_functions + module12_marker, 'M11 D1 owner functions')

              s = replace_once(s,
                  '   g_dashboard_snapshot += "=== BBMA EA V4.5.1 ===\\n";',
                  '   g_dashboard_snapshot += "=== BBMA EA V4.5.1 D1-01 ===\\n";',
                  'dashboard build id')

              old_process = '''   GetDataForTimeframe(actual, PERIOD_M15, g_pair_states[pairIndex].tf_snapshot.M15_CandleTime,
                       g_pair_states[pairIndex].m15_data);

   // H4 owner is persistent across neutral H4 candles and changes only on'''
              new_process = '''   GetDataForTimeframe(actual, PERIOD_M15, g_pair_states[pairIndex].tf_snapshot.M15_CandleTime,
                       g_pair_states[pairIndex].m15_data);

   // D1-01: classify the strategic D1/MA50 owner from fully closed D1 data.
   // Producer only in this step; M15/M16 consumption is intentionally later.
   UpdateD1MajorTrendOwner(actual, g_pair_states[pairIndex]);

   // H4 owner is persistent across neutral H4 candles and changes only on'''
              s = replace_once(s, old_process, new_process, 'ProcessPair D1 producer call')

              s = replace_once(s,
                  '   Log(DBG_FULL, "BBMA Professional EA V4.5.1 initialized successfully");',
                  '   Log(DBG_FULL, "BBMA EA V4.5.1 D1-01 initialized successfully");',
                  'init build id')

              src.write_text(s, encoding='utf-8')

          s = src.read_text(encoding='utf-8')
          for needle in [
              '//| Version 4.5.1 - D1-01 M11 Strategic Owner',
              'enum ENUM_D1_OWNER_STATE',
              'struct D1MajorTrendOwner',
              'D1MajorTrendOwner    d1_major_trend_owner;',
              'void UpdateD1MajorTrendOwner(string pair, PairState &state)',
              'UpdateD1MajorTrendOwner(actual, g_pair_states[pairIndex]);',
              '=== BBMA EA V4.5.1 D1-01 ===',
              'BBMA EA V4.5.1 D1-01 initialized successfully',
          ]:
              if s.count(needle) != 1:
                  raise SystemExit(f'D1-01 static check failed for {needle!r}: {s.count(needle)}')

          if s.count('state.d1_data.close > currentMA50 && currentMA50 > previousMA50') != 1:
              raise SystemExit('D1 BUY predicate missing/ambiguous')
          if s.count('state.d1_data.close < currentMA50 && currentMA50 < previousMA50') != 1:
              raise SystemExit('D1 SELL predicate missing/ambiguous')
          if s.count('state.d1_major_trend_owner.State = D1_TRANSITION;') != 1:
              raise SystemExit('D1 transition assignment missing/ambiguous')

          process_start = s.index('void ProcessPair(int pairIndex)')
          process_end = s.index('void OnTickMain()', process_start)
          process = s[process_start:process_end]
          if not (process.index('GetDataForTimeframe(actual, PERIOD_D1') <
                  process.index('UpdateD1MajorTrendOwner(actual, g_pair_states[pairIndex]);') <
                  process.index('UpdateRuntimeH4DirectionalOwner(pairIndex);')):
              raise SystemExit('D1 producer orchestration order invalid')

          m15_start = s.index('//| MODULE 15:')
          m16_start = s.index('//| MODULE 16:', m15_start)
          m17_start = s.index('//| MODULE 17:', m16_start)
          if 'd1_major_trend_owner' in s[m15_start:m16_start]:
              raise SystemExit('D1-01 scope breach: M15 consumes D1 owner')
          if 'd1_major_trend_owner' in s[m16_start:m17_start]:
              raise SystemExit('D1-01 scope breach: M16 consumes D1 owner')

          header_line = next((ln for ln in s.splitlines() if 'D1-01 M11 Strategic Owner' in ln), '')
          if not header_line.startswith('//| Version 4.5.1 - D1-01 M11 Strategic Owner'):
              raise SystemExit('D1-01 header build ID not left-aligned')

          def scrub(text: str) -> str:
              out=[]; i=0; n=len(text); state='code'
              while i<n:
                  ch=text[i]; nxt=text[i+1] if i+1<n else ''
                  if state=='code':
                      if ch=='/' and nxt=='/': state='line'; out.extend('  '); i+=2; continue
                      if ch=='/' and nxt=='*': state='block'; out.extend('  '); i+=2; continue
                      if ch=='"': state='string'; out.append(' '); i+=1; continue
                      out.append(ch); i+=1; continue
                  if state=='line':
                      if ch=='\n': state='code'; out.append('\n')
                      else: out.append(' ')
                      i+=1; continue
                  if state=='block':
                      if ch=='*' and nxt=='/': state='code'; out.extend('  '); i+=2
                      else: out.append('\n' if ch=='\n' else ' '); i+=1
                      continue
                  if state=='string':
                      if ch=='\\': out.extend('  '); i+=2; continue
                      if ch=='"': state='code'; out.append(' '); i+=1; continue
                      out.append('\n' if ch=='\n' else ' '); i+=1
              return ''.join(out)

          clean = scrub(s)
          for a,b in [('(',')'),('[',']'),('{','}')]:
              if clean.count(a) != clean.count(b):
                  raise SystemExit(f'Delimiter mismatch {a}{b}: {clean.count(a)} vs {clean.count(b)}')

          for module in range(1, 28):
              if f'MODULE {module:02d}:' not in s:
                  raise SystemExit(f'Missing module marker MODULE {module:02d}')

          m11_start = s.index('//| MODULE 11:')
          m12_start = s.index('//| MODULE 12:', m11_start)
          m11 = s[m11_start:m12_start]
          for token in ['RSI', 'MACD', 'Stochastic', 'ADX', 'ATR(', 'News', 'Session']:
              if token in m11:
                  raise SystemExit(f'Forbidden non-Core token in M11: {token}')

          before_sha = hashlib.sha256(before.encode('utf-8')).hexdigest()
          after_sha = hashlib.sha256(s.encode('utf-8')).hexdigest()
          audit.write_text(f'''# D1 Step 1 — M11 Strategic Owner Implementation Audit

Date: 2026-08-24  
Branch: `d1-owner-dev`  
Status: **SOURCE MATERIALIZED / STATIC INTEGRITY PASS / NATIVE METAEDITOR COMPILE PENDING**

## Scope
M11 D1 strategic-owner producer only. M15/M16 D1 entry gating remains inactive until D1 Step 2.

## Mapping
- BUY = latest fully closed D1 `Close > MA50` and MA50 rising versus previous closed D1;
- SELL = latest fully closed D1 `Close < MA50` and MA50 falling versus previous closed D1;
- otherwise valid = `D1_TRANSITION`;
- invalid/incomplete history = `D1_OWNER_UNRESOLVED`.

## Static result
**PASS** — source anchors, owner predicates, closed-D1 source, orchestration order, producer-only boundary, left-aligned build ID, delimiter balance, Module 01–27 retention and purity guards all passed.

## Source identity
Before SHA-256: `{before_sha}`  
After SHA-256: `{after_sha}`

## Compile gate
Native MT4 MetaEditor compile remains required. Target: **0 errors / 0 warnings**.

## Boundary
No M15/M16 D1 gate, M17/F7 payload, risk, lot sizing, broker execution or live-position lifecycle change is activated by D1-01.
''', encoding='utf-8')
          PY

          git diff -- blueprint/source/BBMA_EA.mq4 > "$PATCH"
          test -s "$PATCH"
          git apply --check --reverse "$PATCH"
          rm -f blueprint/.d1-step1-dispatch*
          rm -f .github/workflows/one-shot-apply-d1-step1.yml
          git diff --check

      - name: Commit D1-01 to working branch
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "D1-01: materialize M11 strategic owner producer [skip ci]"
          git push origin HEAD:"$HEAD_REF"
