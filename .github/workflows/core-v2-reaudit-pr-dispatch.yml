name: CORE-V2 integrated re-audit dispatch

on:
  pull_request:
    branches: [ blueprint-dev ]
    types: [opened, reopened, synchronize]
    paths:
      - 'blueprint/.core-v2-reaudit-dispatch'

permissions:
  contents: write

jobs:
  reaudit-core-v2:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: blueprint-dev
          fetch-depth: 0

      - name: Re-audit integrated Strategy Core V2 after F1-F6
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_core_v2_reaudit.py
          git diff --check

      - name: Commit re-audit to blueprint-dev
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- blueprint/P3_CORE_V2_STRATEGY_REAUDIT_20260822.md \
                     blueprint/MASTER_QUEUE.md \
                     blueprint/CURRENT.md
          if git diff --cached --quiet; then
            echo 'No Core re-audit changes to commit.'
            exit 0
          fi
          git commit -m "CORE-V2: rerun integrated static strategy audit"
          git push origin HEAD:blueprint-dev
