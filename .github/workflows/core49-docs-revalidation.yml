name: Core 49-family docs revalidation

on:
  push:
    branches:
      - d1-owner-dev
    paths:
      - 'blueprint/.core49-revalidation-trigger'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout owner
        uses: actions/checkout@v4
        with:
          ref: d1-owner-dev
          fetch-depth: 0

      - name: Record EA source hash
        run: sha256sum blueprint/source/BBMA_EA.mq4 | tee /tmp/ea-before.sha256

      - name: Apply docs-only Core revalidation
        run: python3 .github/scripts/core49_docs_revalidation.py

      - name: Verify docs-only diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          sha256sum -c /tmp/ea-before.sha256
          if git diff --name-only | grep -E '\.(mq4|mqh)$'; then
            echo 'ERROR: MQL4 source changed in docs-only revalidation'
            exit 1
          fi
          grep -F '28 / 49 = 57.14% fully covered' docs/references/HOME_COURSE_19P_CANONICAL_ROW_MAP_20260825.md
          grep -F '10 / 49 = 20.41% partial/mixed' docs/references/HOME_COURSE_19P_CANONICAL_ROW_MAP_20260825.md
          ! grep -F '30 / 49 = 61.22% fully covered' docs/references/HOME_COURSE_19P_CANONICAL_ROW_MAP_20260825.md
          grep -F 'Buying Zone' docs/references/BBMA_STRATEGY_CORE_SOURCE_OF_TRUTH_V2.md
          grep -F 'Mid-BB slope' docs/references/BBMA_STRATEGY_CORE_SOURCE_OF_TRUTH_V2.md
          grep -F 'Extrem Magic' docs/references/BBMA_STRATEGY_CORE_SOURCE_OF_TRUTH_V2.md
          grep -F 'REM = H4 Re-Entry + H1 Extreme + M15 MHV/MLV' docs/references/BBMA_STRATEGY_CORE_SOURCE_OF_TRUTH_V2.md
          grep -F 'RRE = D1 Re-Entry + H4 Re-Entry + H1 Extreme' docs/references/BBMA_STRATEGY_CORE_SOURCE_OF_TRUTH_V2.md
          grep -F 'REE = D1 Re-Entry + H4 Extreme + H1 Extreme' docs/references/BBMA_STRATEGY_CORE_SOURCE_OF_TRUTH_V2.md

      - name: Commit docs-only reconciliation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No patch required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/references/BBMA_STRATEGY_CORE_SOURCE_OF_TRUTH_V2.md \
            docs/references/BBMA_STRATEGY_CORE_V2X_WORKBOOK_SAFE_CLARIFICATIONS_20260825.md \
            docs/references/HOME_COURSE_19P_CANONICAL_ROW_MAP_20260825.md \
            blueprint/CORE_V2_F7_DETERMINISTIC_NO_MOMENTUM_EXIT_RESOLUTION_AUDIT_20260824.md \
            blueprint/CORE_V2_F7_POST_MOMENTUM_REARM_FINAL_EXIT_RESOLUTION_AUDIT_20260824.md \
            blueprint/CORE_V2_F7_COMBINATION_LIFECYCLE_EXIT_OWNERSHIP_AUDIT_20260824.md \
            blueprint/CORE_V2_F7_M23_M24_LIFECYCLE_STATE_RESTART_RECOVERY_AUDIT_20260824.md \
            blueprint/CORE_V2_F7_STATIC_TP_VS_LIFECYCLE_EXIT_COEXISTENCE_AUDIT_20260824.md \
            blueprint/CURRENT.md \
            blueprint/MASTER_QUEUE.md
          git commit -m 'docs: close Core 49-family completeness revalidation'
          git push origin HEAD:d1-owner-dev
