name: D1 Step2 M15-M16 one-shot integration

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  d1-step2:
    if: github.event.issue.title == 'RUN D1 STEP2 APPLY NATIVE 20260824'
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d1-owner-dev
          fetch-depth: 0

      - name: Apply exact D1-02 source patch and static checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python blueprint/tools/d1_step2_apply.py
          git diff --check

      - name: Acquire official MT4 MetaEditor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $meta = Get-ChildItem 'C:\Program Files*' -Filter metaeditor.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $meta) {
            $url = 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt4/mt4setup.exe'
            Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\mt4setup.exe" -UseBasicParsing
            Start-Process -FilePath "$env:RUNNER_TEMP\mt4setup.exe" -ArgumentList '/auto' -Wait
            Start-Sleep -Seconds 5
            $meta = Get-ChildItem 'C:\Program Files*' -Filter metaeditor.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $meta) { throw 'MT4 MetaEditor not found' }
          "METAEDITOR=$($meta.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Native MetaEditor compile and report
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $src = (Resolve-Path '.\blueprint\source\BBMA_EA.mq4').Path
          $log = Join-Path $env:RUNNER_TEMP 'd1-step2-metaeditor.log'
          $ok = $false
          $errors = -1
          $warnings = -1
          $detail = ''
          try {
            & "$env:METAEDITOR" "/compile:$src" "/log:$log"
            Start-Sleep -Seconds 2
            if (-not (Test-Path $log)) { throw 'MetaEditor compile log missing' }
            $txt = Get-Content $log -Raw
            $ex4 = [System.IO.Path]::ChangeExtension($src,'.ex4')
            if (-not (Test-Path $ex4)) { throw 'MetaEditor did not produce EX4' }
            $matches = [regex]::Matches($txt, '(?i)(\d+)\s+errors?,\s*(\d+)\s+warnings?')
            if ($matches.Count -lt 1) { throw 'Unable to parse MetaEditor summary' }
            $m = $matches[$matches.Count - 1]
            $errors = [int]$m.Groups[1].Value
            $warnings = [int]$m.Groups[2].Value
            if ($errors -ne 0 -or $warnings -ne 0) { throw "MetaEditor produced $errors errors / $warnings warnings" }
            $ok = $true
            $detail = 'D1-02 exact source compiled 0E0W and EX4 was produced.'
          }
          catch {
            $detail = $_.Exception.Message
          }
          $body = New-Object System.Collections.Generic.List[string]
          $body.Add('D1-02 native compile result')
          $body.Add('')
          $body.Add("- OK: $ok")
          $body.Add("- Errors: $errors")
          $body.Add("- Warnings: $warnings")
          $body.Add("- Detail: $detail")
          if (Test-Path $log) {
            $body.Add('')
            $body.Add('```text')
            foreach ($line in (Get-Content $log | Select-Object -Last 80)) { $body.Add($line) }
            $body.Add('```')
          }
          $comment = Join-Path $env:RUNNER_TEMP 'd1-step2-comment.md'
          $body | Set-Content $comment
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body-file $comment
          if (-not $ok) { throw $detail }

      - name: Finalize contracts, audit and commit isolated D1-02
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python blueprint/tools/d1_step2_apply.py --finalize
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm blueprint/tools/d1_step2_apply.py
          git add -- blueprint/source/BBMA_EA.mq4 blueprint/contracts/M15_FINAL_SIGNAL_AUTHORITY_CONTRACT.md blueprint/contracts/M16_CONFLICT_INVALIDATION_CONTRACT.md blueprint/D1_STEP2_M15_M16_STRATEGIC_GATE_IMPLEMENTATION_AUDIT_20260824.md
          git commit -m "D1-02: integrate M15-M16 strategic owner gate [skip ci]"
          $commit = (git rev-parse HEAD).Trim()
          $blob = (git rev-parse HEAD:blueprint/source/BBMA_EA.mq4).Trim()
          git push origin HEAD:d1-owner-dev
          "D1_STEP2_COMMIT=$commit" | Out-File -FilePath $env:GITHUB_ENV -Append
          "D1_STEP2_BLOB=$blob" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Report D1-02 success
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $body = @"
          D1-02 integration PASS.

          - Branch: `d1-owner-dev`
          - Commit: `$env:D1_STEP2_COMMIT`
          - Source blob: `$env:D1_STEP2_BLOB`
          - Static integrity: PASS
          - Native MT4 MetaEditor: 0 errors / 0 warnings
          - `blueprint-dev`: unchanged
          "@
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body $body

  close-issue:
    if: always() && github.event.issue.title == 'RUN D1 STEP2 APPLY NATIVE 20260824'
    needs: d1-step2
    runs-on: ubuntu-latest
    steps:
      - name: Close trigger issue with result
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.d1-step2.result }}
        run: |
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --comment "D1-02 one-shot result: ${RESULT}."
