name: D1 Step 1 M11 owner PR dispatch

on:
  pull_request:
    branches: [ blueprint-dev ]
    types: [opened, reopened, synchronize]
    paths:
      - 'blueprint/.d1-step1-dispatch'

permissions:
  contents: write

jobs:
  apply-d1-step1:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Materialize D1-01 and run static integrity checks
        shell: bash
        run: |
          set -euo pipefail

          PATCH='blueprint/patches/0026-d1-step1-m11-strategic-owner-producer.patch'
          SRC='blueprint/source/BBMA_EA.mq4'
          AUDIT='blueprint/D1_STEP1_M11_STRATEGIC_OWNER_IMPLEMENTATION_AUDIT_20260824.md'

          test -f "$PATCH"
          test -f "$SRC"
          BEFORE_SHA=$(sha256sum "$SRC" | awk '{print $1}')

          if grep -Fq 'D1-01 M11 Strategic Owner' "$SRC"; then
            echo 'D1-01 already materialized; verifying current source.'
          else
            git apply --check "$PATCH"
            git apply "$PATCH"
          fi

          git diff --check

          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          src = Path('blueprint/source/BBMA_EA.mq4')
          s = src.read_text(encoding='utf-8')

          required_once = [
              '//| Version 4.5.1 - D1-01 M11 Strategic Owner',
              'enum ENUM_D1_OWNER_STATE',
              'struct D1MajorTrendOwner',
              'D1MajorTrendOwner    d1_major_trend_owner;',
              'void SetD1OwnerUnresolved(PairState &state, string reason)',
              'void TraceD1MajorTrendOwner(string pair, PairState &state)',
              'void UpdateD1MajorTrendOwner(string pair, PairState &state)',
              'UpdateD1MajorTrendOwner(actual, g_pair_states[pairIndex]);',
              '=== BBMA EA V4.5.1 D1-01 ===',
              'BBMA EA V4.5.1 D1-01 initialized successfully',
          ]
          for needle in required_once:
              c = s.count(needle)
              if c != 1:
                  raise SystemExit(f'D1-01 static check expected exactly one {needle!r}, found {c}')

          if s.count('state.d1_data.close > currentMA50 && currentMA50 > previousMA50') != 1:
              raise SystemExit('D1 BUY predicate missing/ambiguous')
          if s.count('state.d1_data.close < currentMA50 && currentMA50 < previousMA50') != 1:
              raise SystemExit('D1 SELL predicate missing/ambiguous')
          if s.count('state.d1_major_trend_owner.State = D1_TRANSITION;') != 1:
              raise SystemExit('D1 transition assignment missing/ambiguous')
          if s.count('state.d1_major_trend_owner.State = D1_OWNER_UNRESOLVED;') < 1:
              raise SystemExit('D1 unresolved path missing')

          for needle in [
              '!state.d1_data.is_closed',
              'state.d1_data.timeframe != PERIOD_D1',
              'state.d1_data.barIndex < 1',
              'EMA(pair, PERIOD_D1, EMA50_PERIOD,',
              'state.d1_data.barIndex + 1',
          ]:
              if needle not in s:
                  raise SystemExit(f'D1 closed-history guard missing: {needle}')

          process_start = s.index('void ProcessPair(int pairIndex)')
          process_end = s.index('void OnTickMain()', process_start)
          process = s[process_start:process_end]
          d1_load = process.index('GetDataForTimeframe(actual, PERIOD_D1')
          owner_call = process.index('UpdateD1MajorTrendOwner(actual, g_pair_states[pairIndex]);')
          h4_call = process.index('UpdateRuntimeH4DirectionalOwner(pairIndex);')
          if not (d1_load < owner_call < h4_call):
              raise SystemExit('D1 producer orchestration order invalid')

          m15_start = s.index('//| MODULE 15:')
          m16_start = s.index('//| MODULE 16:', m15_start)
          m17_start = s.index('//| MODULE 17:', m16_start)
          if 'd1_major_trend_owner' in s[m15_start:m16_start]:
              raise SystemExit('D1-01 scope breach: M15 consumes D1 owner')
          if 'd1_major_trend_owner' in s[m16_start:m17_start]:
              raise SystemExit('D1-01 scope breach: M16 consumes D1 owner')

          header_line = next((ln for ln in s.splitlines() if 'D1-01 M11 Strategic Owner' in ln), '')
          if not header_line.startswith('//| Version 4.5.1 - D1-01 M11 Strategic Owner'):
              raise SystemExit('D1-01 header build ID not left-aligned')

          def scrub(text: str) -> str:
              out=[]; i=0; n=len(text); state='code'
              while i<n:
                  ch=text[i]; nxt=text[i+1] if i+1<n else ''
                  if state=='code':
                      if ch=='/' and nxt=='/': state='line'; out.extend('  '); i+=2; continue
                      if ch=='/' and nxt=='*': state='block'; out.extend('  '); i+=2; continue
                      if ch=='"': state='string'; out.append(' '); i+=1; continue
                      out.append(ch); i+=1; continue
                  if state=='line':
                      if ch=='\n': state='code'; out.append('\n')
                      else: out.append(' ')
                      i+=1; continue
                  if state=='block':
                      if ch=='*' and nxt=='/': state='code'; out.extend('  '); i+=2
                      else: out.append('\n' if ch=='\n' else ' '); i+=1
                      continue
                  if state=='string':
                      if ch=='\\': out.extend('  '); i+=2; continue
                      if ch=='"': state='code'; out.append(' '); i+=1; continue
                      out.append('\n' if ch=='\n' else ' '); i+=1
              return ''.join(out)

          clean = scrub(s)
          for a,b in [('(',')'),('[',']'),('{','}')]:
              if clean.count(a) != clean.count(b):
                  raise SystemExit(f'Delimiter mismatch {a}{b}: {clean.count(a)} vs {clean.count(b)}')

          for module in range(1, 28):
              marker=f'MODULE {module:02d}:'
              if marker not in s:
                  raise SystemExit(f'Missing module marker {marker}')

          m11_start = s.index('//| MODULE 11:')
          m12_start = s.index('//| MODULE 12:', m11_start)
          m11 = s[m11_start:m12_start]
          for token in ['RSI', 'MACD', 'Stochastic', 'ADX', 'ATR(', 'News', 'Session']:
              if token in m11:
                  raise SystemExit(f'Forbidden non-Core token in M11: {token}')

          after_sha = hashlib.sha256(s.encode('utf-8')).hexdigest()
          Path('/tmp/d1_after_sha').write_text(after_sha, encoding='utf-8')
          PY

          AFTER_SHA=$(cat /tmp/d1_after_sha)

          cat > "$AUDIT" <<EOF
          # D1 Step 1 — M11 Strategic Owner Implementation Audit

          Date: 2026-08-24  
          Branch: `d1-owner-dev`  
          Status: **SOURCE MATERIALIZED / STATIC INTEGRITY PASS / NATIVE METAEDITOR COMPILE PENDING**

          ## Scope
          Materialize the approved M11 D1 strategic-owner producer only. M15/M16 D1 entry gating remains deliberately inactive until D1 Step 2.

          ## Canonical mapping implemented
          - BUY = latest fully closed D1 `Close > MA50` and MA50 rising versus previous closed D1;
          - SELL = latest fully closed D1 `Close < MA50` and MA50 falling versus previous closed D1;
          - valid disagreement/flat/equality = `D1_TRANSITION`;
          - invalid/incomplete required history = `D1_OWNER_UNRESOLVED`.

          ## Materialized changes
          - `ENUM_D1_OWNER_STATE`;
          - `D1MajorTrendOwner` in `PairState`;
          - fail-closed initialization;
          - M11 producer + diagnostic trace;
          - previous closed-D1 MA50 retrieval;
          - `ProcessPair`: D1 snapshot -> M11 D1 owner producer -> H4 runtime owner;
          - visible build/runtime ID `D1-01 M11 Strategic Owner`.

          ## Static integrity result
          **PASS**

          Verified:
          - patch applies/materializes cleanly;
          - `git diff --check` clean;
          - owner predicates unique;
          - closed-D1/history guards present;
          - producer orchestration order correct;
          - M15 and M16 do not consume D1 owner yet;
          - left-aligned source build ID;
          - delimiter sanity after comment/string scrub;
          - Module 01–27 markers preserved;
          - no RSI/MACD/Stochastic/ADX/ATR/news/session strategy pollution in M11.

          ## Source identity
          Before SHA-256: `$BEFORE_SHA`  
          After SHA-256: `$AFTER_SHA`

          ## Compile gate
          Native MT4 MetaEditor compilation remains mandatory. Target = **0 errors / 0 warnings**. Static Linux checks are not a substitute for native MQL4 compilation.

          ## Boundary
          No M15/M16 D1 strategic gate, M17, F7 targetless payload, risk, money management, order execution, live-position lifecycle, or dashboard active-count behavior was changed by D1-01.
          EOF

          rm -f blueprint/.d1-step1-dispatch
          rm -f .github/workflows/one-shot-apply-d1-step1.yml
          git diff --check

      - name: Commit D1-01 to working branch
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- blueprint/source/BBMA_EA.mq4 \
                      blueprint/D1_STEP1_M11_STRATEGIC_OWNER_IMPLEMENTATION_AUDIT_20260824.md \
                      blueprint/.d1-step1-dispatch \
                      .github/workflows/one-shot-apply-d1-step1.yml
          if git diff --cached --quiet; then
            echo 'No D1-01 changes to commit.'
            exit 0
          fi
          git commit -m "D1-01: materialize M11 strategic owner producer [skip ci]"
          git push origin HEAD:"$HEAD_REF"
