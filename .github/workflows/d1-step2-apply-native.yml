name: D1 Step2 M15-M16 strategic gate integration

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  apply-compile:
    if: github.event.issue.title == 'RUN D1 STEP2 APPLY NATIVE 20260824'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d1-owner-dev
          fetch-depth: 0

      - name: Apply D1-02 M15-M16 integration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path

          p = Path('blueprint/source/BBMA_EA.mq4')
          s = p.read_text(encoding='utf-8')

          def once(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected exactly 1 anchor, found {n}')
              s = s.replace(old, new, 1)

          once('//| Version 4.5.1 - D1-01 M11 Strategic Owner                        |',
               '//| Version 4.5.1 - D1-02 M15-M16 Strategic Gate                    |',
               'build header')

          once('   string               Pair;\n   \n   // MUTABLE LIFECYCLE',
               '''   string               Pair;

   // D1-02 frozen M11 strategic-owner identity for downstream M16 verification.
   ENUM_D1_OWNER_STATE  D1OwnerState;
   ENUM_DIRECTION       D1OwnerDirection;
   datetime             D1OwnerCandleTime;
   double               D1OwnerClose;
   double               D1OwnerMA50Current;
   double               D1OwnerMA50Previous;
   bool                 D1OwnerSnapshotValid;
   
   // MUTABLE LIFECYCLE''',
               'decision D1 payload')

          once('//| MODULE 15: PRIORITY ENGINE (FINAL SIGNAL AUTHORITY)              |\n//| LEVEL: EXPERT-RESTRICTED                                         |\n//+------------------------------------------------------------------+\n\nbool IsEntryModeCandidateAllowed',
               '''//| MODULE 15: PRIORITY ENGINE (FINAL SIGNAL AUTHORITY)              |
//| LEVEL: EXPERT-RESTRICTED                                         |
//+------------------------------------------------------------------+

bool IsD1MajorTrendOwnerExecutionReady(PairState &pairState)
{
   D1MajorTrendOwner owner = pairState.d1_major_trend_owner;

   if(!pairState.d1_data.is_valid || !pairState.d1_data.is_closed ||
      pairState.d1_data.timeframe != PERIOD_D1 ||
      pairState.d1_data.candle_time <= 0 || pairState.d1_data.close <= 0.0)
      return false;

   if(!owner.IsValid || owner.SourceCandleTime <= 0 ||
      owner.SourceCandleTime != pairState.d1_data.candle_time)
      return false;

   if(pairState.current_daily_ema50 <= 0.0 || pairState.prev_daily_ema50 <= 0.0)
      return false;

   if(owner.State == D1_OWNER_BUY_CONFIRMED)
      return (owner.Direction == DIR_BUY);

   if(owner.State == D1_OWNER_SELL_CONFIRMED)
      return (owner.Direction == DIR_SELL);

   return false;
}

bool IsCandidateAllowedByD1Owner(ValidatedSequenceCandidate &candidate,
                                 PairState &pairState)
{
   if(!IsD1MajorTrendOwnerExecutionReady(pairState)) return false;
   return (candidate.Direction == pairState.d1_major_trend_owner.Direction);
}

bool FreezeD1OwnerSnapshot(PairState &pairState, BBMA_Decision &decision)
{
   if(!IsD1MajorTrendOwnerExecutionReady(pairState)) return false;

   decision.D1OwnerState = pairState.d1_major_trend_owner.State;
   decision.D1OwnerDirection = pairState.d1_major_trend_owner.Direction;
   decision.D1OwnerCandleTime = pairState.d1_major_trend_owner.SourceCandleTime;
   decision.D1OwnerClose = pairState.d1_data.close;
   decision.D1OwnerMA50Current = pairState.current_daily_ema50;
   decision.D1OwnerMA50Previous = pairState.prev_daily_ema50;
   decision.D1OwnerSnapshotValid = true;
   return true;
}

bool IsEntryModeCandidateAllowed''',
               'M15 D1 helpers')

          once('void PriorityEngine_Atomic(ValidatedSequenceCandidate &candidates[], int count,\n                           BBMA_Decision &decision, OppositeConflictPackage &conflict)\n{\n   int buyCount = 0;\n   int sellCount = 0;\n\n   for(int i = 0; i < count; i++)\n   {\n      if(!IsCandidateEligible(candidates[i])) continue;\n      if(candidates[i].Direction == DIR_BUY) buyCount++;\n      else if(candidates[i].Direction == DIR_SELL) sellCount++;\n   }',
               '''void PriorityEngine_Atomic(ValidatedSequenceCandidate &candidates[], int count,
                           PairState &pairState,
                           BBMA_Decision &decision, OppositeConflictPackage &conflict)
{
   int structurallyEligible = 0;
   for(int i = 0; i < count; i++)
      if(IsCandidateEligible(candidates[i])) structurallyEligible++;

   // D1-02: D1 is the strategic new-entry gate. TRANSITION/UNRESOLVED
   // and stale/malformed owner identity fail closed before atomic direction selection.
   if(structurallyEligible > 0 && !IsD1MajorTrendOwnerExecutionReady(pairState))
   {
      Print("[D1-02][M15_D1_BLOCK] Pair=", pairState.actual_symbol,
            " State=", EnumToString(pairState.d1_major_trend_owner.State),
            " Dir=", EnumToString(pairState.d1_major_trend_owner.Direction),
            " Candle=", TimeToString(pairState.d1_major_trend_owner.SourceCandleTime));
      return;
   }

   int buyCount = 0;
   int sellCount = 0;

   for(int i = 0; i < count; i++)
   {
      if(!IsCandidateEligible(candidates[i])) continue;
      if(!IsCandidateAllowedByD1Owner(candidates[i], pairState)) continue;
      if(candidates[i].Direction == DIR_BUY) buyCount++;
      else if(candidates[i].Direction == DIR_SELL) sellCount++;
   }''',
               'PriorityEngine signature/gate')

          once('      if(!IsCandidateEligible(candidates[i])) continue;\n      if(candidates[i].Direction != targetDirection) continue;',
               '      if(!IsCandidateEligible(candidates[i])) continue;\n      if(!IsCandidateAllowedByD1Owner(candidates[i], pairState)) continue;\n      if(candidates[i].Direction != targetDirection) continue;',
               'canonical loop D1 filter')

          once('   ValidatedSequenceCandidate selected = candidates[canonicalIdx];\n   decision.Valid = true;',
               '''   ValidatedSequenceCandidate selected = candidates[canonicalIdx];
   if(!FreezeD1OwnerSnapshot(pairState, decision))
   {
      Print("[D1-02][M15_D1_BLOCK] Pair=", pairState.actual_symbol,
            " Reason=freeze_failed");
      return;
   }

   decision.Valid = true;''',
               'freeze D1 snapshot')

          once('            " Dir=", EnumToString(decision.Direction),\n            " Candle=", TimeToString(decision.CandleTime),\n            " DecisionID=", decision.DecisionID);',
               '            " Dir=", EnumToString(decision.Direction),\n            " D1State=", EnumToString(decision.D1OwnerState),\n            " D1Candle=", TimeToString(decision.D1OwnerCandleTime),\n            " Candle=", TimeToString(decision.CandleTime),\n            " DecisionID=", decision.DecisionID);',
               'Mode1 D1 trace')

          once('            " Dir=", EnumToString(decision.Direction),\n            " Candle=", TimeToString(decision.CandleTime),\n            " Components=", decision.ComponentCount,',
               '            " Dir=", EnumToString(decision.Direction),\n            " D1State=", EnumToString(decision.D1OwnerState),\n            " D1Candle=", TimeToString(decision.D1OwnerCandleTime),\n            " Candle=", TimeToString(decision.CandleTime),\n            " Components=", decision.ComponentCount,',
               'Mode2 D1 trace')

          once('bool ValidateDecisionOwnerSnapshot(int pairIndex, BBMA_Decision &decision,\n                                   bool &expired)',
               '''bool ValidateDecisionD1OwnerSnapshot(int pairIndex, BBMA_Decision &decision)
{
   if(pairIndex < 0 || pairIndex >= g_pair_count) return false;
   if(!decision.D1OwnerSnapshotValid) return false;

   PairState state = g_pair_states[pairIndex];
   if(!IsD1MajorTrendOwnerExecutionReady(state)) return false;

   D1MajorTrendOwner owner = state.d1_major_trend_owner;
   if(decision.D1OwnerState != owner.State) return false;
   if(decision.D1OwnerDirection != owner.Direction) return false;
   if(decision.Direction != owner.Direction) return false;
   if(decision.D1OwnerCandleTime != owner.SourceCandleTime) return false;
   if(decision.D1OwnerClose != state.d1_data.close) return false;
   if(decision.D1OwnerMA50Current != state.current_daily_ema50) return false;
   if(decision.D1OwnerMA50Previous != state.prev_daily_ema50) return false;

   return true;
}

bool ValidateDecisionOwnerSnapshot(int pairIndex, BBMA_Decision &decision,
                                   bool &expired)''',
               'M16 D1 verification helper')

          once('   bool ownerExpired = false;\n   if(!ValidateDecisionOwnerSnapshot(pairIndex, decision, ownerExpired))',
               '''   if(!ValidateDecisionD1OwnerSnapshot(pairIndex, decision))
   {
      decision.DecisionState = DEC_INVALIDATED;
      decision.RejectionReason = REJ_SEQUENCE_BREAK;
      Print("[D1-02][M16_D1_REJECT] Pair=", decision.Pair,
            " DecisionID=", decision.DecisionID,
            " FrozenState=", EnumToString(decision.D1OwnerState),
            " FrozenDir=", EnumToString(decision.D1OwnerDirection),
            " FrozenCandle=", TimeToString(decision.D1OwnerCandleTime));
      return;
   }

   bool ownerExpired = false;
   if(!ValidateDecisionOwnerSnapshot(pairIndex, decision, ownerExpired))''',
               'M16 D1 fail-closed gate')

          once('   PriorityEngine_Atomic(allCandidates, allCandidateCount, decision, conflict);',
               '   PriorityEngine_Atomic(allCandidates, allCandidateCount,\n                         g_pair_states[pairIndex], decision, conflict);',
               'M27 M15 call')

          once('   Log(DBG_FULL, "BBMA EA V4.5.1 D1-01 initialized successfully");',
               '   Log(DBG_FULL, "BBMA EA V4.5.1 D1-02 initialized successfully");',
               'OnInit build trace')

          p.write_text(s, encoding='utf-8')
          '@ | python

      - name: Static D1-02 integrity checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path
          s = Path('blueprint/source/BBMA_EA.mq4').read_text(encoding='utf-8')
          required = [
              'Version 4.5.1 - D1-02 M15-M16 Strategic Gate',
              'D1OwnerSnapshotValid',
              'IsD1MajorTrendOwnerExecutionReady',
              'IsCandidateAllowedByD1Owner',
              'FreezeD1OwnerSnapshot',
              '[D1-02][M15_D1_BLOCK]',
              'ValidateDecisionD1OwnerSnapshot',
              '[D1-02][M16_D1_REJECT]',
              'g_pair_states[pairIndex], decision, conflict',
          ]
          for x in required:
              if x not in s: raise SystemExit(f'missing required D1-02 anchor: {x}')
          if s.count('void PriorityEngine_Atomic(') != 1:
              raise SystemExit('PriorityEngine_Atomic definition count invalid')
          if s.count('PriorityEngine_Atomic(allCandidates') != 1:
              raise SystemExit('PriorityEngine_Atomic call count invalid')
          if s.count('ValidateDecisionD1OwnerSnapshot(pairIndex, decision)') != 1:
              raise SystemExit('M16 D1 verification call count invalid')
          if s.index('if(!IsCandidateAllowedByD1Owner(candidates[i], pairState)) continue;') > s.index('if(buyCount > 0 && sellCount > 0)'):
              raise SystemExit('D1 filter is not before atomic direction conflict check')
          if s.index('ValidateDecisionD1OwnerSnapshot(pairIndex, decision)') > s.index('ValidateDecisionOwnerSnapshot(pairIndex, decision, ownerExpired)'):
              raise SystemExit('M16 D1 revalidation is not before structural component revalidation')
          # Purity guards: D1-02 must not introduce forbidden filters or touch broker entry functions.
          insert_window = s[s.index('//| MODULE 15:'):s.index('//| MODULE 17:')]
          for forbidden in ['RSI', 'MACD', 'Stochastic', 'ADX', 'NewsFilter', 'SessionFilter']:
              if forbidden in insert_window:
                  raise SystemExit(f'forbidden filter introduced in M15/M16: {forbidden}')
          # Basic delimiter sanity.
          if s.count('{') != s.count('}'):
              raise SystemExit('brace imbalance')
          if s.count('(') != s.count(')'):
              raise SystemExit('parenthesis imbalance')
          print('D1_STEP2_STATIC=PASS')
          '@ | python
          git diff --check

      - name: Acquire official MT4 MetaEditor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $meta = Get-ChildItem 'C:\Program Files*' -Filter metaeditor.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $meta) {
            $url = 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt4/mt4setup.exe'
            Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\mt4setup.exe" -UseBasicParsing
            Start-Process -FilePath "$env:RUNNER_TEMP\mt4setup.exe" -ArgumentList '/auto' -Wait
            Start-Sleep -Seconds 5
            $meta = Get-ChildItem 'C:\Program Files*' -Filter metaeditor.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $meta) { throw 'MT4 MetaEditor not found' }
          "METAEDITOR=$($meta.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Native MetaEditor 0E0W compile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = (Resolve-Path '.\blueprint\source\BBMA_EA.mq4').Path
          $log = Join-Path $env:RUNNER_TEMP 'd1-step2-metaeditor.log'
          & "$env:METAEDITOR" "/compile:$src" "/log:$log"
          Start-Sleep -Seconds 2
          if (-not (Test-Path $log)) { throw 'MetaEditor compile log missing' }
          $txt = Get-Content $log -Raw
          $txt | Write-Host
          $ex4 = [System.IO.Path]::ChangeExtension($src,'.ex4')
          if (-not (Test-Path $ex4)) { throw 'MetaEditor did not produce EX4' }
          $matches = [regex]::Matches($txt, '(?i)(\d+)\s+errors?,\s*(\d+)\s+warnings?')
          if ($matches.Count -lt 1) { throw 'Unable to parse MetaEditor summary' }
          $m = $matches[$matches.Count - 1]
          $errors = [int]$m.Groups[1].Value
          $warnings = [int]$m.Groups[2].Value
          if ($errors -ne 0 -or $warnings -ne 0) { throw "Compile failed: $errors errors / $warnings warnings" }
          "D1_STEP2_ERRORS=$errors" | Out-File -FilePath $env:GITHUB_ENV -Append
          "D1_STEP2_WARNINGS=$warnings" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Record contracts and implementation audit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path

          overlays = {
            Path('blueprint/contracts/M15_FINAL_SIGNAL_AUTHORITY_CONTRACT.md'): '''

## D1-02 implementation record — `d1-owner-dev`
The 2026-08-24 D1 strategic gate is now implemented on the isolated `d1-owner-dev` branch as build `Version 4.5.1 - D1-02 M15-M16 Strategic Gate`.

Implemented behavior:
- M15 consumes the M11 owner result rather than recalculating D1/MA50;
- `D1_TRANSITION` / `D1_OWNER_UNRESOLVED` / stale owner identity block new-entry authority;
- opposite-D1 candidates are filtered before the atomic surviving-direction conflict check;
- exact REM/RRE/REE signatures remain unchanged;
- selected decisions freeze D1 owner state/direction/candle plus D1 close and MA50 identity for M16.

Native MT4 MetaEditor gate for this isolated branch: **0 errors / 0 warnings**.
`blueprint-dev` remains unchanged pending explicit integration approval.
''',
            Path('blueprint/contracts/M16_CONFLICT_INVALIDATION_CONTRACT.md'): '''

## D1-02 implementation record — `d1-owner-dev`
The 2026-08-24 D1 strategic-owner revalidation is now implemented on the isolated `d1-owner-dev` branch as build `Version 4.5.1 - D1-02 M15-M16 Strategic Gate`.

Implemented behavior:
- M16 verifies the frozen M15 D1 snapshot against the current M11-produced owner identity;
- transition/unresolved/opposite/stale/identity-mismatch fails closed before structural component revalidation;
- M16 does not duplicate the price-vs-MA50 slope formula;
- D1 strategic failure invalidates only the pending new-entry decision and is not a live-position close rule.

Native MT4 MetaEditor gate for this isolated branch: **0 errors / 0 warnings**.
`blueprint-dev` remains unchanged pending explicit integration approval.
'''
          }
          for p, overlay in overlays.items():
              s = p.read_text(encoding='utf-8')
              if '## D1-02 implementation record — `d1-owner-dev`' not in s:
                  p.write_text(s.rstrip() + overlay + '\n', encoding='utf-8')

          audit = Path('blueprint/D1_STEP2_M15_M16_STRATEGIC_GATE_IMPLEMENTATION_AUDIT_20260824.md')
          audit.write_text('''# D1 Step 2 — M15/M16 Strategic Gate Implementation Audit

Date: 2026-08-24  
Branch: `d1-owner-dev`  
Build: `Version 4.5.1 - D1-02 M15-M16 Strategic Gate`  
Status: **IMPLEMENTED / STATIC PASS / NATIVE METAEDITOR 0E0W PASS**

## Scope
This step implements only the already-reconciled D1 strategic new-entry gate and downstream frozen-owner revalidation.

## M15 result
- consumes M11 `D1MajorTrendOwner`;
- confirmed BUY permits BUY candidates only;
- confirmed SELL permits SELL candidates only;
- transition/unresolved/stale owner blocks new entries;
- D1 filtering occurs before opposite-direction atomic conflict evaluation;
- exact REM/RRE/REE component signatures are unchanged;
- selected decisions freeze D1 state, direction, closed-D1 candle, close, current MA50 and previous MA50.

## M16 result
- verifies frozen D1 identity against the same current M11 owner snapshot;
- transition/unresolved/opposite/stale/identity mismatch invalidates the pending new-entry decision fail-closed;
- no second D1 trend formula is introduced;
- no live-position close authority is added.

## Boundary
No F7 targetless TP, M17, M22, M23/M24 lifecycle, risk, lot sizing or broker-execution behavior is changed in D1-02.
`blueprint-dev` remains frozen and unchanged.

## Verification
- focused static integrity checks: PASS;
- forbidden-filter purity guard: PASS;
- MT4 MetaEditor: **0 errors / 0 warnings**;
- EX4 produced successfully.
''', encoding='utf-8')
          '@ | python
          git diff --check

      - name: Commit D1-02 isolated implementation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- blueprint/source/BBMA_EA.mq4 blueprint/contracts/M15_FINAL_SIGNAL_AUTHORITY_CONTRACT.md blueprint/contracts/M16_CONFLICT_INVALIDATION_CONTRACT.md blueprint/D1_STEP2_M15_M16_STRATEGIC_GATE_IMPLEMENTATION_AUDIT_20260824.md
          $blob = (git rev-parse :blueprint/source/BBMA_EA.mq4).Trim()
          "D1_STEP2_SOURCE_BLOB=$blob" | Out-File -FilePath $env:GITHUB_ENV -Append
          git commit -m "D1-02: integrate M15-M16 strategic owner gate [skip ci]"
          $commit = (git rev-parse HEAD).Trim()
          "D1_STEP2_COMMIT=$commit" | Out-File -FilePath $env:GITHUB_ENV -Append
          git push origin HEAD:d1-owner-dev

      - name: Report success
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $body = @"
          D1-02 integration PASS.

          - Branch: d1-owner-dev
          - Commit: $env:D1_STEP2_COMMIT
          - Source blob: $env:D1_STEP2_SOURCE_BLOB
          - Native MetaEditor: 0 errors / 0 warnings
          - Scope: M15 D1 strategic gate + frozen payload + M16 owner revalidation only
          - blueprint-dev: unchanged
          "@
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body $body

  close-issue:
    if: always() && github.event.issue.title == 'RUN D1 STEP2 APPLY NATIVE 20260824'
    needs: apply-compile
    runs-on: ubuntu-latest
    steps:
      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.apply-compile.result }}
        run: |
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --comment "D1-02 one-shot integration workflow result: ${RESULT}."
