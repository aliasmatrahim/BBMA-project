name: D1TPW checkpoint hardening selftest

on:
  pull_request:
    branches:
      - nmje-v2-m5-dev
    paths:
      - 'blueprint/source/BBMA_EA.mq4'
      - 'blueprint/contracts/D1_TPW_LIFECYCLE_HARDENING_CONTRACT.md'
      - 'blueprint/implementation/D1_TPW_CHECKPOINT_HARDENING_RECORD_20260829.md'
      - 'blueprint/tests/test_d1_tpw_checkpoint_hardening_static.py'
      - 'blueprint/tests/test_d1_tpw_checkpoint_restart_model.py'
      - '.github/workflows/d1-tpw-checkpoint-hardening-selftest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d1-tpw-checkpoint-hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify dormant authority and checkpoint source firewall
        run: python3 blueprint/tests/test_d1_tpw_checkpoint_hardening_static.py

      - name: Run deterministic restart model
        run: python3 blueprint/tests/test_d1_tpw_checkpoint_restart_model.py

      - name: Compile test harness
        run: |
          python3 -m py_compile \
            blueprint/tests/test_d1_tpw_checkpoint_hardening_static.py \
            blueprint/tests/test_d1_tpw_checkpoint_restart_model.py
          echo 'D1_TPW_CHECKPOINT_HARDENING_SELFTEST=PASS'

