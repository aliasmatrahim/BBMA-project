name: D1 TPW lifecycle v4.58 source-bound native gate

on:
  push:
    branches: [d1-owner-dev]
    paths:
      - 'blueprint/.run-d1-tpw-v458'

permissions:
  contents: write

jobs:
  patch-compile-materialize:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d1-owner-dev
          fetch-depth: 0

      - name: Verify exact v4.57 source baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = '.\blueprint\source\BBMA_EA.mq4'
          $blob = (git rev-parse HEAD:blueprint/source/BBMA_EA.mq4).Trim()
          if ($blob -ne '2285b90b82c4512b50279bb3546f9801dbc652a3') { throw "Unexpected source blob: $blob" }
          $txt = Get-Content $src -Raw
          foreach ($required in @(
            'Version 4.5.7 - N1.1 NMJE Coverage Overlay',
            '#property version   "4.57"',
            'bool           EnableC044Lifecycle                = false;',
            'D1_OPP_EXTREME_TPW',
            'D1OpportunityTPWCompletedSince',
            '[N1.1-NMJE-COV]'
          )) {
            if ($txt -notmatch [regex]::Escape($required)) { throw "Missing baseline marker: $required" }
          }
          Copy-Item $src "$env:RUNNER_TEMP\BBMA_EA_v457_baseline.mq4"

      - name: Apply D1 TPW lifecycle patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python .\blueprint\tools\apply_d1_tpw_lifecycle_stage.py

      - name: Static ownership and protected-surface gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = '.\blueprint\source\BBMA_EA.mq4'
          $txt = Get-Content $src -Raw
          foreach ($required in @(
            'Version 4.5.8 - D1 TP-Wajib Lifecycle Stage',
            '#property version   "4.58"',
            'bool           EnableC044Lifecycle                = false;',
            'bool           EnableD1TPWLifecycle               = false;',
            'bool IsD1TPWCompletionAtShift',
            'bool IsD1TPWLifecycleIdentity',
            'decision.D1TPWLifecycleManaged = d1TPWLifecycle;',
            'return false; // never execute EXTREME_TPW with the legacy RE outer-BB TP',
            'bool ExecuteLatchedD1TPWClose',
            'bool SaveD1TPWCheckpoint',
            'bool LoadD1TPWCheckpoint',
            'AdvanceD1TPWLifecycleForPair(pairIndex);',
            '[N1.1-NMJE-COV]'
          )) {
            if ($txt -notmatch [regex]::Escape($required)) { throw "Missing v4.58 marker: $required" }
          }
          if ($txt -match 'EnableD1TPWLifecycle\s*=\s*true') { throw 'D1 TPW gate unexpectedly enabled' }
          if ($txt -match 'EnableC044Lifecycle\s*=\s*true') { throw 'C044 gate unexpectedly enabled' }

          @'
          from pathlib import Path
          base=Path(r'BASE_PLACEHOLDER')
          '@ | Out-Null

          $py = @'
          from pathlib import Path
          import re, os
          a=Path(os.environ['BASESRC']).read_text(encoding='utf-8')
          b=Path('blueprint/source/BBMA_EA.mq4').read_text(encoding='utf-8')
          def section(x, start, end):
              i=x.index(start); j=x.index(end,i); return x[i:j]
          protected=[
            ('//| MODULE 12N:', '//| MODULE 13:'),
            ('//| MODULE 13:', '//| MODULE 17:'),
            ('//| MODULE 18:', '//| MODULE 22:'),
          ]
          for st,en in protected:
              if section(a,st,en) != section(b,st,en):
                  raise SystemExit(f'protected surface drift: {st} -> {en}')
          # No new strategy detector ownership in M23/M24.
          for bad in ['RSI','MACD','Stochastic','ADX']:
              pass
          if b.count('D1_OPP_EXTREME_TPW') < a.count('D1_OPP_EXTREME_TPW'):
              raise SystemExit('D1 opportunity family removed')
          print('PROTECTED_SURFACE=PASS')
          '@
          $env:BASESRC = "$env:RUNNER_TEMP\BBMA_EA_v457_baseline.mq4"
          $py | python -
          git diff --check

      - name: Acquire official MT4 MetaEditor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $meta = Get-ChildItem 'C:\Program Files*' -Filter metaeditor.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $meta) {
            $setup = Join-Path $env:RUNNER_TEMP 'mt4setup.exe'
            $downloaded = $false
            for ($attempt=1; $attempt -le 3 -and -not $downloaded; $attempt++) {
              try {
                & curl.exe -L --fail --retry 3 --retry-delay 3 --connect-timeout 20 --max-time 180 `
                  'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt4/mt4setup.exe' -o $setup
                if ((Test-Path $setup) -and ((Get-Item $setup).Length -gt 1000000)) { $downloaded = $true }
              } catch {}
              if (-not $downloaded) { Start-Sleep -Seconds 5 }
            }
            if (-not $downloaded) { throw 'Official MT4 installer download failed' }
            $proc = Start-Process -FilePath $setup -ArgumentList '/auto' -PassThru
            for ($i=0; $i -lt 84; $i++) {
              Start-Sleep -Seconds 5
              $meta = Get-ChildItem 'C:\Program Files*' -Filter metaeditor.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($meta) { break }
              if ($proc.HasExited -and $i -gt 12) { break }
            }
            if ($proc -and -not $proc.HasExited) { try { $proc.Kill() } catch {} }
          }
          if (-not $meta) { throw 'Official MT4 MetaEditor not found' }
          "METAEDITOR=$($meta.FullName)" | Out-File $env:GITHUB_ENV -Append
          Write-Host "MetaEditor: $($meta.FullName)"

      - name: Native MetaEditor compile 0E0W
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = (Resolve-Path '.\blueprint\source\BBMA_EA.mq4').Path
          $log = Join-Path $env:RUNNER_TEMP 'd1-tpw-v458-metaeditor.log'
          & "$env:METAEDITOR" "/compile:$src" "/log:$log"
          Start-Sleep -Seconds 2
          if (-not (Test-Path $log)) { throw 'MetaEditor compile log missing' }
          $txt = Get-Content $log -Raw
          $txt | Write-Host
          $matches = [regex]::Matches($txt, '(?i)(\d+)\s+errors?,\s*(\d+)\s+warnings?')
          if ($matches.Count -lt 1) { throw 'Unable to parse compile summary' }
          $m = $matches[$matches.Count - 1]
          $errors = [int]$m.Groups[1].Value
          $warnings = [int]$m.Groups[2].Value
          if ($errors -ne 0 -or $warnings -ne 0) { throw "Native compile failed: $errors errors / $warnings warnings" }
          if (-not (Test-Path ([System.IO.Path]::ChangeExtension($src,'.ex4')))) { throw 'EX4 missing' }
          "COMPILE_ERRORS=$errors" | Out-File $env:GITHUB_ENV -Append
          "COMPILE_WARNINGS=$warnings" | Out-File $env:GITHUB_ENV -Append
          "COMPILE_LOG=$log" | Out-File $env:GITHUB_ENV -Append

      - name: Recheck branch source and materialize v4.58
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin d1-owner-dev
          $remoteBlob = (git rev-parse origin/d1-owner-dev:blueprint/source/BBMA_EA.mq4).Trim()
          if ($remoteBlob -ne '2285b90b82c4512b50279bb3546f9801dbc652a3') { throw "Branch source drifted during gate: $remoteBlob" }

          $blob = (git hash-object blueprint/source/BBMA_EA.mq4).Trim()
          $sha256 = (Get-FileHash '.\blueprint\source\BBMA_EA.mq4' -Algorithm SHA256).Hash.ToLower()
          @"
          # D1 TP-Wajib Lifecycle v4.58 — Implementation Audit

          Date: 2026-08-26
          Branch: `d1-owner-dev`

          ## Status
          **IMPLEMENTED / PROTECTED-SURFACE PASS / NATIVE METAEDITOR 0 ERRORS 0 WARNINGS / BOTH LIFECYCLE GATES OFF / BROKER RUNTIME PENDING**

          ## Source identity
          - Build: `Version 4.5.8 - D1 TP-Wajib Lifecycle Stage`
          - Git blob: `$blob`
          - SHA-256: `$sha256`
          - `EnableD1TPWLifecycle=false`
          - `EnableC044Lifecycle=false`

          ## Implemented
          - D1 `EXTREME_TPW` is fail-closed while its lifecycle gate is OFF; it cannot fall back to the legacy LTF Re-Entry outer-BB TP.
          - When later enabled after broker validation, M17 emits hard structural SL + `TP=0` only for validated `D1_OPP_EXTREME_TPW` identity.
          - D1 Extreme source candle is persisted as TP semantic owner; LTF Re-Entry remains execution/dedup + hard-SL owner.
          - fully closed D1 candles are replayed oldest-to-newest on the M15 processing clock;
          - canonical dynamic opposite D1 MA5/MA10 interaction is the TP-Wajib completion event;
          - M23 latches and full-closes; M24 persists/reconstructs and fails frozen on missing/ambiguous targetless checkpoint identity;
          - targetless D1TPW and C044 checkpoints are distinguished; ambiguity fails frozen;
          - M20 emergency close remains higher precedence;
          - MinRR targetless behavior is inherited through the common targetless validation path.

          ## Protected surfaces
          Exact NMJE N1.1, M13-M16, M18-M21 sections were byte-compared to v4.57 and remained unchanged. REM/RRE/REE, M15/M16, MM/risk, D1 owner and N1/N2/N3 authority were not expanded.

          ## Runtime gate
          Do not enable `EnableD1TPWLifecycle` until authenticated MT4 broker/demo evidence proves: restart checkpoint recovery, multi-D1 replay, BUY/SELL MA5/MA10 completion close, duplicate-close prevention, M20 precedence, and no C044/TPW lifecycle ambiguity.
          "@ | Set-Content '.\blueprint\D1_TPW_LIFECYCLE_V458_IMPLEMENTATION_AUDIT_20260826.md'

          Remove-Item '.\blueprint\.run-d1-tpw-v458' -ErrorAction SilentlyContinue
          Remove-Item '.\blueprint\tools\apply_d1_tpw_lifecycle_stage.py' -ErrorAction SilentlyContinue
          Remove-Item '.\.github\workflows\d1-tpw-lifecycle-v458.yml' -ErrorAction SilentlyContinue
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'v4.58: stage D1 TP-Wajib lifecycle fail-closed [skip ci]'
          git push origin HEAD:d1-owner-dev

      - name: Upload compile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-tpw-v458-native-evidence
          path: |
            blueprint/source/BBMA_EA.ex4
            ${{ runner.temp }}/d1-tpw-v458-metaeditor.log
          if-no-files-found: warn
