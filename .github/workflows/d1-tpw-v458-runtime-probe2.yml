name: D1 TPW v4.58 runtime probe 2

# Historical reproduction only. The active implementation branch has advanced
# beyond v4.58, so this probe must not gate unrelated d1-owner-dev PRs.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-probe:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run source-bound MT4 probe against exact historical source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $historical = Join-Path $env:RUNNER_TEMP 'bbma-v458-source'
          if (Test-Path $historical) { Remove-Item $historical -Recurse -Force }
          git worktree add --detach $historical 02e5434e4f59ea538976df7254bbaf2fc9f1da9d
          if ($LASTEXITCODE -ne 0) { throw 'Unable to materialize historical v4.58 worktree' }
          $probe = Join-Path $env:GITHUB_WORKSPACE 'blueprint\ci\d1_tpw_v458_runtime_probe.ps1'
          if (-not (Test-Path $probe)) { throw 'Current historical-probe script missing' }
          Push-Location $historical
          try { & $probe }
          finally { Pop-Location }

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-tpw-v458-runtime-probe2-evidence
          path: |
            ${{ runner.temp }}/d1-tpw-v458-runtime-summary.txt
            ${{ runner.temp }}/d1-tpw-v458-runtime-compile.log
            ${{ runner.temp }}/d1-tpw-v458-runtime-combined.log
          if-no-files-found: warn
