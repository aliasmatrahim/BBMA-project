name: D1 TPW v4.58 runtime probe 2

# Historical reproduction only. The active implementation branch has advanced
# beyond v4.58, so this probe must not gate unrelated d1-owner-dev PRs.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-probe:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # Exact historical commit whose canonical EA blob is the v4.58
          # identity required by d1_tpw_v458_runtime_probe.ps1.
          ref: 02e5434e4f59ea538976df7254bbaf2fc9f1da9d
          fetch-depth: 0

      - name: Run source-bound MT4 probe
        shell: pwsh
        run: .\blueprint\ci\d1_tpw_v458_runtime_probe.ps1

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-tpw-v458-runtime-probe2-evidence
          path: |
            ${{ runner.temp }}/d1-tpw-v458-runtime-summary.txt
            ${{ runner.temp }}/d1-tpw-v458-runtime-compile.log
            ${{ runner.temp }}/d1-tpw-v458-runtime-combined.log
          if-no-files-found: warn
