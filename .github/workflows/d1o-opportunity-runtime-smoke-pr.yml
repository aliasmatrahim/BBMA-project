name: D1O-03 Opportunity Execution Runtime Smoke

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]
    paths:
      - 'blueprint/.run-d1o-opportunity-runtime-smoke'

permissions:
  contents: write
  pull-requests: read

jobs:
  runtime-d1-target:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d1-owner-dev
          fetch-depth: 0

      - name: Verify materialized D1O build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = '.\blueprint\source\BBMA_EA.mq4'
          if (-not (Test-Path $src)) { throw 'EA source missing' }
          $txt = Get-Content $src -Raw
          if ($txt -notmatch 'Version 4\.5\.1 - D1O-02 Opportunity Execution') { throw 'D1O-02 build not materialized' }
          if (-not (Test-Path '.\blueprint\D1O_STEP2_OPPORTUNITY_EXECUTION_AUDIT_20260825.md')) { throw 'D1O-02 native compile audit missing' }
          $head = (git rev-parse HEAD).Trim()
          $blob = (git rev-parse HEAD:blueprint/source/BBMA_EA.mq4).Trim()
          "TARGET_HEAD=$head" | Out-File -FilePath $env:GITHUB_ENV -Append
          "D1O_BLOB=$blob" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Acquire official MT4 portable runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dirs = @('C:\Program Files (x86)\MetaTrader 4','C:\Program Files\MetaTrader 4')
          $installDir = $null
          foreach ($dir in $dirs) {
            if ((Test-Path (Join-Path $dir 'metaeditor.exe')) -and (Test-Path (Join-Path $dir 'terminal.exe'))) { $installDir = $dir; break }
          }
          if (-not $installDir) {
            $setup = Join-Path $env:RUNNER_TEMP 'mt4setup.exe'
            Invoke-WebRequest -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt4/mt4setup.exe' -OutFile $setup -UseBasicParsing
            $proc = Start-Process -FilePath $setup -ArgumentList '/auto' -PassThru
            for ($i=0; $i -lt 84; $i++) {
              Start-Sleep -Seconds 5
              foreach ($dir in $dirs) {
                if ((Test-Path (Join-Path $dir 'metaeditor.exe')) -and (Test-Path (Join-Path $dir 'terminal.exe'))) { $installDir = $dir; break }
              }
              if ($installDir) { break }
              if ($proc.HasExited -and $i -gt 12) { break }
            }
            if ($proc -and -not $proc.HasExited) { try { $proc.Kill() } catch {} }
          }
          if (-not $installDir) { throw 'Official MT4 terminal/metaeditor not found' }
          $portable = Join-Path $env:RUNNER_TEMP 'mt4portable'
          if (Test-Path $portable) { Remove-Item $portable -Recurse -Force }
          New-Item -ItemType Directory -Path $portable | Out-Null
          Copy-Item "$installDir\*" $portable -Recurse -Force
          "MT4DIR=$portable" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Native compile before runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expertsDir = Join-Path $env:MT4DIR 'MQL4\Experts'
          New-Item -ItemType Directory -Path $expertsDir -Force | Out-Null
          $dst = Join-Path $expertsDir 'BBMA_EA.mq4'
          Copy-Item '.\blueprint\source\BBMA_EA.mq4' $dst -Force
          $log = Join-Path $env:RUNNER_TEMP 'd1o-runtime-compile.log'
          & (Join-Path $env:MT4DIR 'metaeditor.exe') "/compile:$dst" "/log:$log"
          Start-Sleep -Seconds 2
          if (-not (Test-Path $log)) { throw 'MetaEditor compile log missing' }
          $txt = Get-Content $log -Raw
          $matches = [regex]::Matches($txt, '(?i)(\d+)\s+errors?,\s*(\d+)\s+warnings?')
          if ($matches.Count -lt 1) { throw 'Unable to parse MetaEditor summary' }
          $m = $matches[$matches.Count - 1]
          if ([int]$m.Groups[1].Value -ne 0 -or [int]$m.Groups[2].Value -ne 0) { throw 'Runtime precompile is not 0E0W' }
          if (-not (Test-Path ([System.IO.Path]::ChangeExtension($dst,'.ex4')))) { throw 'EX4 not produced' }

      - name: Launch MT4 with trading disabled
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ini = Join-Path $env:RUNNER_TEMP 'd1o-runtime.ini'
          @'
[Common]
EnableNews=false

[Experts]
ExpertsEnable=true
ExpertsDllImport=false
ExpertsExpImport=false
ExpertsTrades=false

[StartUp]
Symbol=EURUSD
Period=M15
Expert=BBMA_EA
'@ | Set-Content -Path $ini -Encoding Ascii
          $proc = Start-Process -FilePath (Join-Path $env:MT4DIR 'terminal.exe') -ArgumentList '/portable', "/config:$ini" -PassThru
          for ($i=0; $i -lt 15; $i++) {
            Start-Sleep -Seconds 5
            if ($proc.HasExited) { break }
          }
          if (-not $proc.HasExited) { try { $proc.CloseMainWindow() | Out-Null } catch {}; Start-Sleep -Seconds 2 }
          if (-not $proc.HasExited) { try { $proc.Kill() } catch {} }

      - name: Inspect Journal and Experts logs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $journal = @(Get-ChildItem (Join-Path $env:MT4DIR 'logs') -Filter '*.log' -File -ErrorAction SilentlyContinue | Sort-Object LastWriteTime)
          $expert = @(Get-ChildItem (Join-Path $env:MT4DIR 'MQL4\Logs') -Filter '*.log' -File -ErrorAction SilentlyContinue | Sort-Object LastWriteTime)
          $all = @($journal) + @($expert)
          if ($all.Count -eq 0) { throw 'No MT4 Journal/Experts logs produced' }
          $combinedPath = Join-Path $env:RUNNER_TEMP 'd1o-runtime-combined.log'
          $combined = ''
          foreach ($f in $all) {
            $combined += "`r`n===== $($f.FullName) =====`r`n"
            $combined += (Get-Content $f.FullName -Raw -ErrorAction SilentlyContinue)
          }
          $combined | Set-Content $combinedPath -Encoding UTF8
          ($combined -split "`r?`n" | Select-Object -Last 300) | ForEach-Object { Write-Host $_ }
          foreach ($p in @('array out of range','zero divide','critical runtime error','access violation','stack overflow','invalid pointer','cannot load expert','expert initialization failed','init failed')) {
            if ($combined -match [regex]::Escape($p)) { throw "Fatal MT4 runtime signature detected: $p" }
          }
          $classification = 'ATTACH_OK_NO_BROKER_DATA'
          if ($combined -match '\[P3S1\]\[PASS\] EA initialized successfully') {
            $classification = 'EA_INIT_OK'
          } elseif (($combined -match '(?i)not connected') -or ($combined -match '(?i)no prices') -or ($combined -match '(?i)waiting for update') -or ($combined -match '\[P3S1\]\[FAIL\] No valid pairs loaded')) {
            $classification = 'ENVIRONMENT_BLOCKED_NO_BROKER_DATA'
          }
          "RUNTIME_CLASSIFICATION=$classification" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "D1O_RUNTIME_CLASSIFICATION=$classification"

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1o-03-runtime-smoke-evidence
          path: |
            ${{ runner.temp }}/d1o-runtime-compile.log
            ${{ runner.temp }}/d1o-runtime-combined.log
          if-no-files-found: warn

      - name: Record runtime smoke audit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $audit = @"
          # D1O-03 — Opportunity Execution MT4 Runtime Smoke Audit

          Date: 2026-08-25  
          Branch: ``d1-owner-dev``  
          Source blob: ``$env:D1O_BLOB``  
          Runtime classification: **$env:RUNTIME_CLASSIFICATION**

          Native pre-runtime compile was 0 errors / 0 warnings. Journal/Experts scan found no fatal runtime signatures. Trading was disabled during this smoke. A no-broker-data classification is an environment limitation and is not broker-connected semantic validation.
          "@
          Set-Content '.\blueprint\D1O_STEP3_RUNTIME_SMOKE_AUDIT_20260825.md' $audit -Encoding UTF8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blueprint/D1O_STEP3_RUNTIME_SMOKE_AUDIT_20260825.md
          git commit -m 'D1O-03: record opportunity runtime smoke [skip ci]'
          git fetch origin d1-owner-dev
          $remote = (git rev-parse origin/d1-owner-dev).Trim()
          if ($remote -ne $env:TARGET_HEAD) { throw "d1-owner-dev moved during runtime smoke: remote=$remote expected=$env:TARGET_HEAD" }
          git push origin HEAD:d1-owner-dev
