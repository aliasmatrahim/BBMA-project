name: D1O-07 Mode1 cross-module regression

on:
  push:
    branches:
      - d1-owner-dev
    paths:
      - 'blueprint/.d1o07-mode1-crossmodule-trigger'

permissions:
  contents: read

jobs:
  static-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d1-owner-dev
          fetch-depth: 0

      - name: Verify D1O-07 Mode1 and cross-module invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re

          p = Path('blueprint/source/BBMA_EA.mq4')
          s = p.read_text(encoding='utf-8')

          def fn(name, next_marker=None):
              start = s.find(name)
              assert start >= 0, f'missing {name}'
              if next_marker:
                  end = s.find(next_marker, start + len(name))
                  assert end > start, f'missing end marker {next_marker} after {name}'
                  return s[start:end]
              return s[start:]

          assert 'Version 4.5.1 - D1O-07 Canonical LTF Dedup' in s

          mode = fn('bool IsEntryModeCandidateAllowed', 'bool IsCandidateEligible')
          assert 'if(EntryMode == 1)' in mode
          assert 'return (candidate.SequenceType == SIGNAL_RE_ENTRY);' in mode
          assert 'SIGNAL_REM' in mode and 'SIGNAL_RRE' in mode and 'SIGNAL_REE' in mode

          standalone = fn('void BuildConfirmedReEntryCandidate', 'void AppendValidatedCandidate')
          for needle in [
              'reEntry.Timeframe != PERIOD_H1',
              '!h4Owner.RecoveryComplete',
              '!h4Owner.IsValid',
              'h4Owner.State != H4_OWNER_ACTIVE',
              'h4Owner.Direction != reEntry.Direction',
              'candidate.SequenceType = SIGNAL_RE_ENTRY',
              'RE_ENTRY|'
          ]:
              assert needle in standalone, needle

          d1opp = fn('void BuildD1OpportunityCandidate', 'datetime GetCandidateAnchorTime')
          assert 'if(EntryMode != MODE_2_ALL_VALIDATED_BBMA) return;' in d1opp
          assert 'ReEntryData identityRE = h1Fresh ? h1 : m15;' in d1opp
          assert 'string canonicalIdentity = "RE_ENTRY|"' in d1opp
          assert 'candidate.D1OpportunityCycleID = opportunity.CycleID;' in d1opp

          d1gate = fn('bool IsCandidateAllowedByD1Owner', 'bool FreezeD1OwnerSnapshot')
          assert 'if(candidate.UsesD1Opportunity)' in d1gate
          assert 'if(!IsD1MajorTrendOwnerExecutionReady(pairState)) return false;' in d1gate
          assert 'candidate.Direction == pairState.d1_major_trend_owner.Direction' in d1gate

          m15 = fn('void PriorityEngine_Atomic', '//+------------------------------------------------------------------+\n//| MODULE 16')
          assert 'if(!IsCandidateAllowedByD1Owner(candidates[i], pairState)) continue;' in m15
          assert 'FreezeD1OpportunitySnapshot' in m15 and 'FreezeD1OwnerSnapshot' in m15
          assert 'decision.DecisionID = GenerateDecisionID' in m15

          m16 = fn('void InvalidationEngine_Atomic', '//+------------------------------------------------------------------+\n//| MODULE 17')
          assert 'ValidateDecisionD1AuthoritySnapshot(pairIndex, decision)' in m16
          assert 'ValidateDecisionOwnerSnapshot(pairIndex, decision, ownerExpired)' in m16
          assert m16.find('ValidateDecisionD1AuthoritySnapshot') < m16.find('ValidateDecisionOwnerSnapshot')
          assert 'decision.DecisionState = DEC_VALIDATED;' in m16

          m17 = fn('bool IsApprovedSLTPSourceComponent', 'int ResolveClosedSourceShift')
          assert 'if(decision.SignalType == SIGNAL_RE_ENTRY)' in m17
          assert 'return (source.Timeframe == PERIOD_H1);' in m17
          assert 'D1_AUTH_OPPORTUNITY' in m17 and 'PERIOD_M15' in m17

          pre = fn('bool RunEntryPreflightAndExecute', '//+------------------------------------------------------------------+\n//| MODULE 23')
          for needle in [
              'decision.DecisionState != DEC_VALIDATED',
              'ResolveExecutionReferencePrice',
              'ResolveApprovedInitialSLTP',
              'ValidateSLTP',
              'CalculateLotSize',
              'CheckRiskBeforeTrade',
              'FinalPortfolioGuard',
              'ProcessEntry(decision, pair, snapshot, lot)'
          ]:
              assert needle in pre, needle

          m22 = fn('int FindExistingExecutionTicket', '// N2-13: read-only closed-order outcome telemetry.')
          assert '"BBMA|H:" + SHORT_HASH(decisionID)' in m22
          assert 'IsDecisionExecuted(decision.DecisionID)' in m22
          assert 'FindExistingExecutionTicket' in m22

          comment = fn('string CreateOrderComment', 'bool ParseOrderCommentFull')
          assert '"BBMA|H:" + hash' in comment
          assert '"|Q:" + seqHash' in comment

          recovery = fn('void RecoverExistingOrders', '//+------------------------------------------------------------------+\n//| MODULE 25')
          for needle in [
              'ExtractExecutionHash(comment, executionHash)',
              'ParseOrderCommentFull',
              'decisionHash != executionHash',
              'parsedDirection != liveDirection',
              'info.execution_hash = executionHash',
              'info.sequence_hash_short = sequenceHash',
              'UpsertExecutionHashTombstone'
          ]:
              assert needle in recovery, needle

          process = fn('void ProcessPair', 'void OnTickMain')
          order = [
              'PriorityEngine_Atomic(allCandidates, allCandidateCount',
              'InvalidationEngine_Atomic(pairIndex, decision, conflict)',
              'NMJE_PrintValidatedDecisionShadow(pairIndex, decision)',
              'RunEntryPreflightAndExecute(decision, actual)'
          ]
          pos = [process.find(x) for x in order]
          assert all(x >= 0 for x in pos), pos
          assert pos == sorted(pos), pos

          sha = hashlib.sha256(p.read_bytes()).hexdigest()
          print('D1O07_MODE1_STATIC_COMPLIANCE=PASS')
          print('D1O07_CROSS_MODULE_REGRESSION=PASS')
          print('EA_SHA256=' + sha)
          PY

      - name: Diff hygiene
        run: git diff --check
