name: D1O-07 status reconciliation

on:
  push:
    branches: [d1-owner-dev]
    paths:
      - 'blueprint/.d1o07-status-reconcile-trigger'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d1-owner-dev
          fetch-depth: 0

      - name: Reconcile CURRENT and queue
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          ea = Path('blueprint/source/BBMA_EA.mq4')
          current = Path('blueprint/CURRENT.md')
          queue = Path('blueprint/MASTER_QUEUE.md')
          sha = hashlib.sha256(ea.read_bytes()).hexdigest()
          expected = 'c911790b45fb7a75270fdee1204a7c97313605dca194f57380441b92a66896c2'
          assert sha == expected, (sha, expected)

          c = current.read_text(encoding='utf-8')
          c = c.replace('## Current branch\n`blueprint-dev`', '## Current branch\n`d1-owner-dev`', 1)
          oldsha = '`30363d08437b85f253e6baf3e9c82af0d59d70727639ac0e6420a7677f975bc9`'
          if oldsha in c:
              c = c.replace(oldsha, '`' + expected + '`', 1)
          marker = '## 2026-08-25 D1O-07 Mode1 + Cross-Module Static Closure'
          if marker not in c:
              c = c.rstrip() + '''\n\n---\n\n## 2026-08-25 D1O-07 Mode1 + Cross-Module Static Closure\n\n- Current active implementation branch: `d1-owner-dev`.\n- Current EA build: `Version 4.5.1 - D1O-07 Canonical LTF Dedup`.\n- Current source SHA-256: `c911790b45fb7a75270fdee1204a7c97313605dca194f57380441b92a66896c2`.\n- P3-M1 Mode-1 static compliance re-audit: **PASS**.\n- Focused M15 -> M16 -> M17 -> M22 -> M24 cross-module regression: **PASS**.\n- Automated evidence: GitHub Actions run `32817790689`, job `97709483350`.\n- Audit records: `blueprint/P3_M1_D1O07_MODE1_COMPLIANCE_REAUDIT_20260825.md` and `blueprint/D1O07_CROSS_MODULE_REGRESSION_AUDIT_20260825.md`.\n- No EA code fix required from these two gates. Broker/demo runtime evidence remains separate.\n- Next safe engineering work: queued non-strategy observability/UI defects (`REJ_INVALID_LOT` diagnostics, then dashboard active-trade count refresh).\n'''
          current.write_text(c, encoding='utf-8', newline='\n')

          q = queue.read_text(encoding='utf-8')
          qmarker = '## 2026-08-25 — D1O-07 Static Re-Audit Closure'
          if qmarker not in q:
              q = q.rstrip() + '''\n\n---\n\n## 2026-08-25 — D1O-07 Static Re-Audit Closure\n\nStatus: **CLOSED / PASS**\n\nCompleted from the prior active execution order:\n1. P3-M1 Mode-1 static compliance against current D1O-07 source — **PASS**.\n2. Focused cross-module regression `M15 -> M16 -> M17 -> M22 -> M24` — **PASS**.\n\nEvidence:\n- workflow run `32817790689`;\n- EA SHA-256 `c911790b45fb7a75270fdee1204a7c97313605dca194f57380441b92a66896c2`;\n- `P3_M1_D1O07_MODE1_COMPLIANCE_REAUDIT_20260825.md`;\n- `D1O07_CROSS_MODULE_REGRESSION_AUDIT_20260825.md`.\n\n### Active next safe engineering order\n1. `REJ_INVALID_LOT` diagnostics — observability only; no sizing/risk semantic change.\n2. Dashboard active-trade count refresh — display/registry correctness only; no strategy change.\n3. Broker/demo runtime D1 owner/dedup/timing evidence when market-connected environment is available.\n4. Material Workbook HOLD rules remain blocked pending explicit strategy decision.\n'''
          queue.write_text(q, encoding='utf-8', newline='\n')

          assert '`d1-owner-dev`' in current.read_text(encoding='utf-8')
          assert expected in current.read_text(encoding='utf-8')
          assert qmarker in queue.read_text(encoding='utf-8')
          print('D1O07_STATUS_RECONCILE=PASS')
          PY

          git diff --check
          if git diff --name-only | grep -E '\.(mq4|mqh)$'; then
            echo 'Unexpected source change'
            exit 1
          fi

      - name: Commit status reconciliation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blueprint/CURRENT.md blueprint/MASTER_QUEUE.md
          git commit -m 'docs: reconcile D1O-07 current status and queue'
          git push origin HEAD:d1-owner-dev
