name: D1O-08 post-materialization cleanup

on:
  push:
    branches: [ d1-owner-dev ]
    paths:
      - 'blueprint/.d1o08-cleanup-trigger'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d1-owner-dev
          fetch-depth: 0
      - name: Remove stale identity residue and runtime label
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('blueprint/source/BBMA_EA.mq4')
          s=p.read_text(encoding='utf-8')
          if 'Version 4.5.1 - D1O-07 Canonical LTF Dedup' not in s:
              raise SystemExit('unexpected build')
          targets = [
              '   string ltfIdentity = "";\n',
              '      ltfIdentity += "|H1:" + IntegerToString((int)h1.ConfirmationCandle);\n',
              '      ltfIdentity += "|M15:" + IntegerToString((int)m15.ConfirmationCandle);\n',
          ]
          for t in targets:
              if s.count(t) != 1:
                  raise SystemExit('cleanup anchor mismatch: '+repr(t))
              s=s.replace(t,'',1)
          old='Log(DBG_FULL, "BBMA EA V4.5.1 D1O-02 initialized successfully");'
          new='Log(DBG_FULL, "BBMA EA V4.5.1 D1O-07 Canonical LTF Dedup initialized successfully");'
          if s.count(old) != 1:
              raise SystemExit('runtime label anchor mismatch')
          s=s.replace(old,new,1)
          if 'ltfIdentity' in s:
              raise SystemExit('stale ltfIdentity remains')
          p.write_text(s,encoding='utf-8')
          PY
          grep -Fq 'D1O-07 Canonical LTF Dedup initialized successfully' blueprint/source/BBMA_EA.mq4
          grep -Fq 'canonicalIdentity = "RE_ENTRY|' blueprint/source/BBMA_EA.mq4
          grep -Fq 'D1OpportunityLTFClusterText' blueprint/source/BBMA_EA.mq4
          git diff --check
      - name: Commit cleanup and self-remove
        shell: bash
        run: |
          set -euo pipefail
          rm -f blueprint/.d1o08-cleanup-trigger
          rm -f .github/workflows/d1o08-post-materialization-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "D1O-08: clean post-materialization identity residue [skip ci]"
          git push origin HEAD:d1-owner-dev
