name: D1O-10 current D1O-07 runtime smoke

on:
  pull_request:
    branches: [ d1-owner-dev ]
    types: [opened, synchronize, reopened]
    paths:
      - 'blueprint/.run-d1o10-runtime-smoke'
      - '.github/workflows/d1o10-current-runtime-smoke.yml'

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify current D1O-07 source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $src='.\blueprint\source\BBMA_EA.mq4'
          if(-not (Test-Path $src)){ throw 'EA source missing' }
          $txt=Get-Content $src -Raw
          foreach($required in @(
            'Version 4.5.1 - D1O-07 Canonical LTF Dedup',
            'D1OpportunityLTFClusterText',
            'D1O-07 Canonical LTF Dedup initialized successfully'
          )){
            if($txt -notmatch [regex]::Escape($required)){ throw "missing invariant: $required" }
          }
          if($txt -match 'ltfIdentity'){ throw 'stale ltfIdentity remains' }
          "SOURCE_SHA256=$((Get-FileHash $src -Algorithm SHA256).Hash.ToLower())" | Out-File $env:GITHUB_ENV -Append
      - name: Acquire official MT4 portable runtime
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dirs=@('C:\Program Files (x86)\MetaTrader 4','C:\Program Files\MetaTrader 4')
          $installDir=$null
          foreach($dir in $dirs){
            if((Test-Path (Join-Path $dir 'metaeditor.exe')) -and (Test-Path (Join-Path $dir 'terminal.exe'))){ $installDir=$dir; break }
          }
          if(-not $installDir){
            $setup=Join-Path $env:RUNNER_TEMP 'mt4setup.exe'
            Invoke-WebRequest -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt4/mt4setup.exe' -OutFile $setup -UseBasicParsing
            $proc=Start-Process -FilePath $setup -ArgumentList '/auto' -PassThru
            for($i=0;$i -lt 84;$i++){
              Start-Sleep -Seconds 5
              foreach($dir in $dirs){
                if((Test-Path (Join-Path $dir 'metaeditor.exe')) -and (Test-Path (Join-Path $dir 'terminal.exe'))){ $installDir=$dir; break }
              }
              if($installDir){ break }
              if($proc.HasExited -and $i -gt 12){ break }
            }
            if($proc -and -not $proc.HasExited){ try{$proc.Kill()}catch{} }
          }
          if(-not $installDir){ throw 'Official MT4 terminal/metaeditor not found' }
          $portable=Join-Path $env:RUNNER_TEMP 'mt4portable'
          if(Test-Path $portable){ Remove-Item $portable -Recurse -Force }
          New-Item -ItemType Directory -Path $portable | Out-Null
          Copy-Item "$installDir\*" $portable -Recurse -Force
          "MT4DIR=$portable" | Out-File $env:GITHUB_ENV -Append
      - name: Native pre-runtime compile 0E0W
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $expertsDir=Join-Path $env:MT4DIR 'MQL4\Experts'
          New-Item -ItemType Directory -Path $expertsDir -Force | Out-Null
          $dst=Join-Path $expertsDir 'BBMA_EA.mq4'
          Copy-Item '.\blueprint\source\BBMA_EA.mq4' $dst -Force
          $log=Join-Path $env:RUNNER_TEMP 'd1o10-runtime-compile.log'
          & (Join-Path $env:MT4DIR 'metaeditor.exe') "/compile:$dst" "/log:$log"
          Start-Sleep -Seconds 2
          if(-not (Test-Path $log)){ throw 'MetaEditor compile log missing' }
          $txt=Get-Content $log -Raw
          $txt | Write-Host
          $matches=[regex]::Matches($txt,'(?i)(\d+)\s+errors?,\s*(\d+)\s+warnings?')
          if($matches.Count -lt 1){ throw 'Unable to parse MetaEditor summary' }
          $m=$matches[$matches.Count-1]
          $errors=[int]$m.Groups[1].Value
          $warnings=[int]$m.Groups[2].Value
          if($errors -ne 0 -or $warnings -ne 0){ throw "Runtime precompile failed: $errors errors / $warnings warnings" }
          if(-not (Test-Path ([System.IO.Path]::ChangeExtension($dst,'.ex4')))){ throw 'EX4 not produced' }
          "COMPILE_ERRORS=$errors" | Out-File $env:GITHUB_ENV -Append
          "COMPILE_WARNINGS=$warnings" | Out-File $env:GITHUB_ENV -Append
      - name: Launch MT4 with trading disabled
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $ini=Join-Path $env:RUNNER_TEMP 'd1o10-runtime.ini'
          $cfg=@(
            '[Common]',
            'EnableNews=false',
            '',
            '[Experts]',
            'ExpertsEnable=true',
            'ExpertsDllImport=false',
            'ExpertsExpImport=false',
            'ExpertsTrades=false',
            '',
            '[StartUp]',
            'Symbol=EURUSD',
            'Period=M15',
            'Expert=BBMA_EA'
          )
          $cfg | Set-Content -Path $ini -Encoding Ascii
          $proc=Start-Process -FilePath (Join-Path $env:MT4DIR 'terminal.exe') -ArgumentList '/portable', "/config:$ini" -PassThru
          for($i=0;$i -lt 18;$i++){
            Start-Sleep -Seconds 5
            if($proc.HasExited){ break }
          }
          if(-not $proc.HasExited){ try{$proc.CloseMainWindow() | Out-Null}catch{}; Start-Sleep -Seconds 2 }
          if(-not $proc.HasExited){ try{$proc.Kill()}catch{} }
      - name: Inspect Journal and Experts logs
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $journal=@(Get-ChildItem (Join-Path $env:MT4DIR 'logs') -Filter '*.log' -File -ErrorAction SilentlyContinue | Sort-Object LastWriteTime)
          $expert=@(Get-ChildItem (Join-Path $env:MT4DIR 'MQL4\Logs') -Filter '*.log' -File -ErrorAction SilentlyContinue | Sort-Object LastWriteTime)
          $all=@($journal)+@($expert)
          if($all.Count -eq 0){ throw 'No MT4 Journal/Experts logs produced' }
          $combinedPath=Join-Path $env:RUNNER_TEMP 'd1o10-runtime-combined.log'
          $combined=''
          foreach($f in $all){
            $combined += "`r`n===== $($f.FullName) =====`r`n"
            $combined += (Get-Content $f.FullName -Raw -ErrorAction SilentlyContinue)
          }
          $combined | Set-Content $combinedPath -Encoding UTF8
          ($combined -split "`r?`n" | Select-Object -Last 400) | ForEach-Object { Write-Host $_ }
          foreach($p in @('array out of range','zero divide','critical runtime error','access violation','stack overflow','invalid pointer','cannot load expert','expert initialization failed','init failed')){
            if($combined -match [regex]::Escape($p)){ throw "Fatal MT4 runtime signature detected: $p" }
          }
          $classification='ATTACH_OK_NO_BROKER_DATA'
          if($combined -match '\[P3S1\]\[PASS\] EA initialized successfully'){
            $classification='EA_INIT_OK'
          } elseif(($combined -match '(?i)not connected') -or ($combined -match '(?i)no prices') -or ($combined -match '(?i)waiting for update') -or ($combined -match '\[P3S1\]\[FAIL\] No valid pairs loaded')){
            $classification='ENVIRONMENT_BLOCKED_NO_BROKER_DATA'
          }
          "RUNTIME_CLASSIFICATION=$classification" | Out-File $env:GITHUB_ENV -Append
          Write-Host "D1O10_RUNTIME_CLASSIFICATION=$classification"
      - name: Run canonical telemetry analyzer when telemetry exists
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $combined=Join-Path $env:RUNNER_TEMP 'd1o10-runtime-combined.log'
          if(Test-Path $combined){
            $text=Get-Content $combined -Raw
            if($text -match '\[N2-NMJE-DEC\]' -or $text -match '\[D1-OPP\]'){
              python blueprint/tools/d1o_canonical_dedup_log_analyzer.py $combined --json (Join-Path $env:RUNNER_TEMP 'd1o10-analyzer.json')
              if($LASTEXITCODE -ne 0){ throw 'Canonical D1O telemetry analyzer reported integrity failure' }
            } else {
              '{}' | Set-Content (Join-Path $env:RUNNER_TEMP 'd1o10-analyzer.json')
              Write-Host 'No D1O decision telemetry produced in offline smoke; analyzer deferred to broker-data runtime.'
            }
          }
      - name: Write machine-readable result
        shell: pwsh
        run: |
          @"
          D1O10_RUNTIME_SMOKE=PASS
          SOURCE_SHA256=$env:SOURCE_SHA256
          ERRORS=$env:COMPILE_ERRORS
          WARNINGS=$env:COMPILE_WARNINGS
          CLASSIFICATION=$env:RUNTIME_CLASSIFICATION
          TRADING_ENABLED=false
          "@ | Set-Content (Join-Path $env:RUNNER_TEMP 'd1o10-runtime-result.txt')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1o10-current-runtime-evidence
          path: |
            ${{ runner.temp }}/d1o10-runtime-compile.log
            ${{ runner.temp }}/d1o10-runtime-combined.log
            ${{ runner.temp }}/d1o10-runtime-result.txt
            ${{ runner.temp }}/d1o10-analyzer.json
          if-no-files-found: warn
