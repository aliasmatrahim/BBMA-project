name: D1O-11 tracking reconciliation

on:
  push:
    branches: [ d1-owner-dev ]
    paths:
      - 'blueprint/.run-d1o11-tracking-reconcile'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d1-owner-dev
          fetch-depth: 0
      - name: Append authoritative current-state overlays
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_B64=''
          QUEUE_B64=''
          if ! grep -Fq 'D1/D1O Authoritative Current-State Overlay' blueprint/CURRENT.md; then
            printf '\n' >> blueprint/CURRENT.md
            printf '%s' "$CURRENT_B64" | base64 -d >> blueprint/CURRENT.md
            printf '\n' >> blueprint/CURRENT.md
          fi
          if ! grep -Fq 'D1/D1O Queue Reconciliation Overlay' blueprint/MASTER_QUEUE.md; then
            printf '\n' >> blueprint/MASTER_QUEUE.md
            printf '%s' "$QUEUE_B64" | base64 -d >> blueprint/MASTER_QUEUE.md
            printf '\n' >> blueprint/MASTER_QUEUE.md
          fi
          grep -Fq 'D1/D1O Authoritative Current-State Overlay' blueprint/CURRENT.md
          grep -Fq 'D1/D1O Queue Reconciliation Overlay' blueprint/MASTER_QUEUE.md
          git diff --check
      - name: Commit reconciliation and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f blueprint/.run-d1o11-tracking-reconcile
          rm -f .github/workflows/d1o11-tracking-reconcile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "D1O-11: reconcile current status and master queue [skip ci]"
          git push origin HEAD:d1-owner-dev
