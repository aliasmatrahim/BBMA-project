name: D1O-11B tracking reconciliation recovery

on:
  push:
    branches: [ d1-owner-dev ]
    paths:
      - 'blueprint/.run-d1o11b-tracking-reconcile'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d1-owner-dev
          fetch-depth: 0

      - name: Recover and append authoritative overlays
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import ast,base64,re; from pathlib import Path; w=Path('.github/workflows/d1o11-tracking-reconcile.yml').read_text(encoding='utf-8'); vals={k:ast.literal_eval(re.search(r'^\\s*'+k+r'=(.*)$',w,re.M).group(1)) for k in ('CURRENT_B64','QUEUE_B64')}; pairs=[('CURRENT_B64',Path('blueprint/CURRENT.md'),'D1/D1O Authoritative Current-State Overlay'),('QUEUE_B64',Path('blueprint/MASTER_QUEUE.md'),'D1/D1O Queue Reconciliation Overlay')]; [(p.write_text(p.read_text(encoding='utf-8').rstrip()+'\\n\\n'+base64.b64decode(vals[k]).decode('utf-8').rstrip()+'\\n',encoding='utf-8') if marker not in p.read_text(encoding='utf-8') else None) for k,p,marker in pairs]; [p.write_text(p.read_text(encoding='utf-8').rstrip()+'\\n',encoding='utf-8') for _,p,_ in pairs]"
          grep -Fq 'D1/D1O Authoritative Current-State Overlay' blueprint/CURRENT.md
          grep -Fq 'D1/D1O Queue Reconciliation Overlay' blueprint/MASTER_QUEUE.md
          git diff --check

      - name: Commit reconciliation and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f blueprint/.run-d1o11-tracking-reconcile
          rm -f blueprint/.run-d1o11b-tracking-reconcile
          rm -f .github/workflows/d1o11-tracking-reconcile.yml
          rm -f .github/workflows/d1o11b-tracking-reconcile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "D1O-11: reconcile current status and master queue [skip ci]"
          git push origin HEAD:d1-owner-dev
