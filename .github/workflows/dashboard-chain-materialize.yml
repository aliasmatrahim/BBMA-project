name: Dashboard compact chain materializer

on:
  push:
    branches:
      - dashboard-chain-dev
    paths:
      - 'blueprint/.run-dashboard-chain'
      - 'blueprint/tools/dashboard_chain_compact_apply.py'
      - 'blueprint/tools/dashboard_chain_safety_fix.py'
      - 'blueprint/tests/test_dashboard_chain_safety_fix.py'
      - 'blueprint/tools/dashboard_chain_prematerialization_fix.py'
      - 'blueprint/tests/test_dashboard_chain_prematerialization_fix.py'
      - 'blueprint/tests/test_dashboard_chain_stage_composition.py'
      - 'blueprint/tools/dashboard_chain_scope_guard.py'
      - '.github/workflows/dashboard-chain-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dashboard-chain-dev
          fetch-depth: 0

      - name: Run dashboard hardening selftests
        shell: bash
        run: |
          set -euo pipefail
          python3 blueprint/tests/test_dashboard_chain_safety_fix.py
          python3 blueprint/tests/test_dashboard_chain_prematerialization_fix.py
          python3 blueprint/tests/test_dashboard_chain_stage_composition.py
          python3 -m py_compile \
            blueprint/tools/dashboard_chain_safety_fix.py \
            blueprint/tests/test_dashboard_chain_safety_fix.py \
            blueprint/tools/dashboard_chain_prematerialization_fix.py \
            blueprint/tests/test_dashboard_chain_prematerialization_fix.py \
            blueprint/tests/test_dashboard_chain_stage_composition.py \
            blueprint/tools/dashboard_chain_scope_guard.py

      - name: Apply M25 compact chain dashboard
        run: python3 blueprint/tools/dashboard_chain_compact_apply.py

      - name: Apply dashboard safety hardening
        run: python3 blueprint/tools/dashboard_chain_safety_fix.py

      - name: Apply prematerialization dashboard hardening
        run: python3 blueprint/tools/dashboard_chain_prematerialization_fix.py

      - name: Guard source scope
        run: python3 blueprint/tools/dashboard_chain_scope_guard.py

      - name: Static dashboard-only guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('blueprint/source/BBMA_EA.mq4').read_text(encoding='utf-8')
          for marker in [
              'PAIR', 'SETUP', 'CHAIN', 'POS',
              'DashBuildPairRow', 'DashLivePosition',
              'REM exact signature prefix',
              'RRE exact signature prefix',
              'REE exact signature prefix',
              'M15 remains authoritative for setup completion/invalidation display.',
              'int buyCount = 0;',
              'int sellCount = 0;',
              'status = "MIX";',
              'chain = "B:" + buyChain + " | S:" + sellChain;',
              'string DashLivePositionSignature()',
              'int tickets[];',
              'int pairIndexes[];',
              'int orderTypes[];',
              'ArrayResize(tickets, owned + 1);',
              'while(b >= 0 && tickets[b] > keyTicket)',
              'static string lastLiveSignature = "__INIT__";',
              'if(currentLiveSignature == lastLiveSignature) return;',
              'bool DashDecisionValidated(PairState &state)',
              'bool DashDecisionExecuted(PairState &state)',
              'status = "VAL";',
              'status = "EXE";',
              'setup += "~";',
              'setup += "✓";',
              'chain = "DEC:REM" + arrow;',
              'chain = "DEC:RRE" + arrow;',
              'chain = "DEC:REE" + arrow;',
              'chain = "DEC:RE" + arrow;',
              'DashREConfirmed(h4re, direction) &&',
              'DashMLVReady(m15mlv, direction))',
              'DashREConfirmed(d1re, direction) &&',
              'DashExtremeReady(h4ext, direction) &&',
              'chain = "H4:RE" + arrow + ">H1:EXT" + arrow +',
              'chain = "D1:RE" + arrow + ">H4:RE" + arrow +',
              'chain = "D1:RE" + arrow + ">H4:EXT" + arrow +'
          ]:
              if marker not in s:
                  raise SystemExit(f'missing dashboard marker: {marker}')

          m25=s.index('//| MODULE 25: DASHBOARD ENGINE')
          m26=s.index('//| MODULE 26: INITIALIZATION & CLEANUP')
          block=s[m25:m26]
          forbidden=[
              'OrderSend(', 'OrderClose(', 'OrderModify(', 'OrderDelete(',
              'PriorityEngine_Atomic(', 'InvalidationEngine_Atomic(',
              'if(buyRank >= sellRank)',
              '// Timer refresh keeps both chain lifecycle and live broker position in sync.\n   UpdateDashboard();',
              'bool DashDecisionComplete(PairState &state)',
              'state.last_decision.DecisionState == DEC_VALIDATED ||\n           state.last_decision.DecisionState == DEC_EXECUTED',
              'chain = "H4:RE" + arrow;\n               if(DashExtremeReady(h1ext, direction))',
              'chain = "D1:RE" + arrow;\n               if(DashREConfirmed(h4re, direction))',
              'chain = "D1:RE" + arrow;\n               if(DashExtremeReady(h4ext, direction))'
          ]
          for marker in forbidden:
              if marker in block:
                  raise SystemExit(f'forbidden M25 authority/bias/perf/semantic marker: {marker}')

          deinit_start=s.index('void OnDeinit(')
          tick_start=s.index('//| EXPERT TICK FUNCTION', deinit_start)
          deinit=s[deinit_start:tick_start]
          if 'ClearDashboardObjects();' not in deinit:
              raise SystemExit('missing dashboard object cleanup in OnDeinit')
          if 'if(ShowDashboard)\n      Comment("");' in deinit:
              raise SystemExit('conditional-only legacy dashboard cleanup remains in OnDeinit')

          print('DASHBOARD_M25_DISPLAY_ONLY_GUARD=PASS')
          print('DASHBOARD_DECISION_FAMILY_GUARD=PASS')
          print('DASHBOARD_DEINIT_CLEANUP_GUARD=PASS')
          PY

      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- blueprint/source/BBMA_EA.mq4; then
            echo 'No source change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blueprint/source/BBMA_EA.mq4
          git commit -m 'dashboard: materialize compact cycle-aware chain UI'
          git push origin HEAD:dashboard-chain-dev
