name: Dashboard live trade count materialization
on:
  push:
    branches: [d1-owner-dev]
    paths: ['blueprint/.dashboard-live-count-trigger']
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d1-owner-dev
          fetch-depth: 0
      - name: Apply dashboard patch
        run: python3 .github/scripts/dashboard_live_count_patch.py
      - name: Verify display-only scope
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "blueprint/contracts/M25_M26_DASHBOARD_INITIALIZATION_CONTRACT.md blueprint/source/BBMA_EA.mq4 "
          grep -F 'P2-DASHCOUNT-01' blueprint/source/BBMA_EA.mq4
          grep -F 'CountLiveEAOwnedPortfolioTrades()' blueprint/source/BBMA_EA.mq4
          grep -F 'void RefreshDashboardLiveTradeCount()' blueprint/source/BBMA_EA.mq4
          grep -F '=== BBMA EA V4.5.1 D1O-07 ===' blueprint/source/BBMA_EA.mq4
          ! grep -F 'Trades: " + IntegerToString(g_monitored_count)' blueprint/source/BBMA_EA.mq4
          grep -F 'P2-DASHCOUNT-01 live-count rule' blueprint/contracts/M25_M26_DASHBOARD_INITIALIZATION_CONTRACT.md
      - name: Commit dashboard fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blueprint/source/BBMA_EA.mq4 blueprint/contracts/M25_M26_DASHBOARD_INITIALIZATION_CONTRACT.md
          git commit -m 'P2: refresh dashboard from live exact-owned trade count'
          git push origin HEAD:d1-owner-dev
