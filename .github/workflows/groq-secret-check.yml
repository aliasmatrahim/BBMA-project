name: Groq Secret Check

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/groq-secret-check.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check Groq secret is configured
        shell: bash
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::GROQ_API_KEY is not configured"
            exit 1
          fi
          echo "GROQ_API_KEY is configured."
