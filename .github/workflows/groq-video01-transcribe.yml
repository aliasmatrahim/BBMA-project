name: Groq Video 01 ASR Draft

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/groq-video01-transcribe.yml'

permissions:
  contents: read

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      VIDEO_ID: pU9E_ckLtkI
      CHUNK_SECONDS: '480'
      SOURCE_URL: https://gary-denver-tender-complex.trycloudflare.com/source.m4a
    steps:
      - uses: actions/checkout@v4

      - name: Verify secret
        shell: bash
        run: |
          test -n "$GROQ_API_KEY" || { echo '::error::GROQ_API_KEY missing'; exit 1; }

      - name: Install tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Download Video 01 audio
        shell: bash
        run: |
          mkdir -p work/chunks work/raw results
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 3 \
            --output work/source.m4a "$SOURCE_URL"
          test -s work/source.m4a
          echo "Downloaded $(stat -c%s work/source.m4a) bytes"

      - name: Normalize and chunk audio
        shell: bash
        run: |
          ffmpeg -hide_banner -loglevel error -i work/source.m4a -map 0:a:0 -ar 16000 -ac 1 -c:a flac \
            -f segment -segment_time "$CHUNK_SECONDS" -reset_timestamps 1 work/chunks/chunk_%03d.flac
          count=$(find work/chunks -type f -name 'chunk_*.flac' | wc -l)
          test "$count" -gt 0
          echo "Chunks: $count"
          find work/chunks -type f -name 'chunk_*.flac' -printf '%f %s bytes\n'
          if find work/chunks -type f -name 'chunk_*.flac' -size +24M | grep -q .; then
            echo '::error::A chunk exceeds 24 MiB; reduce CHUNK_SECONDS.'
            exit 1
          fi

      - name: Transcribe chunks with Groq Whisper Large v3
        shell: bash
        run: |
          set -euo pipefail
          for f in work/chunks/chunk_*.flac; do
            base=$(basename "$f" .flac)
            echo "Transcribing ${base}"
            curl -sS --fail-with-body --retry 5 --retry-all-errors --retry-delay 3 \
              https://api.groq.com/openai/v1/audio/transcriptions \
              -H "Authorization: Bearer ${GROQ_API_KEY}" \
              -F "file=@${f}" \
              -F 'model=whisper-large-v3' \
              -F 'response_format=verbose_json' \
              -F 'temperature=0' \
              -F 'timestamp_granularities[]=segment' \
              -F 'prompt=Oma Ally BBMA Bollinger Bands Moving Average Extreme MHV CSA Re-Entry Reentry CSAK CSM timeframe D1 H4 H1 M15 M5 M1' \
              > "work/raw/${base}.json"
          done

      - name: Merge transcript and timestamps
        shell: python
        run: |
          import json, glob, os, subprocess
          raw = sorted(glob.glob('work/raw/chunk_*.json'))
          aud = sorted(glob.glob('work/chunks/chunk_*.flac'))
          if len(raw) != len(aud) or not raw:
              raise SystemExit('chunk/json count mismatch')
          def duration(path):
              out = subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1',path], text=True)
              return float(out.strip())
          def ts(sec):
              ms = int(round(sec * 1000)); h, r = divmod(ms, 3600000); m, r = divmod(r, 60000); s, ms = divmod(r, 1000)
              return f'{h:02d}:{m:02d}:{s:02d},{ms:03d}'
          merged=[]; srt=[]; offset=0.0; n=1
          for jp, ap in zip(raw, aud):
              with open(jp, encoding='utf-8') as fh: data=json.load(fh)
              segs=data.get('segments') or []
              if segs:
                  for seg in segs:
                      st=offset+float(seg.get('start',0)); en=offset+float(seg.get('end',seg.get('start',0))); text=(seg.get('text') or '').strip()
                      if not text: continue
                      merged.append(f'[{ts(st)[:-4]} - {ts(en)[:-4]}] {text}')
                      srt += [str(n), f'{ts(st)} --> {ts(en)}', text, '']; n+=1
              else:
                  text=(data.get('text') or '').strip()
                  if text: merged.append(f'[{ts(offset)[:-4]}] {text}')
              offset += duration(ap)
          os.makedirs('results', exist_ok=True)
          with open('results/video01_pU9E_ckLtkI_ASR_DRAFT.txt','w',encoding='utf-8') as f: f.write('\n'.join(merged)+'\n')
          with open('results/video01_pU9E_ckLtkI_ASR_DRAFT.srt','w',encoding='utf-8') as f: f.write('\n'.join(srt))
          with open('results/manifest.json','w',encoding='utf-8') as f:
              json.dump({'video_id':'pU9E_ckLtkI','title':'1. Oma Ally BBMA Intensive Day 1 Video 1','status':'ASR-DRAFT','model':'whisper-large-v3','chunk_seconds':480,'chunks':len(raw),'duration_seconds':offset},f,indent=2)

      - name: Package raw responses
        shell: bash
        run: |
          cp work/raw/*.json results/

      - name: Upload ASR draft artifact
        uses: actions/upload-artifact@v4
        with:
          name: video01-groq-whisper-large-v3-asr-draft
          path: results/
          retention-days: 30
          if-no-files-found: error
