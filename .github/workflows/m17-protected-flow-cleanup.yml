name: M17 protected-flow cleanup

on:
  push:
    branches: [d1-owner-dev]
    paths: [.github/m17-protected-flow-cleanup-trigger.txt]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d1-owner-dev
          fetch-depth: 0

      - name: Remove non-essential protected-flow telemetry
        run: python blueprint/tools/remove_m17_protected_flow_telemetry.py

      - name: Static guards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('blueprint/source/BBMA_EA.mq4').read_text(encoding='utf-8')
          assert '[M17-SL][LOT]' not in s
          for marker in [
              'Version 4.5.2 - M17 Structural SL Normalization',
              'M17-SLRANGE-01',
              'ResolveSourceOwnedStructuralAnchor',
              'MathCeil(rawSpreadPips - 0.000000001)',
              'brokerSL += roundedSpreadBufferPips * pipValue',
              '[M17-SL][STRUCT]',
          ]:
              assert marker in s, marker
          print('protected-flow cleanup static guards PASS')
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- blueprint/source/BBMA_EA.mq4
          git diff --cached --check
          git commit -m "fix: restore protected preflight flow after M17 SL update"
          git pull --rebase origin d1-owner-dev
          git push origin HEAD:d1-owner-dev
