name: M17 final temporary-file cleanup

on:
  push:
    branches: [d1-owner-dev]
    paths: [.github/m17-status-reconciliation-trigger.txt]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d1-owner-dev
          fetch-depth: 0

      - name: Remove completed M17 temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BLOB="4ccd444a96a34b494653143a7560516a4147b5bc"
          test "$(git rev-parse HEAD:blueprint/source/BBMA_EA.mq4)" = "$EXPECTED_BLOB"

          git rm -f --ignore-unmatch -- \
            blueprint/tools/apply_m17_structural_sl_patch.py \
            blueprint/tools/remove_m17_protected_flow_telemetry.py \
            .github/workflows/m17-structural-sl-implementation.yml \
            .github/m17-structural-sl-trigger.txt \
            .github/workflows/m17-protected-flow-cleanup.yml \
            .github/m17-protected-flow-cleanup-trigger.txt \
            .github/workflows/m17-structural-sl-native-compile.yml \
            .github/m17-structural-sl-native-compile-trigger.txt \
            .github/workflows/m17-structural-sl-regression-audit.yml \
            .github/m17-structural-sl-regression-trigger.txt \
            .github/workflows/m17-status-reconciliation.yml \
            .github/m17-status-reconciliation-trigger.txt

          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No M17 temporary files remained"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove completed M17 temporary CI tooling"
          git pull --rebase origin d1-owner-dev
          test "$(git rev-parse HEAD:blueprint/source/BBMA_EA.mq4)" = "$EXPECTED_BLOB"
          git push origin HEAD:d1-owner-dev
