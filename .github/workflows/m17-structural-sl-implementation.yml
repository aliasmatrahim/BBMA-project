name: M17 structural-range SL implementation

on:
  push:
    branches: [d1-owner-dev]
    paths: [.github/m17-structural-sl-trigger.txt]

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d1-owner-dev
          fetch-depth: 0

      - name: Materialize approved M17 patch
        run: python blueprint/tools/apply_m17_structural_sl_patch.py

      - name: Verify patch scope
        shell: bash
        run: |
          git diff --check
          git diff -- blueprint/source/BBMA_EA.mq4
          grep -F "Version 4.5.2 - M17 Structural SL Normalization" blueprint/source/BBMA_EA.mq4
          grep -F "M17-SLRANGE-01" blueprint/source/BBMA_EA.mq4
          grep -F "MathCeil(rawSpreadPips - 0.000000001)" blueprint/source/BBMA_EA.mq4

      - name: Commit source update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- blueprint/source/BBMA_EA.mq4
          git diff --cached --check
          git commit -m "feat: implement M17 structural-range hard SL"
          git pull --rebase origin d1-owner-dev
          git push origin HEAD:d1-owner-dev
