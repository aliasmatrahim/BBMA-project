name: M17 structural SL regression audit

on:
  push:
    branches: [d1-owner-dev]
    paths: [.github/m17-structural-sl-regression-trigger.txt]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d1-owner-dev
          fetch-depth: 0

      - name: Protected-function and MM regression audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess

          current = Path('blueprint/source/BBMA_EA.mq4').read_text(encoding='utf-8')
          baseline = subprocess.check_output([
              'git','show','f2a59637762981dfb4f5583844a8b251c34a32da:blueprint/source/BBMA_EA.mq4'
          ]).decode('utf-8')

          def extract(text, name):
              needle = name + '('
              pos = text.find(needle)
              if pos < 0:
                  raise SystemExit(f'missing function {name}')
              start = text.rfind('\n', 0, pos) + 1
              brace = text.find('{', pos)
              if brace < 0:
                  raise SystemExit(f'missing body for {name}')
              depth = 0
              i = brace
              while i < len(text):
                  c = text[i]
                  if c == '{': depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          return text[start:i+1]
                  i += 1
              raise SystemExit(f'unclosed body for {name}')

          protected = [
              'ResolveSelectedSLTPSourceComponent',
              'RunEntryPreflightAndExecute',
              'CalculateLotSize',
          ]
          lines = []
          for name in protected:
              old = extract(baseline, name)
              new = extract(current, name)
              if old != new:
                  raise SystemExit(f'REGRESSION: protected/MM function changed: {name}')
              h = hashlib.sha256(new.encode()).hexdigest()
              lines.append(f'{name}_SHA256={h}')
              print(f'PASS {name} {h}')

          required = [
              'Version 4.5.2 - M17 Structural SL Normalization',
              'ResolveSourceOwnedStructuralAnchor',
              'reEntry.StartCandleTime',
              'reEntry.ConfirmationCandle',
              'roundedSpreadBufferPips = MathCeil(rawSpreadPips - 0.000000001)',
              'if(roundedSpreadBufferPips < 2.0)',
              'brokerSL += roundedSpreadBufferPips * pipValue',
              'snapshot.StopLoss = decision.StopLoss;',
          ]
          for marker in required:
              if marker not in current:
                  raise SystemExit(f'missing M17 invariant: {marker}')
          if '[M17-SL][LOT]' in current:
              raise SystemExit('protected-flow LOT telemetry still present')

          Path('m17-regression-audit.txt').write_text('\n'.join(lines)+'\nRESULT=PASS\n', encoding='utf-8')
          print('M17 structural SL regression audit PASS')
          PY

      - name: Upload regression evidence
        uses: actions/upload-artifact@v4
        with:
          name: m17-structural-sl-regression-evidence
          path: m17-regression-audit.txt
