name: MT4 Runtime Smoke Push Trigger

on:
  push:
    branches: [main]
    paths:
      - 'blueprint/.run-d1-02-runtime-smoke'

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: dispatcher
          fetch-depth: 1

      - uses: actions/checkout@v4
        with:
          ref: d1-owner-dev
          path: target
          fetch-depth: 0

      - name: Run reusable MT4 runtime smoke harness
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'mt4-runtime-evidence'
          & '.\dispatcher\blueprint\tools\mt4_runtime_smoke.ps1' -RepoRoot '.\target' -EvidenceDir $evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mt4-runtime-smoke-push-evidence
          path: ${{ runner.temp }}/mt4-runtime-evidence
          if-no-files-found: warn
