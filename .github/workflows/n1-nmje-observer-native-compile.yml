name: N1 NMJE observer native MT4 compile

on:
  push:
    branches: [ d1-owner-dev ]
    paths:
      - 'blueprint/.run-n1-nmje-observer'

permissions:
  contents: write

jobs:
  apply-compile-commit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d1-owner-dev
          fetch-depth: 0

      - name: Verify N1 baseline and contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = '.\blueprint\source\BBMA_EA.mq4'
          if (-not (Test-Path $src)) { throw 'BBMA source missing' }
          $blob = (git hash-object $src).Trim()
          if ($blob -ne '1a8252e7544ae5f54c5ed12de2e92212fab80141') {
            throw "Unexpected baseline source blob: $blob"
          }
          if (-not (Test-Path '.\blueprint\decisions\N1_NESTED_MTF_MAPPING_DECISION_20260824.md')) {
            throw 'N1 Core clarification decision missing'
          }
          if (-not (Test-Path '.\blueprint\contracts\M12N_NESTED_MTF_JOURNEY_ENGINE_CONTRACT.md')) {
            throw 'M12N contract missing'
          }
          if (-not (Test-Path '.\blueprint\tools\n1_nmje_observer_patch.py')) {
            throw 'N1 patcher missing'
          }
          "BASELINE_BLOB=$blob" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Apply N1-03 observation-only source patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python .\blueprint\tools\n1_nmje_observer_patch.py
          git diff --check

          $src = '.\blueprint\source\BBMA_EA.mq4'
          $text = Get-Content $src -Raw
          if ($text -notmatch 'MODULE 12N: NESTED MTF JOURNEY ENGINE') { throw 'M12N module missing after patch' }
          if ($text -notmatch 'UpdateNestedJourneyObservation\(pairIndex\);') { throw 'NMJE ProcessPair call missing' }
          if ($text -notmatch 'Version 4\.5\.1 - N1-03 NMJE Observer') { throw 'N1 build identifier missing' }

          $callCount = ([regex]::Matches($text, 'UpdateNestedJourneyObservation\(pairIndex\);')).Count
          if ($callCount -ne 1) { throw "Expected exactly one NMJE update call, got $callCount" }

          $newBlob = (git hash-object $src).Trim()
          $sha256 = (Get-FileHash $src -Algorithm SHA256).Hash.ToLower()
          "N1_SOURCE_BLOB=$newBlob" | Out-File -FilePath $env:GITHUB_ENV -Append
          "N1_SOURCE_SHA256=$sha256" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "N1 source blob: $newBlob"
          Write-Host "N1 source SHA256: $sha256"

      - name: Static N1 trade-behaviour guard
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = '.\blueprint\source\BBMA_EA.mq4'
          $text = Get-Content $src -Raw
          $start = $text.IndexOf('//| MODULE 12N: NESTED MTF JOURNEY ENGINE')
          $end = $text.IndexOf('//| MODULE 13:', $start)
          if ($start -lt 0 -or $end -lt 0) { throw 'Unable to isolate M12N block' }
          $block = $text.Substring($start, $end - $start)
          $forbidden = @(
            'DetectExtreme(', 'DetectMHV(', 'DetectCSD(', 'DetectECSD(', 'DetectCSM(',
            'UpdateReEntryState(', 'BuildPossibleCombinations(', 'ValidateSequence(',
            'PriorityEngine_Atomic(', 'InvalidationEngine_Atomic(', 'OrderSend('
          )
          foreach ($needle in $forbidden) {
            if ($block.Contains($needle)) { throw "M12N ownership violation: $needle" }
          }
          if ($block.Contains('EntryMode')) { throw 'M12N must not read EntryMode in N1' }

          # N1 metadata must not be consumed outside its module, global declaration,
          # single ProcessPair update call, and diagnostics produced by the module itself.
          $refs = ([regex]::Matches($text, 'g_nested_journeys')).Count
          if ($refs -lt 2) { throw 'Nested journey storage not materialized' }
          Write-Host "N1 static guard PASS; nested storage refs=$refs"

      - name: Acquire official MT4 MetaEditor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $meta = Get-ChildItem 'C:\Program Files*' -Filter metaeditor.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $meta) {
            $url = 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt4/mt4setup.exe'
            Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\mt4setup.exe" -UseBasicParsing
            Start-Process -FilePath "$env:RUNNER_TEMP\mt4setup.exe" -ArgumentList '/auto' -Wait
            Start-Sleep -Seconds 5
            $meta = Get-ChildItem 'C:\Program Files*' -Filter metaeditor.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $meta) { throw 'MT4 MetaEditor not found after official installer attempt' }
          "METAEDITOR=$($meta.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Using $($meta.FullName)"

      - name: Native MetaEditor 0E0W compile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = (Resolve-Path '.\blueprint\source\BBMA_EA.mq4').Path
          $log = Join-Path $env:RUNNER_TEMP 'n1-nmje-metaeditor.log'
          & "$env:METAEDITOR" "/compile:$src" "/log:$log"
          Start-Sleep -Seconds 2
          if (-not (Test-Path $log)) { throw 'MetaEditor compile log missing' }
          $txt = Get-Content $log -Raw
          $txt | Write-Host
          $ex4 = [System.IO.Path]::ChangeExtension($src,'.ex4')
          if (-not (Test-Path $ex4)) { throw 'MetaEditor did not produce EX4' }
          $matches = [regex]::Matches($txt, '(?i)(\d+)\s+errors?,\s*(\d+)\s+warnings?')
          if ($matches.Count -lt 1) { throw 'Unable to parse MetaEditor error/warning summary' }
          $m = $matches[$matches.Count - 1]
          $errors = [int]$m.Groups[1].Value
          $warnings = [int]$m.Groups[2].Value
          if ($errors -ne 0 -or $warnings -ne 0) { throw "Native compile failed: $errors errors / $warnings warnings" }
          @"
          N1_NMJE_NATIVE_METAEDITOR=PASS
          SOURCE_BLOB=$env:N1_SOURCE_BLOB
          SOURCE_SHA256=$env:N1_SOURCE_SHA256
          ERRORS=$errors
          WARNINGS=$warnings
          "@ | Set-Content (Join-Path $env:RUNNER_TEMP 'n1-nmje-compile-result.txt')

      - name: Upload native compile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n1-nmje-native-compile-evidence
          path: |
            blueprint/source/BBMA_EA.ex4
            ${{ runner.temp }}/n1-nmje-metaeditor.log
            ${{ runner.temp }}/n1-nmje-compile-result.txt
          if-no-files-found: warn

      - name: Record N1 implementation and close one-shot gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $audit = @"
          # N1-03 — NMJE Observation Engine Implementation Audit

          Date: 2026-08-24  
          Branch: ``d1-owner-dev``  
          Build: ``Version 4.5.1 - N1-03 NMJE Observer``

          ## Result
          **PASS — N1 observation-only engine materialized / native MT4 MetaEditor 0 errors / 0 warnings.**

          Baseline source blob: ``$env:BASELINE_BLOB``  
          N1 source blob: ``$env:N1_SOURCE_BLOB``  
          N1 source SHA-256: ``$env:N1_SOURCE_SHA256``

          ## Materialized architecture
          - added ``ENUM_NESTED_RELATION`` and explicit parent-kind metadata;
          - added ``NestedTFNode`` and ``NestedJourneyState``;
          - added dedicated ``g_nested_journeys[MAX_PAIRS]`` storage outside ``PairState``;
          - added logical ``M12N`` read-only Nested MTF Journey Engine;
          - M12N consumes only existing M08/M09/M10/M11/M12 owner state;
          - no BBMA detector, combination validator, final-authority, invalidation, SL/TP, risk or broker execution ownership was duplicated;
          - one observation update is made per pair after both BUY/SELL state passes and before M15 final authority.

          ## N1 integration placement note
          The existing ``ProcessPair`` implementation currently interleaves directional owner updates with M13/M14 candidate assembly inside the BUY/SELL loop. N1 deliberately does **not** refactor that proven pipeline merely to move the observer physically before M13. The logical owner remains M12N between M12 and M13, while the N1 shadow call is placed **post directional loop / pre-M15** so it sees complete current owner state and cannot affect candidate construction.

          ## Trade-behaviour invariant
          N1 does not alter:
          - standalone H1 Re-Entry eligibility;
          - REM/RRE/REE signatures or component maturity;
          - candidate append/validation semantics;
          - D1 strategic gate;
          - M15 final selection;
          - M16 revalidation;
          - SL/TP, lot, risk, limits or broker execution.

          ``NestedRelation`` is diagnostic/shadow metadata only. It is not an entry generator, entry filter, score or priority input.

          ## Verification
          - baseline source identity checked before patch;
          - critical M13/M14/M15/M16/M17 functions byte-compared by the patcher and left unchanged;
          - M12N forbidden-owner-call scan: PASS;
          - exactly one ``UpdateNestedJourneyObservation(pairIndex)`` call: PASS;
          - ``git diff --check``: PASS;
          - official MT4 MetaEditor native compile: **0 errors / 0 warnings**;
          - workflow artifact: ``n1-nmje-native-compile-evidence``.

          ## Next phase
          N1 runtime observation/forward validation comes next. N2 may add shadow outcome statistics only; any use of nested state to accept/reject entries remains a separate future decision.
          "@
          Set-Content -Path '.\blueprint\N1_STEP3_NMJE_OBSERVER_IMPLEMENTATION_AUDIT_20260824.md' -Value $audit -Encoding UTF8

          if (Test-Path '.\blueprint\source\BBMA_EA.ex4') { Remove-Item '.\blueprint\source\BBMA_EA.ex4' -Force }
          Remove-Item '.\blueprint\.run-n1-nmje-observer' -Force
          Remove-Item '.\.github\workflows\n1-nmje-observer-native-compile.yml' -Force

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "N1-03: materialize NMJE observer with native MT4 0E0W [skip ci]"
          git push origin HEAD:d1-owner-dev
