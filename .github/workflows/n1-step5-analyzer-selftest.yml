name: N1 Step5 NMJE Analyzer Selftest

on:
  push:
    branches: [main]
    paths:
      - 'blueprint/.run-n1-step5-analyzer-selftest'

permissions:
  contents: write

jobs:
  analyzer-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Run N1-05 analyzer self-test
        run: |
          set -euo pipefail
          python blueprint/tests/test_n1_nmje_log_analyzer.py

      - name: Record audit and close one-shot gate
        run: |
          set -euo pipefail
          cat > blueprint/N1_STEP5_NMJE_ANALYZER_SELFTEST_AUDIT_20260824.md <<'EOF'
# N1-05 — NMJE Log Analyzer Self-Test Audit

Date: 2026-08-24

## Result
**PASS — synthetic NMJE log analysis self-test completed.**

Verified:
- parser recognizes `[N1-NMJE]` records;
- relation counts are correct;
- per-pair transitions are preserved;
- stable JourneyID grouping is preserved;
- unresolved rows are separated;
- no false deterministic JourneyID violation is reported for a stable journey.

This test validates research tooling only and does not alter EA trading logic.
EOF
          rm -f blueprint/.run-n1-step5-analyzer-selftest
          rm -f .github/workflows/n1-step5-analyzer-selftest.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'N1-05: validate NMJE log analyzer [skip ci]'
          git push origin HEAD:main
