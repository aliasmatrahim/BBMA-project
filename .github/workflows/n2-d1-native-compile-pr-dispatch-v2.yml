name: N2 D1 Native Compile PR Dispatch V2

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]
    paths:
      - 'blueprint/.run-n2-d1-pr-dispatch-v2'

permissions:
  contents: write
  pull-requests: read

jobs:
  compile-d1-target:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d1-owner-dev
          fetch-depth: 0

      - name: Verify token-safe N2-01 baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = '.\blueprint\source\BBMA_EA.mq4'
          $head = (git rev-parse HEAD).Trim()
          $blob = (git rev-parse HEAD:blueprint/source/BBMA_EA.mq4).Trim()
          if ($blob -ne 'e1329219e8fad10e4242f7cf2769593cdf09063e') { throw "Unexpected source blob: $blob" }
          $patch = Get-Content '.\blueprint\tools\n2_nmje_decision_shadow_patch.py' -Raw
          if ($patch -notmatch 'NMJE_LogIdentityToken') { throw 'Token-safe N2-01A patcher missing' }
          if ($patch -notmatch 'DIDH=') { throw 'N2-01A DIDH telemetry missing from patcher' }
          "TARGET_HEAD=$head" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BASELINE_BLOB=$blob" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Apply N2-01A decision shadow patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python .\blueprint\tools\n2_nmje_decision_shadow_patch.py
          git diff --check
          $src = '.\blueprint\source\BBMA_EA.mq4'
          $txt = Get-Content $src -Raw
          if ($txt -notmatch '\[N2-NMJE-DEC\]') { throw 'N2 marker missing' }
          if ($txt -notmatch 'NMJE_LogIdentityToken') { throw 'Token encoder not materialized' }
          if ($txt -notmatch 'DIDH=') { throw 'Decision hash field not materialized' }
          $calls = ([regex]::Matches($txt, 'NMJE_PrintValidatedDecisionShadow\(pairIndex, decision\);')).Count
          if ($calls -ne 1) { throw "Expected one N2 shadow call, got $calls" }
          "N2_SOURCE_BLOB=$((git hash-object $src).Trim())" | Out-File -FilePath $env:GITHUB_ENV -Append
          "N2_SOURCE_SHA256=$((Get-FileHash $src -Algorithm SHA256).Hash.ToLower())" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Acquire official MT4 MetaEditor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $meta = Get-ChildItem 'C:\Program Files*' -Filter metaeditor.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $meta) {
            $url = 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt4/mt4setup.exe'
            Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\mt4setup.exe" -UseBasicParsing
            Start-Process -FilePath "$env:RUNNER_TEMP\mt4setup.exe" -ArgumentList '/auto' -Wait
            Start-Sleep -Seconds 5
            $meta = Get-ChildItem 'C:\Program Files*' -Filter metaeditor.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $meta) { throw 'MT4 MetaEditor not found after official installer attempt' }
          "METAEDITOR=$($meta.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Using $($meta.FullName)"

      - name: Native MetaEditor 0E0W compile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = (Resolve-Path '.\blueprint\source\BBMA_EA.mq4').Path
          $log = Join-Path $env:RUNNER_TEMP 'n2-01a-v2-metaeditor.log'
          & "$env:METAEDITOR" "/compile:$src" "/log:$log"
          Start-Sleep -Seconds 2
          if (-not (Test-Path $log)) { throw 'MetaEditor compile log missing' }
          $txt = Get-Content $log -Raw
          $txt | Write-Host
          $ex4 = [System.IO.Path]::ChangeExtension($src,'.ex4')
          if (-not (Test-Path $ex4)) { throw 'MetaEditor did not produce EX4' }
          $matches = [regex]::Matches($txt, '(?i)(\d+)\s+errors?,\s*(\d+)\s+warnings?')
          if ($matches.Count -lt 1) { throw 'Unable to parse MetaEditor summary' }
          $m = $matches[$matches.Count - 1]
          $errors = [int]$m.Groups[1].Value
          $warnings = [int]$m.Groups[2].Value
          if ($errors -ne 0 -or $warnings -ne 0) { throw "Native compile failed: $errors errors / $warnings warnings" }
          "COMPILE_RESULT=0E0W" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n2-01a-v2-native-mt4-evidence
          path: |
            blueprint/source/BBMA_EA.ex4
            ${{ runner.temp }}/n2-01a-v2-metaeditor.log
          if-no-files-found: warn

      - name: Commit verified N2-01A to d1-owner-dev
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $audit = @"
          # N2-01A — NMJE Validated Decision Shadow Native Compile Audit

          Date: 2026-08-25  
          Branch: ``d1-owner-dev``  
          Build: ``Version 4.5.1 - N2-01 NMJE Decision Shadow``

          ## Result
          **PASS — token-safe validated-decision shadow materialized / native MT4 MetaEditor 0 errors / 0 warnings.**

          Baseline source blob: ``$env:BASELINE_BLOB``  
          N2 source blob: ``$env:N2_SOURCE_BLOB``  
          N2 source SHA-256: ``$env:N2_SOURCE_SHA256``

          Telemetry includes one post-M16 ``[N2-NMJE-DEC]`` record with token-safe ``DID`` and ``DIDH=SHORT_HASH(DecisionID)``. Strategy and execution semantics remain unchanged.
          "@
          Set-Content '.\blueprint\N2_STEP1_NMJE_DECISION_SHADOW_AUDIT_20260825.md' $audit -Encoding UTF8
          if (Test-Path '.\blueprint\source\BBMA_EA.ex4') { Remove-Item '.\blueprint\source\BBMA_EA.ex4' -Force }
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'N2-01A: materialize token-safe decision shadow native 0E0W [skip ci]'
          git fetch origin d1-owner-dev
          $remote = (git rev-parse origin/d1-owner-dev).Trim()
          if ($remote -ne $env:TARGET_HEAD) { throw "d1-owner-dev moved during compile: remote=$remote expected=$env:TARGET_HEAD" }
          git push origin HEAD:d1-owner-dev
