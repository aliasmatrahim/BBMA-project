name: N2 NMJE Decision Shadow Native Compile

on:
  push:
    branches: [main]
    paths:
      - 'blueprint/.run-n2-nmje-decision-shadow'

permissions:
  contents: write

jobs:
  patch-compile-commit:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d1-owner-dev
          fetch-depth: 0

      - name: Verify N2 baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = '.\blueprint\source\BBMA_EA.mq4'
          $blob = (git rev-parse HEAD:blueprint/source/BBMA_EA.mq4).Trim()
          if ($blob -ne 'e1329219e8fad10e4242f7cf2769593cdf09063e') { throw "Unexpected source blob: $blob" }
          if (-not (Test-Path '.\blueprint\tools\n2_nmje_decision_shadow_patch.py')) { throw 'N2 patcher missing' }
          "BASELINE_BLOB=$blob" | Out-File $env:GITHUB_ENV -Append
          "BASE_HEAD=$((git rev-parse HEAD).Trim())" | Out-File $env:GITHUB_ENV -Append

      - name: Apply N2-01 shadow patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python .\blueprint\tools\n2_nmje_decision_shadow_patch.py
          git diff --check
          $src = '.\blueprint\source\BBMA_EA.mq4'
          $txt = Get-Content $src -Raw
          if ($txt -notmatch '\[N2-NMJE-DEC\]') { throw 'N2 marker missing' }
          if ($txt -notmatch 'Version 4\.5\.1 - N2-01 NMJE Decision Shadow') { throw 'N2 build id missing' }
          $calls = ([regex]::Matches($txt, 'NMJE_PrintValidatedDecisionShadow\(pairIndex, decision\);')).Count
          if ($calls -ne 1) { throw "Expected one N2 shadow call, got $calls" }
          $blob = (git hash-object $src).Trim()
          $sha256 = (Get-FileHash $src -Algorithm SHA256).Hash.ToLower()
          "N2_SOURCE_BLOB=$blob" | Out-File $env:GITHUB_ENV -Append
          "N2_SOURCE_SHA256=$sha256" | Out-File $env:GITHUB_ENV -Append

      - name: Acquire official MT4 MetaEditor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $meta = Get-ChildItem 'C:\Program Files*' -Filter metaeditor.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $meta) {
            $setup = Join-Path $env:RUNNER_TEMP 'mt4setup.exe'
            Invoke-WebRequest -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt4/mt4setup.exe' -OutFile $setup -UseBasicParsing
            $proc = Start-Process -FilePath $setup -ArgumentList '/auto' -PassThru
            if (-not $proc.WaitForExit(120000)) { try { $proc.Kill() } catch {} }
            Start-Sleep -Seconds 5
            $meta = Get-ChildItem 'C:\Program Files*' -Filter metaeditor.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $meta) { throw 'MT4 MetaEditor not found' }
          "METAEDITOR=$($meta.FullName)" | Out-File $env:GITHUB_ENV -Append

      - name: Native MT4 compile 0E0W
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = (Resolve-Path '.\blueprint\source\BBMA_EA.mq4').Path
          $log = Join-Path $env:RUNNER_TEMP 'n2-nmje-decision-shadow-compile.log'
          & "$env:METAEDITOR" "/compile:$src" "/log:$log"
          Start-Sleep -Seconds 2
          if (-not (Test-Path $log)) { throw 'Compile log missing' }
          $txt = Get-Content $log -Raw
          $txt | Write-Host
          $matches = [regex]::Matches($txt, '(?i)(\d+)\s+errors?,\s*(\d+)\s+warnings?')
          if ($matches.Count -lt 1) { throw 'Unable to parse MetaEditor summary' }
          $m = $matches[$matches.Count - 1]
          $errors = [int]$m.Groups[1].Value
          $warnings = [int]$m.Groups[2].Value
          if ($errors -ne 0 -or $warnings -ne 0) { throw "Compile failed: $errors errors / $warnings warnings" }
          "COMPILE_RESULT=0E0W" | Out-File $env:GITHUB_ENV -Append

      - name: Upload compile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n2-nmje-decision-shadow-compile-evidence
          path: |
            blueprint/source/BBMA_EA.ex4
            ${{ runner.temp }}/n2-nmje-decision-shadow-compile.log
          if-no-files-found: warn

      - name: Record N2-01 audit and commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $audit = @"
# N2-01 — NMJE Validated Decision Shadow Audit

Date: 2026-08-25  
Branch: ``d1-owner-dev``  
Build: ``Version 4.5.1 - N2-01 NMJE Decision Shadow``

## Result
**PASS — validated-decision nested shadow tag added / native MT4 MetaEditor 0 errors / 0 warnings.**

Baseline source blob: ``$env:BASELINE_BLOB``  
N2 source blob: ``$env:N2_SOURCE_BLOB``  
N2 source SHA-256: ``$env:N2_SOURCE_SHA256``

## Behaviour
After M16 validates a real M15 decision, the EA emits one ``[N2-NMJE-DEC]`` record immediately before the existing preflight/execution call. The record contains signal type, direction, current nested relation, parent context, JourneyID and DecisionID.

## Hard invariant
This is shadow metadata only. It does not accept, reject, rank, resize, delay or execute a trade. Candidate construction, REM/RRE/REE signatures, D1 gate, M15 selection, M16 invalidation, SL/TP, risk and broker execution functions remain unchanged.

## Verification
- baseline source identity checked;
- critical strategy/execution function bodies byte-guarded by patcher;
- candidate append count unchanged;
- OrderSend call count unchanged;
- exactly one validated-decision shadow call;
- git diff check PASS;
- native MT4 MetaEditor **0E0W**.

## Next
Extend the research analyzer to correlate ``[N1-NMJE]`` journey observations with ``[N2-NMJE-DEC]`` validated decisions. No nested execution gate is authorized.
"@
          Set-Content '.\blueprint\N2_STEP1_NMJE_DECISION_SHADOW_AUDIT_20260825.md' $audit -Encoding UTF8
          if (Test-Path '.\blueprint\source\BBMA_EA.ex4') { Remove-Item '.\blueprint\source\BBMA_EA.ex4' -Force }
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'N2-01: add NMJE validated-decision shadow 0E0W [skip ci]'
          $parent = (git rev-parse HEAD^).Trim()
          git fetch origin d1-owner-dev
          $remote = (git rev-parse origin/d1-owner-dev).Trim()
          if ($remote -ne $parent) { throw "d1-owner-dev moved during N2-01: remote=$remote parent=$parent" }
          git push origin HEAD:d1-owner-dev
