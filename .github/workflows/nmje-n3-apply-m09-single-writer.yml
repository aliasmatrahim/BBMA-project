name: NMJE N3 apply M09 single-writer

on:
  push:
    branches: [ nmje-n3-hardening-dev ]
    paths:
      - 'blueprint/tools/nmje_n3_step1_m09_single_writer_apply.py'
      - 'blueprint/ci/nmje_n3_static_guard.ps1'
      - '.github/workflows/nmje-n3-apply-m09-single-writer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-guard:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nmje-n3-hardening-dev
          fetch-depth: 0

      - name: Apply source refactor if pending
        shell: pwsh
        run: |
          $src = Get-Content .\blueprint\source\BBMA_EA.mq4 -Raw
          if ($src.Contains('InstallMHVSupersessionParent(')) {
            python .\blueprint\tools\nmje_n3_step1_m09_single_writer_apply.py
          } else {
            Write-Host 'M09 single-writer refactor already materialized; no apply needed.'
          }

      - name: Run static guard
        shell: pwsh
        run: |
          .\blueprint\ci\nmje_n3_static_guard.ps1
          git diff --check

      - name: Commit materialized source only
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- blueprint/source/BBMA_EA.mq4
          if (git diff --cached --quiet) {
            Write-Host 'No source change to commit.'
            exit 0
          }
          git commit -m 'N3 step1: enforce M08-only Extreme ownership in M09'
          git push origin HEAD:nmje-n3-hardening-dev
