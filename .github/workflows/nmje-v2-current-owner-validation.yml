name: NMJE V2 current-owner validation

on:
  pull_request:
    branches:
      - d1-owner-dev
    paths:
      - 'blueprint/source/BBMA_EA.mq4'
      - 'blueprint/audits/NMJE_V2_P2_P3_CURRENT_OWNER_REMATERIALIZATION_20260925.md'
      - 'blueprint/audits/NMJE_V2_P4PLUS_CURRENT_OWNER_REMATERIALIZATION_20260925.md'
      - 'blueprint/audits/evidence/NMJE_V2_P4PLUS_20260925/**'
      - '.github/workflows/nmje-v2-current-owner-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nmje-v2-static:
    name: NMJE V2 current-owner shadow invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify current-owner shadow boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path("blueprint/source/BBMA_EA.mq4").read_text(encoding="utf-8")
          audit = Path("blueprint/audits/NMJE_V2_P4PLUS_CURRENT_OWNER_REMATERIALIZATION_20260925.md").read_text(encoding="utf-8")

          required = [
              'V513_NMJE_P4PLUS_SHADOW_20260925',
              'NMJE_P4PLUS_SHADOW_006_20260925',
              'NMJE_P2_PrintEqualEligibilityShadow',
              'NMJE_P3_UpdateClosedM5Shadow',
              'NMJE_FreezeValidatedDecisionAttribution',
              'SaveNMJEShadowAttribution',
              'LoadNMJEShadowAttribution',
              'NMJE_ClassifyJourneyMaturity',
              'NMJE_PrintStructuralDensityShadow',
              'NMJE_ApplyJourneyProvenanceStability',
              'NMJE_BuildEntryDisplacementAttribution',
              'NMJE_ApplyStrictJourneyLineage',
              'M5_SIGNAL_SEMANTICS_NOT_MATERIALIZED_TRUE_CONFLICT_HOLD',
              'M15 remains the sole processing/final-decision clock',
          ]
          for marker in required:
              if marker not in source and marker not in audit:
                  raise SystemExit(f"missing NMJE marker: {marker}")

          if source.count('NMJE_P2_PrintEqualEligibilityShadow') != 2:
              raise SystemExit('P2 helper must have one definition and one call')
          if source.count('NMJE_P3_UpdateClosedM5Shadow') != 2:
              raise SystemExit('P3 helper must have one definition and one call')

          for forbidden in (
              'EnableNMJEExecutionGate',
              'EnableNestedExecutionGate',
              'N3_EXECUTION_POLICY',
              'N3_POLICY_ACTIVE',
              'REJ_NMJE_RELATION',
          ):
              if forbidden in source:
                  raise SystemExit(f'forbidden execution authority marker: {forbidden}')

          if source.count('OrderSend(') != 1:
              raise SystemExit('M22 sole OrderSend ownership changed')

          p7 = source.find('NMJE_PrintStructuralDensityShadow(pairIndex')
          priority = source.find('PriorityEngine_Atomic(allCandidates')
          if p7 < 0 or priority < 0 or p7 >= priority:
              raise SystemExit('P7 shadow must observe before priority without replacing it')

          m = re.search(r'if\(decision\.DecisionState == DEC_VALIDATED\)\s*\{(.*?)\n\s*\}', source, re.S)
          if not m:
              raise SystemExit('validated-decision block missing')
          body = m.group(1)
          order = [
              body.find('NMJE_FreezeValidatedDecisionAttribution'),
              body.find('NMJE_PrintValidatedDecisionShadow'),
              body.find('RunEntryPreflightAndExecute'),
          ]
          if any(x < 0 for x in order) or order != sorted(order):
              raise SystemExit(f'P4 freeze/preflight order invalid: {order}')

          p3_start = source.find('void NMJE_P3_UpdateClosedM5Shadow')
          p3_end = source.find('\n}', p3_start)
          p3_body = source[p3_start:p3_end]
          for detector in ('DetectExtreme(', 'DetectCSD(', 'DetectECSD(', 'DetectCSM(', 'UpdateReEntryState('):
              if detector in p3_body:
                  raise SystemExit(f'P3 must not create M5 semantics: {detector}')

          if 'CONTINUATION is intentionally never inferred' not in source:
              raise SystemExit('P11 strict-A no-inference guard missing')

          print('NMJE_V2_CURRENT_OWNER_STATIC=PASS')
          PY
