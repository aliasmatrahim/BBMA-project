name: NMJE V2 current-owner validation

on:
  pull_request:
    branches:
      - d1-owner-dev
    paths:
      - 'blueprint/source/BBMA_EA.mq4'
      - 'blueprint/audits/NMJE_V2_P2_P3_CURRENT_OWNER_REMATERIALIZATION_20260925.md'
      - 'blueprint/audits/NMJE_V2_P4PLUS_CURRENT_OWNER_REMATERIALIZATION_20260925.md'
      - 'blueprint/audits/NMJE_V2_P2_COUNTERFACTUAL_SHADOW_ATTRIBUTION_20260925.md'
      - 'blueprint/audits/NMJE_V2_P2_TARGETLESS_LIFECYCLE_REPLAY_20260925.md'
      - 'blueprint/audits/evidence/NMJE_V2_P4PLUS_20260925/**'
      - 'blueprint/audits/evidence/NMJE_V2_P2_COUNTERFACTUAL_20260925/**'
      - 'blueprint/audits/evidence/NMJE_V2_P2_TARGETLESS_REPLAY_20260925/**'
      - 'blueprint/audits/NMJE_V2_BUILD516_FORWARD_M5_OWNER_PREP_20260926.md'
      - 'blueprint/audits/evidence/NMJE_V2_BUILD516_20260926/**'
      - '.github/workflows/nmje-v2-current-owner-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nmje-v2-static:
    name: NMJE V2 current-owner authority invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify current-owner bounded authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path("blueprint/source/BBMA_EA.mq4").read_text(encoding="utf-8")
          audit = Path("blueprint/audits/NMJE_V2_P2_COUNTERFACTUAL_SHADOW_ATTRIBUTION_20260925.md").read_text(encoding="utf-8")
          replay_audit = Path("blueprint/audits/NMJE_V2_P2_TARGETLESS_LIFECYCLE_REPLAY_20260925.md").read_text(encoding="utf-8")

          required = [
              'NMJE_P2_PrintEqualEligibilityShadow',
              'NMJE_P3_UpdateClosedM5Shadow',
              'NMJE_FreezeValidatedDecisionAttribution',
              'SaveNMJEShadowAttribution',
              'LoadNMJEShadowAttribution',
              'NMJE_ClassifyJourneyMaturity',
              'NMJE_PrintStructuralDensityShadow',
              'NMJE_ApplyJourneyProvenanceStability',
              'NMJE_BuildEntryDisplacementAttribution',
              'NMJE_ApplyStrictJourneyLineage',
              'NMJE_P2_RegisterCounterfactualOpen',
              'NMJE_P2_PrintCounterfactualOutcomes',
              'NMJE_P2_IsSameCounterfactualExecutionIdentity',
              'NMJE_IsForwardEvidenceEnabled',
              'EnableNMJEForwardEvidence',
              'M5SemanticOwnerState',
              'UpdateCanonicalM5SemanticOwners',
              'M5_CONFIRMED_RE_OPPOSES_PARENT_TRUE_CONFLICT_HOLD',
              'The canonical comparator remains untouched.',
          ]
          for marker in required:
              if marker not in source and marker not in audit and marker not in replay_audit:
                  raise SystemExit(f"missing NMJE marker: {marker}")

          if source.count('NMJE_P2_PrintEqualEligibilityShadow') != 2:
              raise SystemExit('P2 helper must have one definition and one call')
          if source.count('NMJE_P3_UpdateClosedM5Shadow') != 2:
              raise SystemExit('P3 helper must have one definition and one call')

          for forbidden in (
              'EnableNMJEExecutionGate',
              'EnableNestedExecutionGate',
              'N3_EXECUTION_POLICY',
              'N3_POLICY_ACTIVE',
              'REJ_NMJE_RELATION',
          ):
              if forbidden in source:
                  raise SystemExit(f'forbidden execution authority marker: {forbidden}')

          if source.count('OrderSend(') != 1:
              raise SystemExit('M22 sole OrderSend ownership changed')

          p7 = source.find('NMJE_PrintStructuralDensityShadow(pairIndex')
          priority = source.find('PriorityEngine_Atomic(allCandidates')
          if p7 < 0 or priority < 0 or p7 >= priority:
              raise SystemExit('P7 shadow must observe before priority without replacing it')

          m = re.search(r'if\(decision\.DecisionState == DEC_VALIDATED\)\s*\{(.*?)\n\s*\}', source, re.S)
          if not m:
              raise SystemExit('validated-decision block missing')
          body = m.group(1)
          order = [
              body.find('NMJE_FreezeValidatedDecisionAttribution'),
              body.find('NMJE_PrintValidatedDecisionShadow'),
              body.find('RunEntryPreflightAndExecute'),
          ]
          if any(x < 0 for x in order) or order != sorted(order):
              raise SystemExit(f'P4 freeze/preflight order invalid: {order}')

          p3_start = source.find('void NMJE_P3_UpdateClosedM5Shadow')
          p3_end = source.find('\n}', p3_start)
          p3_body = source[p3_start:p3_end]
          for detector in ('DetectExtreme(', 'DetectCSD(', 'DetectECSD(', 'DetectCSM(', 'UpdateReEntryState('):
              if detector in p3_body:
                  raise SystemExit(f'P3 must not create M5 semantics: {detector}')
          if 'NESTED_CONFLICT' in p3_body:
              raise SystemExit('P5 true conflict must remain HOLD / non-executable')

          if 'CONTINUATION is intentionally never inferred' not in source:
              raise SystemExit('P11 strict-A no-inference guard missing')

          def function_body(name):
              start = source.find('void ' + name + '(')
              if start < 0:
                  start = source.find('bool ' + name + '(')
              if start < 0:
                  raise SystemExit(f'missing function: {name}')
              brace = source.find('{', start)
              depth = 0
              for i in range(brace, len(source)):
                  if source[i] == '{': depth += 1
                  elif source[i] == '}':
                      depth -= 1
                      if depth == 0:
                          return source[start:i+1]
              raise SystemExit(f'unclosed function: {name}')

          forward = function_body('NMJE_IsForwardEvidenceEnabled')
          if 'if(IsTesting()) return true;' not in forward:
              raise SystemExit('NMJE forward evidence must always allow tester mode')
          if 'return (EnableNMJEForwardEvidence && IsDemo());' not in forward:
              raise SystemExit('NMJE forward evidence must be explicitly demo-only outside tester')
          if not re.search(r'input bool\s+EnableNMJEForwardEvidence\s*=\s*false\s*;', source):
              raise SystemExit('NMJE forward evidence input must default OFF')

          owner = function_body('UpdateCanonicalM5SemanticOwners')
          for required_owner_call in (
              'DetectExtreme(', 'UpdateExtremeLifecycle(', 'UpdateCanonicalMLVState(',
              'BuildCanonicalM5DirectionSnapshots(', 'UpdateReEntryState(',
          ):
              if required_owner_call not in owner:
                  raise SystemExit(f'M5 canonical owner path missing: {required_owner_call}')

          direction_helper = function_body('BuildCanonicalM5DirectionSnapshots')
          for required_direction_call in ('DetectCSD(', 'DetectECSD(', 'DetectCSM('):
              if required_direction_call not in direction_helper:
                  raise SystemExit(f'M5 canonical M10 helper missing: {required_direction_call}')

          owner_surface = owner + '\n' + direction_helper
          for forbidden_owner_call in (
              'OrderSend(', 'OrderClose(', 'CheckRiskBeforeTrade(',
              'CalculateLotSize(', 'FinalPortfolioGuard(', 'ProcessEntry(',
          ):
              if forbidden_owner_call in owner_surface:
                  raise SystemExit(f'M5 owner preparation gained trade authority: {forbidden_owner_call}')

          if source.count('UpdateCanonicalM5SemanticOwners(pairIndex)') != 1:
              raise SystemExit('M5 owner preparation must be called exactly once per M15 ProcessPair cycle')
          m5_owner_call = source.find('UpdateCanonicalM5SemanticOwners(pairIndex)')
          nested_call = source.find('UpdateNestedJourneyObservation(pairIndex)', m5_owner_call)
          p3_call = source.find('NMJE_P3_UpdateClosedM5Shadow(pairIndex)', m5_owner_call)
          if m5_owner_call < 0 or nested_call < m5_owner_call or p3_call < nested_call:
              raise SystemExit('M5 owner -> nested journey -> P3 consumption ordering invalid')

          register = function_body('NMJE_P2_RegisterCounterfactualOpen')
          outcome = function_body('NMJE_P2_PrintCounterfactualOutcomes')
          cf = register + '\\n' + outcome
          if 'if(!NMJE_IsForwardEvidenceEnabled()) return;' not in register or 'if(!NMJE_IsForwardEvidenceEnabled()) return;' not in outcome:
              raise SystemExit('counterfactual overlay must remain bounded to tester/demo evidence mode')
          for forbidden in ('OrderSend(', 'OrderClose(', 'CheckRiskBeforeTrade(',
                            'CalculateLotSize(', 'FinalPortfolioGuard(', 'ProcessEntry('):
              if forbidden in cf:
                  raise SystemExit(f'counterfactual overlay gained authority call: {forbidden}')
          if register.find('if(active.Count >= 2)') < 0 or \
             register.find('[Q9-P2-CF-OPEN]') < register.find('if(active.Count >= 2)'):
              raise SystemExit('counterfactual OPEN must be emitted only for a committed multi-candidate set')

          targetless_names = (
              'NMJE_P2_CaptureC044ReplayState',
              'NMJE_P2_RestoreC044ReplayTrade',
              'NMJE_P2_FindHardSLHitInClosedM1Window',
              'NMJE_P2_ResolveTargetlessC044Outcome',
          )
          for name in targetless_names:
              if name not in source:
                  raise SystemExit(f'missing targetless replay helper: {name}')

          targetless = function_body('NMJE_P2_ResolveTargetlessC044Outcome')
          if 'ProcessC044OwnerClosedCandle(replay, pairIndex, candleTime)' not in targetless:
              raise SystemExit('targetless replay must reuse canonical C044 owner-event processor')
          for forbidden in ('OrderSend(', 'OrderClose(', 'CheckRiskBeforeTrade(',
                            'CalculateLotSize(', 'FinalPortfolioGuard(', 'ProcessEntry(',
                            'DetectCSM(', 'DetectExtreme(', 'UpdateExtremeLifecycle(',
                            'UpdateReEntryState('):
              if forbidden in targetless:
                  raise SystemExit(f'targetless replay gained forbidden authority/formula: {forbidden}')

          if 'if(info.c044_shadow_replay) return true;' not in source:
              raise SystemExit('shadow checkpoint no-op guard missing')
          if 'if(info.c044_shadow_replay) return;' not in source:
              raise SystemExit('shadow F7 telemetry suppression missing')
          if 'info.c044_shadow_replay = false;' not in source:
              raise SystemExit('live shadow replay default reset missing')
          if '!shadow.D1TPWLifecycleManaged' not in register:
              raise SystemExit('D1 TPW must remain excluded from targetless C044 replay')

          print('NMJE_V2_CURRENT_OWNER_STATIC=PASS')
          PY