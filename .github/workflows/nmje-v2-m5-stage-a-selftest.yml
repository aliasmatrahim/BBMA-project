name: NMJE v2 M5 Stage A-E4 selftest

on:
  pull_request:
    branches:
      - nmje-n3-hardening-dev
    paths:
      - 'blueprint/contracts/NMJE_V2_M5_ACCURACY_HARDENING_CONTRACT.md'
      - 'blueprint/implementation/NMJE_V2_M5_WORKSTREAM_PLAN_20260828.md'
      - 'blueprint/tests/test_nmje_v2_m5_lineage_fixture.py'
      - 'blueprint/tests/test_nmje_v2_m5_stage_a_static.py'
      - 'blueprint/tests/test_nmje_v2_m5_stage_b_schema_static.py'
      - 'blueprint/tests/test_nmje_v2_m5_stage_c1_acquisition_static.py'
      - 'blueprint/tests/test_nmje_v2_m5_stage_c2_shadow_static.py'
      - 'blueprint/tests/test_nmje_v2_m5_stage_d1_attribution_static.py'
      - 'blueprint/tests/test_nmje_v2_m5_stage_e1_conflict_static.py'
      - 'blueprint/tests/test_nmje_v2_m5_stage_e2_maturity_static.py'
      - 'blueprint/tests/test_nmje_v2_m5_stage_e3_density_static.py'
      - 'blueprint/tests/test_nmje_v2_m5_stage_e4_stability_static.py'
      - 'blueprint/implementation/NMJE_V2_M5_STAGE_B_SCHEMA_RECORD_20260828.md'
      - 'blueprint/implementation/NMJE_V2_M5_STAGE_C1_ACQUISITION_RECORD_20260828.md'
      - 'blueprint/implementation/NMJE_V2_M5_STAGE_C2_SHADOW_CLASSIFICATION_RECORD_20260828.md'
      - 'blueprint/implementation/NMJE_V2_M5_STAGE_D1_ATTRIBUTION_RECORD_20260828.md'
      - 'blueprint/implementation/NMJE_V2_M5_STAGE_E1_P5_CONFLICT_RECORD_20260828.md'
      - 'blueprint/implementation/NMJE_V2_M5_STAGE_E2_P6_MATURITY_RECORD_20260829.md'
      - 'blueprint/implementation/NMJE_V2_M5_STAGE_E3_P7_DENSITY_RECORD_20260829.md'
      - 'blueprint/implementation/NMJE_V2_M5_STAGE_E4_P8_STABILITY_RECORD_20260829.md'
      - 'blueprint/source/BBMA_EA.mq4'
      - '.github/workflows/nmje-v2-m5-stage-a-selftest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage-a-e4-provenance-stability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Stage B schema-only source boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 blueprint/tests/test_nmje_v2_m5_stage_b_schema_static.py

      - name: Run deterministic M5 lineage fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 blueprint/tests/test_nmje_v2_m5_lineage_fixture.py

      - name: Run Stage A authority and baseline firewall
        shell: bash
        run: |
          set -euo pipefail
          python3 blueprint/tests/test_nmje_v2_m5_stage_a_static.py

      - name: Verify Stage C1 closed-data-only acquisition boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 blueprint/tests/test_nmje_v2_m5_stage_c1_acquisition_static.py

      - name: Verify Stage C2 shadow classification and authority firewall
        shell: bash
        run: |
          set -euo pipefail
          python3 blueprint/tests/test_nmje_v2_m5_stage_c2_shadow_static.py

      - name: Verify Stage D1 durable outcome attribution firewall
        shell: bash
        run: |
          set -euo pipefail
          python3 blueprint/tests/test_nmje_v2_m5_stage_d1_attribution_static.py

      - name: Verify Stage E1 P5 conflict-subtype metadata firewall
        shell: bash
        run: |
          set -euo pipefail
          python3 blueprint/tests/test_nmje_v2_m5_stage_e1_conflict_static.py

      - name: Verify Stage E2 P6 maturity metadata firewall
        shell: bash
        run: |
          set -euo pipefail
          python3 blueprint/tests/test_nmje_v2_m5_stage_e2_maturity_static.py

      - name: Verify Stage E3 P7 structural-density metadata firewall
        shell: bash
        run: |
          set -euo pipefail
          python3 blueprint/tests/test_nmje_v2_m5_stage_e3_density_static.py

      - name: Verify Stage E4 P8 parent-provenance stability firewall
        shell: bash
        run: |
          set -euo pipefail
          python3 blueprint/tests/test_nmje_v2_m5_stage_e4_stability_static.py

      - name: Compile test harness
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            blueprint/tests/test_nmje_v2_m5_lineage_fixture.py \
            blueprint/tests/test_nmje_v2_m5_stage_a_static.py \
            blueprint/tests/test_nmje_v2_m5_stage_b_schema_static.py \
            blueprint/tests/test_nmje_v2_m5_stage_c1_acquisition_static.py \
            blueprint/tests/test_nmje_v2_m5_stage_c2_shadow_static.py \
            blueprint/tests/test_nmje_v2_m5_stage_d1_attribution_static.py \
            blueprint/tests/test_nmje_v2_m5_stage_e1_conflict_static.py \
            blueprint/tests/test_nmje_v2_m5_stage_e2_maturity_static.py \
            blueprint/tests/test_nmje_v2_m5_stage_e3_density_static.py \
            blueprint/tests/test_nmje_v2_m5_stage_e4_stability_static.py
          echo 'NMJE_V2_M5_STAGE_A_B_C1_C2_D1_E1_E2_E3_E4_SELFTEST=PASS'

