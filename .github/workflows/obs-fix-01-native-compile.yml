name: OBS-FIX-01 native MT4 compile

on:
  push:
    branches: [obs-fix-01-event-driven-dev]
    paths:
      - 'blueprint/.run-obs-fix-01-native-compile'
      - '.github/workflows/obs-fix-01-native-compile.yml'
      - 'blueprint/runtime/V459_Runtime_Observer.mq4'
      - 'blueprint/tests/test_v459_runtime_observer_event_driven.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: obs-fix-01-event-driven-dev
          fetch-depth: 1

      - name: Verify exact observer scope and static guard
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = '.\blueprint\runtime\V459_Runtime_Observer.mq4'
          $txt = Get-Content $src -Raw
          foreach ($required in @(
            '#property version   "1.10"',
            'input int ObserverDebugLevel = 0;',
            'input bool EmitInitialHistoryDetails = false;',
            'bool PollObservableState()',
            'TaggedRecord("BASELINE_END"',
            'TaggedRecord("CHANGE_END"'
          )) {
            if ($txt -notmatch [regex]::Escape($required)) { throw "Missing observer marker: $required" }
          }
          foreach ($forbidden in @('OrderSend(', 'OrderClose(', 'OrderModify(', 'OrderDelete(')) {
            if ($txt -match [regex]::Escape($forbidden)) { throw "Forbidden broker-write token: $forbidden" }
          }
          python -m py_compile .\blueprint\tests\test_v459_runtime_observer_event_driven.py
          python .\blueprint\tests\test_v459_runtime_observer_event_driven.py
          $blob = (git rev-parse HEAD:blueprint/runtime/V459_Runtime_Observer.mq4).Trim()
          $sha256 = (Get-FileHash $src -Algorithm SHA256).Hash.ToLower()
          "OBSERVER_BLOB=$blob" | Out-File $env:GITHUB_ENV -Append
          "WINDOWS_SHA256=$sha256" | Out-File $env:GITHUB_ENV -Append
          Write-Host "Observer blob: $blob"
          Write-Host "Windows checkout SHA256: $sha256"

      - name: Acquire official MT4 MetaEditor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $meta = Get-ChildItem 'C:\Program Files*' -Filter metaeditor.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $meta) {
            $setup = Join-Path $env:RUNNER_TEMP 'mt4setup.exe'
            Invoke-WebRequest -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt4/mt4setup.exe' -OutFile $setup -UseBasicParsing
            $proc = Start-Process -FilePath $setup -ArgumentList '/auto' -PassThru
            for ($i=0; $i -lt 84; $i++) {
              Start-Sleep -Seconds 5
              $meta = Get-ChildItem 'C:\Program Files*' -Filter metaeditor.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($meta) { break }
              if ($proc.HasExited -and $i -gt 12) { break }
            }
            if ($proc -and -not $proc.HasExited) { try { $proc.Kill() } catch {} }
          }
          if (-not $meta) { throw 'Official MT4 MetaEditor not found' }
          "METAEDITOR=$($meta.FullName)" | Out-File $env:GITHUB_ENV -Append
          Write-Host "MetaEditor: $($meta.FullName)"

      - name: Native MetaEditor 0E0W compile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = (Resolve-Path '.\blueprint\runtime\V459_Runtime_Observer.mq4').Path
          $log = Join-Path $env:RUNNER_TEMP 'obs-fix-01-metaeditor.log'
          & "$env:METAEDITOR" "/compile:$src" "/log:$log"
          Start-Sleep -Seconds 2
          if (-not (Test-Path $log)) { throw 'MetaEditor compile log missing' }
          $txt = Get-Content $log -Raw
          $txt | Write-Host
          $matches = [regex]::Matches($txt, '(?i)(\d+)\s+errors?,\s*(\d+)\s+warnings?')
          if ($matches.Count -lt 1) { throw 'Unable to parse compile summary' }
          $m = $matches[$matches.Count - 1]
          $errors = [int]$m.Groups[1].Value
          $warnings = [int]$m.Groups[2].Value
          if ($errors -ne 0 -or $warnings -ne 0) { throw "Native compile failed: $errors errors / $warnings warnings" }
          $ex4 = [System.IO.Path]::ChangeExtension($src,'.ex4')
          if (-not (Test-Path $ex4)) { throw 'Observer EX4 missing' }
          $ex4sha = (Get-FileHash $ex4 -Algorithm SHA256).Hash.ToLower()
          "COMPILE_ERRORS=$errors" | Out-File $env:GITHUB_ENV -Append
          "COMPILE_WARNINGS=$warnings" | Out-File $env:GITHUB_ENV -Append
          "EX4_SHA256=$ex4sha" | Out-File $env:GITHUB_ENV -Append

      - name: Write compile evidence summary
        if: success()
        shell: pwsh
        run: |
          @"
          OBS_FIX_01_NATIVE_METAEDITOR=PASS
          OBSERVER_BLOB=$env:OBSERVER_BLOB
          WINDOWS_SHA256=$env:WINDOWS_SHA256
          EX4_SHA256=$env:EX4_SHA256
          METAEDITOR=$env:METAEDITOR
          COMPILE_ERRORS=$env:COMPILE_ERRORS
          COMPILE_WARNINGS=$env:COMPILE_WARNINGS
          "@ | Set-Content '.\obs-fix-01-compile-summary.txt'

      - name: Upload observer build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obs-fix-01-event-driven-observer-build
          path: |
            blueprint/runtime/V459_Runtime_Observer.ex4
            ${{ runner.temp }}/obs-fix-01-metaeditor.log
            obs-fix-01-compile-summary.txt
          if-no-files-found: warn
