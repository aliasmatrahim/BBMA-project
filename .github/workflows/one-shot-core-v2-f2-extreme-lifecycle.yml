5 completes standalone retest maturity.\n- Applicable outside-BB / source-valid directional Momentum invalidation is evaluated before maturity promotion and resolves to `VOID`.\n- REM/RRE/REE receive an Extreme `Signal` only from `ExportReversalConfirmedExtremeSignal()`, so RAW Extreme cannot satisfy a combination component.\n- M16 keeps `MaxWaitBars_Extreme` only as the pre-existing **project component-freshness overlay**; it no longer defines reversal/retest maturity or performs the old any-CSM strategy invalidation.\n- A fresh RAW condition after an already-mature component has aged beyond the project freshness window may start a new same-direction candidate; this preserves existing freshness behavior without turning MaxWaitBars into a BBMA maturity rule.\n\n## Static invariants verified by the one-shot patch\n- RAW detector contains no close-inside-BB gate.\n- Reversal-confirmed export is the only path that populates H1/H4 executable Extreme snapshots.\n- Existing exact REM/RRE/REE signatures are unchanged.\n- Legacy `h1AnyCSMSnapshot/h4AnyCSMSnapshot` persistence path is removed.\n- M16 component owner still exact-matches direction, timeframe and confirmation candle identity.\n- No standalone Extreme direct-entry path was introduced.\n\n## Remaining verification\n1. Native MetaEditor compile must report **0 errors / 0 warnings**.\n2. Regression/static audit should prove RAW Extreme never reaches M13/M14/M15 as an executable component.\n3. Runtime trace should cover at least: RAW->REVERSAL_CONFIRMED; invalidation-before-confirmation; multi-candle reversal anchor update; retest start/freeze; body-touch completion; MA5-touch completion; invalidation precedence.\n4. F1 implementation must consume this F2 lifecycle for prior-Extreme provenance without weakening F2 maturity.\n\nDecision provenance: `blueprint/decisions/CORE_V2_F2_EXTREME_MATURITY_DECISION.md`.\n''', encoding='utf-8')
