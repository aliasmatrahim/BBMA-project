name: One-shot P3-M2-07 direction guard via issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: github.event.issue.title == 'RUN P3 M2 07 DIRECTION GUARD 20260823'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p3-m2-07-cycle-direction-guard
          fetch-depth: 0

      - name: Apply M2-07 source-derived cycle direction guard
        run: python3 blueprint/tools/apply_p3_m2_07_guard.py

      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'P3-M2-07 OPPOSITE GUARD' blueprint/source/BBMA_EA.mq4
          grep -q '#property description "P3-M2-07 Cycle Direction Guard"' blueprint/source/BBMA_EA.mq4
          grep -q 'SOURCE-DERIVED CYCLE DIRECTION GUARD' blueprint/source/BBMA_EA.mq4
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "P3-M2-07: enforce source-derived cycle direction guard"
          git push origin HEAD:p3-m2-07-cycle-direction-guard

      - name: Close trigger issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --comment "P3-M2-07 direction-guard patch workflow finished."
