name: One-shot M17 runtime fix via PR target

on:
  pull_request_target:
    types: [opened]
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.title == 'RUN M17 RUNTIME FIX TOKEN 20260821'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: blueprint-dev

      - name: Wire M17 execution price and source-owned SLTP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('blueprint/source/BBMA_EA.mq4')
          s = p.read_text(encoding='utf-8')

          old_preflight = '''   RiskValidationSnapshot snapshot;
   BuildRiskValidationSnapshot(pair, decision, snapshot);

   // M17: resolve/validate the source-owned BBMA destination and protective SL.
   ENUM_REJECTION_REASON sltpRejection = REJ_NONE;
   if(!ValidateSLTP(decision, snapshot, sltpRejection))
   {
      decision.DecisionState = DEC_REJECTED;
      decision.RejectionReason = (sltpRejection != REJ_NONE) ?
                                 sltpRejection : REJ_SLTP_UNRESOLVED;
      return false;
   }
'''

          new_preflight = '''   RiskValidationSnapshot snapshot;
   BuildRiskValidationSnapshot(pair, decision, snapshot);

   // M17 runtime wiring: strategy eligibility is already frozen by M15/M16,
   // while market execution geometry must use the live broker side.
   // BUY references ASK; SELL references BID.
   if(!ResolveExecutionReferencePrice(decision, snapshot))
   {
      decision.DecisionState = DEC_REJECTED;
      decision.RejectionReason = REJ_MARKET_PRICE_INVALID;
      return false;
   }

   // Resolve only the already-approved source-owned BBMA SL/TP. No fixed-pip,
   // RR-derived or alternate destination is manufactured here.
   if(!ResolveApprovedInitialSLTP(decision, snapshot))
   {
      decision.DecisionState = DEC_REJECTED;
      decision.RejectionReason = REJ_SLTP_UNRESOLVED;
      return false;
   }

   // M17 has now finalized the protective SL; freeze the same value into the
   // risk snapshot consumed by M21/M19 so the payload remains atomic.
   snapshot.StopLoss = decision.StopLoss;

   ENUM_REJECTION_REASON sltpRejection = REJ_NONE;
   if(!ValidateSLTP(decision, snapshot, sltpRejection))
   {
      decision.DecisionState = DEC_REJECTED;
      decision.RejectionReason = (sltpRejection != REJ_NONE) ?
                                 sltpRejection : REJ_SLTP_UNRESOLVED;
      return false;
   }
'''

          if s.count(old_preflight) != 1:
              if (s.count('if(!ResolveExecutionReferencePrice(decision, snapshot))') == 1 and
                  s.count('if(!ResolveApprovedInitialSLTP(decision, snapshot))') == 1 and
                  s.count('snapshot.StopLoss = decision.StopLoss;') == 1):
                  raise SystemExit(0)
              raise SystemExit(f'expected one old M17 preflight block, found {s.count(old_preflight)}')

          s = s.replace(old_preflight, new_preflight, 1)

          if s.count('if(!ResolveExecutionReferencePrice(decision, snapshot))') != 1:
              raise SystemExit('execution-price wiring not unique')
          if s.count('if(!ResolveApprovedInitialSLTP(decision, snapshot))') != 1:
              raise SystemExit('SLTP resolver wiring not unique')
          if s.count('snapshot.StopLoss = decision.StopLoss;') != 1:
              raise SystemExit('M17-to-M21 frozen StopLoss sync not unique')

          p.write_text(s, encoding='utf-8')
          PY

          if git diff --quiet -- blueprint/source/BBMA_EA.mq4; then
            echo 'M17 runtime wiring already applied.'
            exit 0
          fi

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- blueprint/source/BBMA_EA.mq4
          git commit -m "P3 runtime fix: wire M17 market price and source SLTP"
          git push origin HEAD:blueprint-dev
