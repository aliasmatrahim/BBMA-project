name: One-shot neutral BBMA EA naming

on:
  push:
    branches: [ blueprint-dev ]
    paths:
      - '.github/workflows/one-shot-neutral-bbma-name.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: blueprint-dev

      - name: Neutralize EA identity only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old = Path('blueprint/source/BBMA_PROFESSIONAL_EA.mq4')
          new = Path('blueprint/source/BBMA_EA.mq4')
          if not old.exists():
              raise SystemExit('canonical old source not found')
          if new.exists():
              raise SystemExit('target BBMA_EA.mq4 already exists')

          s = old.read_text(encoding='utf-8')
          before = s
          s = s.replace('BBMA_PROFESSIONAL_EA.mq4', 'BBMA_EA.mq4', 1)
          s = s.replace('#property copyright "BBMA Professional EA"', '#property copyright "BBMA EA"', 1)
          s = s.replace('#property link      "https://www.bbmaea.com"', '#property link      ""', 1)

          if s == before:
              raise SystemExit('identity replacements made no changes')
          if 'BBMA Professional EA' in s[:2000]:
              raise SystemExit('old branding still present in header')

          new.write_text(s, encoding='utf-8')
          old.unlink()

          # Keep current verification record pointed at the canonical source path.
          record = Path('blueprint/P3_PAIRID_VERIFICATION_RECORD.md')
          if record.exists():
              r = record.read_text(encoding='utf-8')
              r = r.replace('blueprint/source/BBMA_PROFESSIONAL_EA.mq4', 'blueprint/source/BBMA_EA.mq4')
              record.write_text(r, encoding='utf-8')

          # Update canonical path mention in CURRENT.md only; do not alter historical evidence/SHA claims.
          current = Path('blueprint/CURRENT.md')
          if current.exists():
              c = current.read_text(encoding='utf-8')
              c = c.replace('blueprint/source/BBMA_PROFESSIONAL_EA.mq4', 'blueprint/source/BBMA_EA.mq4')
              current.write_text(c, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- blueprint/source/BBMA_EA.mq4 blueprint/source/BBMA_PROFESSIONAL_EA.mq4 blueprint/P3_PAIRID_VERIFICATION_RECORD.md blueprint/CURRENT.md
          git commit -m "Neutralize canonical EA name to BBMA EA"
          git push origin blueprint-dev
