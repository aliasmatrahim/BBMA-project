name: One-shot reconcile N1-N3 tracking

on:
  pull_request:
    branches:
      - d1-owner-dev
    paths:
      - 'blueprint/.n1-n3-tracking-sync-trigger'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d1-owner-dev
          fetch-depth: 0

      - name: Append authoritative N1-N3 status overlays
        shell: bash
        run: |
          set -euo pipefail
          python3 blueprint/ci/reconcile_n1_n3_tracking.py
          python3 - <<'PY'
          from pathlib import Path
          for name in ('blueprint/CURRENT.md', 'blueprint/MASTER_QUEUE.md'):
              p = Path(name)
              p.write_text(p.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
          git diff --check
          git status --short

      - name: Commit tracking sync and remove one-shot plumbing
        shell: bash
        run: |
          set -euo pipefail
          rm -f blueprint/ci/reconcile_n1_n3_tracking.py
          rm -f .github/workflows/one-shot-reconcile-n1-n3-tracking.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No tracking sync changes required.'
            exit 0
          fi
          git commit -m 'Reconcile N1-N3 completion into canonical tracking [skip ci]'
          git push origin HEAD:d1-owner-dev
