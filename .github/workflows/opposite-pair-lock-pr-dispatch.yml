name: Opposite pair-lock audit/fix dispatch

on:
  pull_request:
    branches: [ blueprint-dev ]
    types: [opened, reopened, synchronize]
    paths:
      - 'blueprint/.opposite-pair-lock-dispatch'

permissions:
  contents: write

jobs:
  fix-pair-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: blueprint-dev
          fetch-depth: 0

      - name: Audit and fix opposite-direction same-pair TradeLock integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_opposite_pair_lock_fix.py
          git diff --check

      - name: Commit pair-lock fix to blueprint-dev
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- blueprint/source/BBMA_EA.mq4 \
                     blueprint/contracts/M22_ORDER_EXECUTION_CONTRACT.md \
                     blueprint/P3_OPPOSITE_DIRECTION_PAIR_INTEGRITY_AUDIT.md \
                     blueprint/MASTER_QUEUE.md \
                     blueprint/CURRENT.md
          if git diff --cached --quiet; then
            echo 'No pair-lock changes to commit.'
            exit 0
          fi
          git commit -m "P3: fix opposite-direction same-pair TradeLock"
          git push origin HEAD:blueprint-dev
