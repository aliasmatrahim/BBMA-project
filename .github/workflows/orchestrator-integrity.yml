name: Orchestrator Integrity

# Includes the experiment evidence manifest suite for scoped tooling PRs.
# Keep validation runs tied to the exact PR head after test-only changes.
# G1 dataset integrity and experiment inventory tests are mandatory regression inputs.

on:
  pull_request:
    paths:
      - "tools/bbma_orchestrator/**"
      - "tests/test_bbma_orchestrator.py"
      - "tests/test_experiment_evidence.py"
      - "tests/test_dataset_validator.py"
      - "tests/test_experiment_inventory.py"
      - "blueprint/research/PROFITABILITY_EXPERIMENT_*.md"
      - "config/bbma_architecture_invariants.json"
      - "config/bbma_module_graph.json"
      - "docs/BBMA_AUTONOMOUS_ENGINEERING_INFRASTRUCTURE.md"
      - "docs/superpowers/plans/2026-09-14-autonomous-engineering-infrastructure.md"
      - "docs/superpowers/plans/2026-09-14-source-library-autonomy.md"
      - ".github/workflows/orchestrator-integrity.yml"
  push:
    branches:
      - "chore/autonomous-engineering-infra-*"
      - "chore/source-autonomy-*"
    paths:
      - "tools/bbma_orchestrator/**"
      - "tests/test_bbma_orchestrator.py"
      - "tests/test_experiment_evidence.py"
      - "tests/test_dataset_validator.py"
      - "tests/test_experiment_inventory.py"
      - "blueprint/research/PROFITABILITY_EXPERIMENT_*.md"
      - "docs/superpowers/plans/2026-09-14-source-library-autonomy.md"
      - "config/bbma_architecture_invariants.json"
      - "config/bbma_module_graph.json"
      - ".github/workflows/orchestrator-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile tooling
        run: python -m compileall tools/bbma_orchestrator

      - name: Run orchestrator unit and property-style tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: CLI smoke test
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          python -m tools.bbma_orchestrator init \
            --root "$root/state" \
            --task-id CI-SMOKE \
            --roadmap-id INFRA \
            --title "Orchestrator CI smoke" \
            --lane tooling \
            --task-type mechanical
          python -m tools.bbma_orchestrator handoff --root "$root/state"
          python -m tools.bbma_orchestrator env-snapshot \
            --output "$root/environment.json" \
            --native-unverified
          test -s "$root/environment.json"

      - name: Native boundary assertion
        shell: bash
        run: |
          set -euo pipefail
          grep -R --binary-files=without-match \
            --exclude='*.pyc' --exclude-dir='__pycache__' \
            "NOT NATIVE VERIFIED" tools/bbma_orchestrator >/dev/null
          if grep -R --binary-files=without-match \
            --exclude=native.py --exclude='*.pyc' --exclude-dir='__pycache__' \
            -E "merge_pull_request|enable trading|autotrading on|git reset --hard" \
            tools/bbma_orchestrator >/dev/null; then
            echo "Unexpected destructive/native authority string outside safety adapter"
            exit 1
          fi
