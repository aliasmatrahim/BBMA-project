name: P1 Finalization Step1

on:
  push:
    branches: [ blueprint-dev ]
    paths:
      - '.github/workflows/p1-finalization-step1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified baseline
        shell: bash
        run: |
          set -euo pipefail
          cat blueprint/archive/MASTER_BLUEPRINT_2.0_BASELINE.txt.gz.b64.part01a \
              blueprint/archive/MASTER_BLUEPRINT_2.0_BASELINE.txt.gz.b64.part01b \
              blueprint/archive/MASTER_BLUEPRINT_2.0_BASELINE.txt.gz.b64.part02 \
              blueprint/archive/MASTER_BLUEPRINT_2.0_BASELINE.txt.gz.b64.part03 \
              blueprint/archive/MASTER_BLUEPRINT_2.0_BASELINE.txt.gz.b64.part04 \
              blueprint/archive/MASTER_BLUEPRINT_2.0_BASELINE.txt.gz.b64.part05 > /tmp/b64
          base64 -d /tmp/b64 | gzip -dc > MASTER_BLUEPRINT_2.0_BASELINE.txt
          test "$(sha256sum MASTER_BLUEPRINT_2.0_BASELINE.txt | awk '{print $1}')" = "e217816e95126857c1e7fa3fde1ac10ecc28f196a82eb51cb2f3625a6901aa00"

      - name: Materialize exact P1 Step3 patch chain
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, textwrap
          y=Path('.github/workflows/p1-step3-integration-v4.yml').read_text()
          m=re.search(r"python3 - <<'PY'\n(.*?)\n          PY", y, re.S)
          if not m: raise SystemExit('cannot extract V4 applicator')
          exec(compile(textwrap.dedent(m.group(1)), 'p1_v4_applicator', 'exec'), {})
          PY
          test "$(sha256sum MASTER_BLUEPRINT_2.0_WORKING.txt | awk '{print $1}')" = "e81b91a96d95b4446531b445a54c7d60ee5eb71d91646e98eac15ad8e1001da6"

      - name: Apply exact verified compile repair
        shell: bash
        run: |
          set -euo pipefail
          cat blueprint/finalization/compile_repair.patch.gz.b64.part00 \
              blueprint/finalization/compile_repair.patch.gz.b64.part01 > /tmp/repair.b64
          base64 -d /tmp/repair.b64 | gzip -dc > /tmp/compile_repair.patch
          patch MASTER_BLUEPRINT_2.0_WORKING.txt < /tmp/compile_repair.patch
          mkdir -p blueprint/source
          cp MASTER_BLUEPRINT_2.0_WORKING.txt blueprint/source/BBMA_PROFESSIONAL_EA.mq4
          test "$(sha256sum blueprint/source/BBMA_PROFESSIONAL_EA.mq4 | awk '{print $1}')" = "30363d08437b85f253e6baf3e9c82af0d59d70727639ac0e6420a7677f975bc9"

      - name: Record compile-clean evidence
        shell: bash
        run: |
          cat > blueprint/P1_COMPILE_REPAIR_RECORD.md <<'EOF'
          # P1 Compile Repair Record

          Status: **NATIVE METAEDITOR COMPILE VERIFIED BY USER — 0 ERRORS, 0 WARNINGS**

          Canonical source:
          `blueprint/source/BBMA_PROFESSIONAL_EA.mq4`

          Canonical source SHA-256:
          `30363d08437b85f253e6baf3e9c82af0d59d70727639ac0e6420a7677f975bc9`

          Compile repair scope:
          - MQL4 array-return helpers converted to output-array parameters;
          - reserved identifier `input` removed from affected helpers/locals;
          - MQL4 object/struct parameters converted to pass-by-reference where required;
          - `RiskValidationSnapshot.StopLevel` added and populated for M17 broker-stop validation;
          - M17 `ValidateSLTP` rejection propagation signature aligned;
          - local struct-array aggregate initialization converted to explicit assignments;
          - warning-only cleanup for magic-number parameter shadowing/overflow guard and hex conversion.

          These repairs are compile/integration repairs only. They do not intentionally alter locked BBMA strategy semantics.
          EOF

      - name: Commit canonical source to blueprint-dev
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blueprint/source/BBMA_PROFESSIONAL_EA.mq4 blueprint/P1_COMPILE_REPAIR_RECORD.md
          git commit -m "P1 finalization: persist 0E0W compile-clean canonical MQ4"
          git push origin blueprint-dev
