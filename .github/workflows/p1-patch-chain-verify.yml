name: P1 Patch Chain Verify

on:
  push:
    branches: [ blueprint-dev ]
    paths:
      - '.github/workflows/p1-patch-chain-verify.yml'
  workflow_dispatch:

jobs:
  apply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified immutable baseline
        shell: bash
        run: |
          set -euo pipefail
          cat \
            blueprint/archive/MASTER_BLUEPRINT_2.0_BASELINE.txt.gz.b64.part01a \
            blueprint/archive/MASTER_BLUEPRINT_2.0_BASELINE.txt.gz.b64.part01b \
            blueprint/archive/MASTER_BLUEPRINT_2.0_BASELINE.txt.gz.b64.part02 \
            blueprint/archive/MASTER_BLUEPRINT_2.0_BASELINE.txt.gz.b64.part03 \
            blueprint/archive/MASTER_BLUEPRINT_2.0_BASELINE.txt.gz.b64.part04 \
            blueprint/archive/MASTER_BLUEPRINT_2.0_BASELINE.txt.gz.b64.part05 \
            > /tmp/baseline.gz.b64
          base64 --decode /tmp/baseline.gz.b64 > /tmp/baseline.gz
          gzip --decompress --stdout /tmp/baseline.gz > MASTER_BLUEPRINT_2.0_BASELINE.txt
          ACTUAL_SHA=$(sha256sum MASTER_BLUEPRINT_2.0_BASELINE.txt | awk '{print $1}')
          EXPECTED_SHA='e217816e95126857c1e7fa3fde1ac10ecc28f196a82eb51cb2f3625a6901aa00'
          echo "P1_BASELINE_SHA=$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

      - name: Apply patches 0001 through 0025 in exact order
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re, sys

          patches = sorted(Path('blueprint/patches').glob('*.patch'))
          if len(patches) != 25:
              print(f'ERROR: expected 25 patches, found {len(patches)}')
              sys.exit(20)

          for i, p in enumerate(patches, 1):
              expected = f'{i:04d}'
              actual = p.name.split('-', 1)[0]
              if actual != expected:
                  print(f'ERROR: patch order mismatch: expected {expected}, got {actual} ({p.name})')
                  sys.exit(21)

          def parse_patch(path: Path):
              lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
              old_path = new_path = None
              hunks = []
              i = 0
              while i < len(lines):
                  line = lines[i]
                  if line.startswith('--- '):
                      old_path = line[4:].strip()
                      if old_path.startswith('a/'):
                          old_path = old_path[2:]
                      i += 1
                      if i >= len(lines) or not lines[i].startswith('+++ '):
                          raise ValueError('missing +++ header')
                      new_path = lines[i][4:].strip()
                      if new_path.startswith('b/'):
                          new_path = new_path[2:]
                      i += 1
                      continue
                  if line.startswith('@@'):
                      i += 1
                      h = []
                      while i < len(lines) and not lines[i].startswith('@@') and not lines[i].startswith('--- '):
                          h.append(lines[i])
                          i += 1
                      hunks.append(h)
                      continue
                  i += 1
              if not old_path or not new_path or not hunks:
                  raise ValueError('patch missing file header or hunks')
              return old_path, new_path, hunks

          def hunk_blocks(hunk):
              old = []
              new = []
              for line in hunk:
                  if line.startswith('\\ No newline at end of file'):
                      continue
                  if line.startswith('+'):
                      new.append(line[1:])
                  elif line.startswith('-'):
                      old.append(line[1:])
                  elif line.startswith(' '):
                      old.append(line[1:])
                      new.append(line[1:])
                  else:
                      old.append(line)
                      new.append(line)
              return ''.join(old), ''.join(new)

          def repair_0014_hunk8(text: str, new_block: str):
              new_match = re.search(
                  r'bool IsExtremeStateExpired\(Signal extreme, datetime currentTime\).*?'
                  r'decision\.RejectionReason = REJ_NONE;\n\}', new_block, re.S)
              if not new_match:
                  return None
              old_match = re.search(
                  r'void InvalidationEngine_Atomic\(BBMA_Decision &decision, OppositeConflictPackage &conflict\)\n'
                  r'\{.*?bool IsExpired_ReEntry\(ReEntryData reEntry, datetime currentTime\)\n\{.*?\n\}',
                  text, re.S)
              if not old_match:
                  return None
              return text[:old_match.start()] + new_match.group(0) + text[old_match.end():]

          def repair_0016_hunk2(text: str, new_block: str):
              fn = re.search(
                  r'bool ResolveSelectedSLTPSourceComponent\(ValidatedSequenceCandidate selected,.*?\n\}',
                  new_block, re.S)
              if not fn:
                  return None
              anchor = 'int CompareCanonicalCandidates(ValidatedSequenceCandidate &a,\n'
              pos = text.find(anchor)
              if pos < 0:
                  return None
              if 'ResolveSelectedSLTPSourceComponent(' in text:
                  return text
              return text[:pos] + fn.group(0) + '\n\n' + text[pos:]

          def repair_0018_hunk5(text: str, new_block: str):
              start = text.find('void ProcessPair(int pairIndex)')
              if start < 0:
                  return None
              tail = text[start:]
              old = 'decision.RejectionReason = REJ_TOTAL_RISK;'
              idx = tail.find(old)
              if idx < 0:
                  return None
              replacement = ('decision.RejectionReason = (riskStatus.rejection_reason != REJ_NONE) ?\n'
                             '                                          riskStatus.rejection_reason : REJ_TOTAL_RISK;')
              absolute = start + idx
              return text[:absolute] + replacement + text[absolute + len(old):]

          def repair_0021_hunk8(text: str, new_block: str):
              marker = '         MarkDecisionExecuted(decision.DecisionID, ticket);\n'
              npos = new_block.find(marker)
              if npos < 0:
                  return None
              desired = new_block[npos:]
              start_fn = text.find('void ProcessEntry(BBMA_Decision &decision, string pair, RiskValidationSnapshot snapshot)')
              if start_fn < 0:
                  return None
              start = text.find(marker, start_fn)
              if start < 0:
                  return None
              next_mod = text.find('//| MODULE 23:', start)
              if next_mod < 0:
                  return None
              end = text.rfind('\n}\n', start, next_mod)
              if end < 0:
                  return None
              end += 3
              return text[:start] + desired.rstrip('\n') + '\n' + text[end:]

          for p in patches:
              print(f'=== APPLY {p.name} ===')
              try:
                  old_path, new_path, hunks = parse_patch(p)
              except Exception as e:
                  print(f'P1_STEP2_FIRST_CONFLICT={p.name}')
                  print(f'PARSE_ERROR={e}')
                  sys.exit(22)

              source_path = Path(old_path)
              target_path = Path(new_path)
              if not source_path.exists():
                  print(f'P1_STEP2_FIRST_CONFLICT={p.name}')
                  print(f'MISSING_SOURCE={old_path}')
                  sys.exit(22)

              text = source_path.read_text(encoding='utf-8')
              for hidx, h in enumerate(hunks, 1):
                  old_block, new_block = hunk_blocks(h)
                  count = text.count(old_block)
                  if count != 1:
                      repaired = None
                      label = None
                      if p.name.startswith('0014-') and hidx == 8 and count == 0:
                          repaired = repair_0014_hunk8(text, new_block)
                          label = '0014_HUNK8_M16_CONTEXT_REBASE'
                      elif p.name.startswith('0016-') and hidx == 2 and count == 0:
                          repaired = repair_0016_hunk2(text, new_block)
                          label = '0016_HUNK2_M17_RESOLVER_INSERT'
                      elif p.name.startswith('0018-') and hidx == 5 and count == 0:
                          repaired = repair_0018_hunk5(text, new_block)
                          label = '0018_HUNK5_M19_REJECTION_PROPAGATION'
                      elif p.name.startswith('0021-') and hidx == 8 and count == 0:
                          repaired = repair_0021_hunk8(text, new_block)
                          label = '0021_HUNK8_M22_RESULT_MAPPING_REBASE'
                      if repaired is not None:
                          text = repaired
                          print(f'P1_STEP3_INTEGRATION_REPAIR={label}')
                          continue
                      print(f'P1_STEP2_FIRST_CONFLICT={p.name}')
                      print(f'HUNK={hidx}')
                      print(f'MATCH_COUNT={count}')
                      preview = old_block[:800].replace('\n', '\\n')
                      print(f'OLD_BLOCK_PREVIEW={preview}')
                      sys.exit(22)
                  text = text.replace(old_block, new_block, 1)

              target_path.write_text(text, encoding='utf-8')
              print(f'P1_STEP2_APPLIED={p.name}')

          working = Path('MASTER_BLUEPRINT_2.0_WORKING.txt')
          if not working.exists() or working.stat().st_size == 0:
              print('ERROR: working source missing/empty')
              sys.exit(23)
          digest = hashlib.sha256(working.read_bytes()).hexdigest()
          print('P1_STEP2_PATCHES_APPLIED=25')
          print(f'P1_STEP2_WORKING_SHA={digest}')
          print('P1_STEP2_PATCH_CHAIN=PASS')
          PY

      - name: Basic materialization sanity
        shell: bash
        run: |
          set -euo pipefail
          test -s MASTER_BLUEPRINT_2.0_WORKING.txt
          grep -q 'MODULE 27' MASTER_BLUEPRINT_2.0_WORKING.txt
          grep -q 'MODULE 01' MASTER_BLUEPRINT_2.0_WORKING.txt
          echo "P1_STEP2_MATERIALIZATION_SANITY=PASS"
