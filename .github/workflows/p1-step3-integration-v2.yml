name: P1 Step3 Integration V2

on:
  push:
    branches: [ blueprint-dev ]
    paths:
      - '.github/workflows/p1-step3-integration-v2.yml'
  workflow_dispatch:

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and apply ordered patch chain
        shell: bash
        run: |
          set -euo pipefail
          cat blueprint/archive/MASTER_BLUEPRINT_2.0_BASELINE.txt.gz.b64.part01a \
              blueprint/archive/MASTER_BLUEPRINT_2.0_BASELINE.txt.gz.b64.part01b \
              blueprint/archive/MASTER_BLUEPRINT_2.0_BASELINE.txt.gz.b64.part02 \
              blueprint/archive/MASTER_BLUEPRINT_2.0_BASELINE.txt.gz.b64.part03 \
              blueprint/archive/MASTER_BLUEPRINT_2.0_BASELINE.txt.gz.b64.part04 \
              blueprint/archive/MASTER_BLUEPRINT_2.0_BASELINE.txt.gz.b64.part05 > /tmp/b64
          base64 -d /tmp/b64 | gzip -dc > MASTER_BLUEPRINT_2.0_BASELINE.txt
          test "$(sha256sum MASTER_BLUEPRINT_2.0_BASELINE.txt | awk '{print $1}')" = "e217816e95126857c1e7fa3fde1ac10ecc28f196a82eb51cb2f3625a6901aa00"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re,sys
          ps=sorted(Path('blueprint/patches').glob('*.patch')); assert len(ps)==25
          def parse(p):
              ls=p.read_text().splitlines(keepends=True);old=new=None;hs=[];i=0
              while i<len(ls):
                  if ls[i].startswith('--- '): old=ls[i][4:].strip().removeprefix('a/');i+=1;new=ls[i][4:].strip().removeprefix('b/');i+=1;continue
                  if ls[i].startswith('@@'):
                      i+=1;h=[]
                      while i<len(ls) and not ls[i].startswith('@@') and not ls[i].startswith('--- '):h.append(ls[i]);i+=1
                      hs.append(h);continue
                  i+=1
              return old,new,hs
          def blocks(h):
              o=[];n=[]
              for x in h:
                  if x.startswith('\\ No newline'):continue
                  if x.startswith('+'):n.append(x[1:])
                  elif x.startswith('-'):o.append(x[1:])
                  elif x.startswith(' '):o.append(x[1:]);n.append(x[1:])
                  else:o.append(x);n.append(x)
              return ''.join(o),''.join(n)
          def replace_function(text,name,replacement):
              s=text.find(name);b=text.find('{',s) if s>=0 else -1
              if b<0:return None
              d=0;e=None
              for i in range(b,len(text)):
                  if text[i]=='{':d+=1
                  elif text[i]=='}':
                      d-=1
                      if d==0:e=i+1;break
              return None if e is None else text[:s]+replacement+text[e:]
          def repair(p,j,text,n):
              if p.startswith('0014-') and j==8:
                  a=re.search(r'bool IsExtremeStateExpired\(Signal extreme, datetime currentTime\).*?decision\.RejectionReason = REJ_NONE;\n\}',n,re.S);b=re.search(r'void InvalidationEngine_Atomic\(BBMA_Decision &decision, OppositeConflictPackage &conflict\)\n\{.*?bool IsExpired_ReEntry\(ReEntryData reEntry, datetime currentTime\)\n\{.*?\n\}',text,re.S)
                  if a and b:return text[:b.start()]+a.group()+text[b.end():],'0014_M16_REBASE'
              if p.startswith('0016-') and j==2:
                  f=re.search(r'bool ResolveSelectedSLTPSourceComponent\(ValidatedSequenceCandidate selected,.*?\n\}',n,re.S);a=text.find('int CompareCanonicalCandidates(ValidatedSequenceCandidate &a,\n')
                  if f and a>=0:return text[:a]+f.group()+'\n\n'+text[a:],'0016_M17_RESOLVER'
              if p.startswith('0018-') and j==5:
                  s=text.find('void ProcessPair(int pairIndex)');old='decision.RejectionReason = REJ_TOTAL_RISK;';i=text.find(old,s)
                  if s>=0 and i>=0:
                      r='decision.RejectionReason = (riskStatus.rejection_reason != REJ_NONE) ?\n                                          riskStatus.rejection_reason : REJ_TOTAL_RISK;'
                      return text[:i]+r+text[i+len(old):],'0018_M19_REASON'
              if p.startswith('0021-') and j==8:
                  marker='         MarkDecisionExecuted(decision.DecisionID, ticket);\n';q=n.find(marker);s=text.find('void ProcessEntry(BBMA_Decision &decision, string pair, RiskValidationSnapshot snapshot)')
                  if q>=0 and s>=0:
                      m=text.find(marker,s);b=text.find('{',s);d=0;e=None
                      for i in range(b,len(text)):
                          if text[i]=='{':d+=1
                          elif text[i]=='}':
                              d-=1
                              if d==0:e=i+1;break
                      if m>=0 and e:return text[:m]+n[q:].rstrip('\n')+'\n'+text[e:],'0021_M22_RESULT'
              if p.startswith('0022-') and j==1:
                  f=re.search(r'void ManagePositions\(\)\n\{.*?\n\}',n,re.S)
                  if f:
                      out=replace_function(text,'void ManagePositions()',f.group())
                      if out:return out,'0022_M23_FUNCTION_REBASE'
              if p.startswith('0024-') and j==5:
                  s=text.find('   ArrayResize(g_global_signal_history, 0);\n',text.find('int InitializeEA()'))
                  e=text.find('   g_is_initialized = true;\n',s)
                  if s>=0 and e>=0:
                      e+=len('   g_is_initialized = true;\n')
                      return text[:s]+n.rstrip('\n')+'\n'+text[e:],'0024_M26_INIT_REBASE'
              return None,None
          for k,p in enumerate(ps,1):
              if p.name.split('-',1)[0]!=f'{k:04d}':sys.exit(21)
              old,new,hs=parse(p);src=Path(old);tgt=Path(new)
              if not src.exists():print('MISSING',p.name,old);sys.exit(22)
              text=src.read_text()
              for j,h in enumerate(hs,1):
                  o,n=blocks(h);c=text.count(o)
                  if c==1:text=text.replace(o,n,1);continue
                  out,label=repair(p.name,j,text,n)
                  if out is None:print(f'P1_STEP3_NEXT_CONFLICT={p.name} HUNK={j} MATCH_COUNT={c}');print('PREVIEW='+o[:500].replace('\n','\\n'));sys.exit(22)
                  text=out;print('P1_STEP3_INTEGRATION_REPAIR='+label)
              tgt.write_text(text);print('APPLIED='+p.name)
          w=Path('MASTER_BLUEPRINT_2.0_WORKING.txt');print('P1_STEP3_PATCHES_APPLIED=25');print('P1_STEP3_WORKING_SHA='+hashlib.sha256(w.read_bytes()).hexdigest());print('P1_STEP3_PATCH_CHAIN=PASS')
          PY
          test -s MASTER_BLUEPRINT_2.0_WORKING.txt
          grep -q 'MODULE 27' MASTER_BLUEPRINT_2.0_WORKING.txt
          echo P1_STEP3_SANITY=PASS
