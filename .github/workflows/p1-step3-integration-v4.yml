name: P1 Step3 Integration V4

on:
  push:
    branches: [ blueprint-dev ]
    paths:
      - '.github/workflows/p1-step3-integration-v4.yml'
  workflow_dispatch:

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct verified baseline
        shell: bash
        run: |
          set -euo pipefail
          cat blueprint/archive/MASTER_BLUEPRINT_2.0_BASELINE.txt.gz.b64.part01a blueprint/archive/MASTER_BLUEPRINT_2.0_BASELINE.txt.gz.b64.part01b blueprint/archive/MASTER_BLUEPRINT_2.0_BASELINE.txt.gz.b64.part02 blueprint/archive/MASTER_BLUEPRINT_2.0_BASELINE.txt.gz.b64.part03 blueprint/archive/MASTER_BLUEPRINT_2.0_BASELINE.txt.gz.b64.part04 blueprint/archive/MASTER_BLUEPRINT_2.0_BASELINE.txt.gz.b64.part05 > /tmp/b64
          base64 -d /tmp/b64 | gzip -dc > MASTER_BLUEPRINT_2.0_BASELINE.txt
          test "$(sha256sum MASTER_BLUEPRINT_2.0_BASELINE.txt | awk '{print $1}')" = "e217816e95126857c1e7fa3fde1ac10ecc28f196a82eb51cb2f3625a6901aa00"
      - name: Run V3 applicator with context-only hunk rule
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,textwrap
          y=Path('.github/workflows/p1-step3-integration-v3.yml').read_text()
          m=re.search(r"python3 - <<'PY'\n(.*?)\n          PY",y,re.S)
          if not m: raise SystemExit('cannot extract V3 applicator')
          code=textwrap.dedent(m.group(1))
          old="""        o,n=blocks(h);c=text.count(o)\n        if c==1:text=text.replace(o,n,1);continue\n"""
          new="""        o,n=blocks(h)\n        if o==n:\n            print('P1_STEP3_CONTEXT_ONLY_HUNK='+p.name+':'+str(j));continue\n        c=text.count(o)\n        if c==1:text=text.replace(o,n,1);continue\n"""
          if old not in code: raise SystemExit('V3 loop anchor not found')
          code=code.replace(old,new,1)
          exec(compile(code,'p1_v4_applicator','exec'),{})
          PY
          test -s MASTER_BLUEPRINT_2.0_WORKING.txt
          grep -q 'MODULE 27' MASTER_BLUEPRINT_2.0_WORKING.txt
          echo P1_STEP3_SANITY=PASS
