name: P1 Step5 MT4 Native Compile

on:
  push:
    branches: [ blueprint-dev ]
    paths:
      - '.github/workflows/p1-step5-mt4-native-compile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  p3_verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate PairID registry for requested 20 pairs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -c "from pathlib import Path; import re; s=Path('blueprint/source/BBMA_PROFESSIONAL_EA.mq4').read_text(encoding='utf-8'); req=['EURUSD','GBPUSD','USDJPY','USDCHF','USDCAD','AUDUSD','NZDUSD','EURJPY','GBPJPY','AUDJPY','CADJPY','CHFJPY','NZDJPY','EURGBP','EURAUD','EURCAD','EURCHF','GBPAUD','GBPCAD','AUDCAD']; d={a:int(b) for a,b in re.findall(r'if\\(clean\\s*==\\s*\"([A-Z0-9]+)\"\\)\\s*return\\s+(\\d+)\\s*;', s)}; ids=[d[x] for x in req]; assert len(ids)==20 and len(set(ids))==20; assert all(1<=x<=99 for x in ids); assert re.search(r'^#define\\s+MAX_PAIRS\\s+20\\s*$',s,re.M); assert re.search(r'^#define\\s+PAIR_ID_MAX\\s+99\\s*$',s,re.M); print('P3_PAIRID_STATIC=PASS', list(zip(req,ids)))"

      - name: Acquire official MT4 MetaEditor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $meta = Get-ChildItem 'C:\Program Files*' -Filter metaeditor.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $meta) {
            $url = 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt4/mt4setup.exe'
            Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\mt4setup.exe" -UseBasicParsing
            Start-Process -FilePath "$env:RUNNER_TEMP\mt4setup.exe" -ArgumentList '/auto' -Wait
            Start-Sleep -Seconds 5
            $meta = Get-ChildItem 'C:\Program Files*' -Filter metaeditor.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $meta) { throw 'MT4 MetaEditor not found after official installer attempt' }
          "METAEDITOR=$($meta.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Using $($meta.FullName)"

      - name: Native MetaEditor compile current canonical source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = (Resolve-Path '.\blueprint\source\BBMA_PROFESSIONAL_EA.mq4').Path
          $log = Join-Path $env:RUNNER_TEMP 'p3-pairid-metaeditor-compile.log'
          & "$env:METAEDITOR" "/compile:$src" "/log:$log"
          Start-Sleep -Seconds 2
          if (-not (Test-Path $log)) { throw 'MetaEditor compile log missing' }
          $txt = Get-Content $log -Raw
          $txt | Write-Host
          $ex4 = [System.IO.Path]::ChangeExtension($src,'.ex4')
          if (-not (Test-Path $ex4)) { throw 'MetaEditor did not produce EX4' }
          if ($txt -notmatch '(?i)0\s+errors?\s*,?\s*0\s+warnings?') { throw 'Compile is not 0 errors / 0 warnings' }
          Write-Host 'P3_PAIRID_NATIVE_MT4_COMPILE=PASS_0E0W'

      - name: Record P3 native compile evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = '.\blueprint\source\BBMA_PROFESSIONAL_EA.mq4'
          $sha = (Get-FileHash $src -Algorithm SHA256).Hash.ToLower()
          $head = (git rev-parse HEAD).Trim()
          @(
            '# P3 PairID Native Compile Record',
            '',
            'Status: **PASS — NATIVE METAEDITOR 0 ERRORS, 0 WARNINGS**',
            '',
            'Verification scope:',
            '- current canonical source compiled directly from blueprint/source/BBMA_PROFESSIONAL_EA.mq4;',
            '- MAX_PAIRS = 20;',
            '- PairID namespace = 1..99;',
            '- requested 20-pair portfolio = 20 unique PairIDs;',
            '- no BBMA strategy semantics changed.',
            '',
            "Source SHA-256: $sha",
            "Verified source commit: $head",
            'GitHub Actions run: ${{ github.run_id }}',
            '',
            'Requested portfolio:',
            'EURUSD,GBPUSD,USDJPY,USDCHF,USDCAD,AUDUSD,NZDUSD,EURJPY,GBPJPY,AUDJPY,CADJPY,CHFJPY,NZDJPY,EURGBP,EURAUD,EURCAD,EURCHF,GBPAUD,GBPCAD,AUDCAD'
          ) | Set-Content -Path '.\blueprint\P3_PAIRID_NATIVE_COMPILE_RECORD.md' -Encoding utf8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blueprint/P3_PAIRID_NATIVE_COMPILE_RECORD.md
          git commit -m "P3 verify: PairID hotfix native MetaEditor 0E0W"
          git push origin blueprint-dev

      - uses: actions/upload-artifact@v4
        with:
          name: p3-pairid-native-compile-output
          path: |
            blueprint/source/BBMA_PROFESSIONAL_EA.ex4
            ${{ runner.temp }}/p3-pairid-metaeditor-compile.log
          if-no-files-found: error
