name: P1 Step5 MT4 Native Compile

on:
  push:
    branches: [ blueprint-dev ]
    paths:
      - '.github/workflows/p1-step5-mt4-native-compile.yml'
  workflow_dispatch:

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct verified baseline
        shell: bash
        run: |
          set -euo pipefail
          cat blueprint/archive/MASTER_BLUEPRINT_2.0_BASELINE.txt.gz.b64.part01a blueprint/archive/MASTER_BLUEPRINT_2.0_BASELINE.txt.gz.b64.part01b blueprint/archive/MASTER_BLUEPRINT_2.0_BASELINE.txt.gz.b64.part02 blueprint/archive/MASTER_BLUEPRINT_2.0_BASELINE.txt.gz.b64.part03 blueprint/archive/MASTER_BLUEPRINT_2.0_BASELINE.txt.gz.b64.part04 blueprint/archive/MASTER_BLUEPRINT_2.0_BASELINE.txt.gz.b64.part05 > /tmp/b64
          base64 -d /tmp/b64 | gzip -dc > MASTER_BLUEPRINT_2.0_BASELINE.txt
          test "$(sha256sum MASTER_BLUEPRINT_2.0_BASELINE.txt | awk '{print $1}')" = "e217816e95126857c1e7fa3fde1ac10ecc28f196a82eb51cb2f3625a6901aa00"
      - name: Materialize exact P1 Step3 chain
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,textwrap
          y=Path('.github/workflows/p1-step3-integration-v4.yml').read_text()
          m=re.search(r"python3 - <<'PY'\n(.*?)\n          PY",y,re.S)
          if not m: raise SystemExit('cannot extract P1 Step3 V4 applicator')
          code=textwrap.dedent(m.group(1))
          exec(compile(code,'p1_step5_materialize','exec'),{})
          PY
          test "$(sha256sum MASTER_BLUEPRINT_2.0_WORKING.txt | awk '{print $1}')" = "e81b91a96d95b4446531b445a54c7d60ee5eb71d91646e98eac15ad8e1001da6"
          cp MASTER_BLUEPRINT_2.0_WORKING.txt BBMA_PROFESSIONAL_EA.mq4
      - uses: actions/upload-artifact@v4
        with:
          name: p1-step5-mq4-source
          path: BBMA_PROFESSIONAL_EA.mq4
          if-no-files-found: error

  compile-mt4:
    needs: materialize
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: p1-step5-mq4-source
      - name: Acquire official MT4 MetaEditor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $meta = Get-ChildItem 'C:\Program Files*' -Filter metaeditor.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $meta) {
            $url = 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt4/mt4setup.exe'
            Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\mt4setup.exe" -UseBasicParsing
            Start-Process -FilePath "$env:RUNNER_TEMP\mt4setup.exe" -ArgumentList '/auto' -Wait
            Start-Sleep -Seconds 5
            $meta = Get-ChildItem 'C:\Program Files*' -Filter metaeditor.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $meta) { throw 'MT4 MetaEditor not found after official installer attempt' }
          "METAEDITOR=$($meta.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Using $($meta.FullName)"
      - name: Native MetaEditor compile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = (Resolve-Path '.\BBMA_PROFESSIONAL_EA.mq4').Path
          $log = Join-Path $env:RUNNER_TEMP 'metaeditor-compile.log'
          & "$env:METAEDITOR" "/compile:$src" "/log:$log"
          Start-Sleep -Seconds 2
          if (Test-Path $log) { Get-Content $log -Raw | Write-Host }
          $ex4 = [System.IO.Path]::ChangeExtension($src,'.ex4')
          if (-not (Test-Path $ex4)) { throw 'MetaEditor did not produce EX4' }
          $txt = if (Test-Path $log) { Get-Content $log -Raw } else { '' }
          if ($txt -match '(?i)\berror\b' -and $txt -notmatch '(?i)0 error') { throw 'MetaEditor compile log contains errors' }
          Write-Host 'P1_STEP5_NATIVE_MT4_COMPILE=PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: p1-step5-mt4-compile-output
          path: |
            BBMA_PROFESSIONAL_EA.ex4
            ${{ runner.temp }}/metaeditor-compile.log
          if-no-files-found: warn
