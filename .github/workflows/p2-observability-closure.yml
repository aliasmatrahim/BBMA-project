name: P2 observability closure reconciliation
on:
  push:
    branches: [d1-owner-dev]
    paths: ['blueprint/.p2-observability-closure-trigger']
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d1-owner-dev
          fetch-depth: 0
      - name: Reconcile current status and queue
        shell: bash
        run: |
          set -euo pipefail
          expected_blob='532f15b224f7e2594ed83f85e077e76aa13f7ed3'
          expected_repo_sha='6a34cc999e18e96bcda8cec9ba90bcc6455a201da6ff1f2d957f5476fee83c1c'
          compiled_commit='79476afd0a4821f9b51ec62dd2d1b1cc555ab9c0'
          current_blob="$(git rev-parse HEAD:blueprint/source/BBMA_EA.mq4)"
          compiled_blob="$(git rev-parse ${compiled_commit}:blueprint/source/BBMA_EA.mq4)"
          test "$current_blob" = "$expected_blob"
          test "$compiled_blob" = "$expected_blob"
          repo_sha="$(sha256sum blueprint/source/BBMA_EA.mq4 | awk '{print $1}')"
          test "$repo_sha" = "$expected_repo_sha"

          python3 - <<'PY'
          from pathlib import Path
          import re

          repo_sha = '6a34cc999e18e96bcda8cec9ba90bcc6455a201da6ff1f2d957f5476fee83c1c'
          git_blob = '532f15b224f7e2594ed83f85e077e76aa13f7ed3'
          windows_sha = '2fd43ecda4edee45e641463215be70d1c043b36941906a7507946b606cc3826b'

          current = Path('blueprint/CURRENT.md')
          c = current.read_text(encoding='utf-8')
          pattern = r'(## Canonical compile-clean source\nPath:\n`blueprint/source/BBMA_EA\.mq4`\n\nSHA-256:\n)`[^`]+`'
          c2, n = re.subn(pattern, r'\1`' + repo_sha + '`', c, count=1)
          if n != 1:
              raise RuntimeError('primary canonical source SHA block not found')
          c = c2

          marker = '## 2026-08-25 P2 Observability/UI Closure — LOTDIAG + DASHCOUNT'
          if marker not in c:
              c = c.rstrip() + f'''\n\n---\n\n## 2026-08-25 P2 Observability/UI Closure — LOTDIAG + DASHCOUNT\n\nStatus: **CLOSED / PASS / NATIVE METAEDITOR 0E0W**\n\n- Canonical Git blob: `{git_blob}`.\n- Repository/LF SHA-256: `{repo_sha}`.\n- Native Windows checkout SHA-256: `{windows_sha}`; line-ending transformation only, same Git blob.\n- `REJ_INVALID_LOT` diagnostics: **PASS**. M21 sizing logic is unchanged; diagnostics explain an already-failed result from the same frozen snapshot.\n- Dashboard active-trade count: **PASS**. `Trades:` now counts current broker-pool orders accepted by exact symbol+magic ownership, not raw `g_monitored_count`.\n- Final combined official MT4 MetaEditor compile: **0 errors / 0 warnings**.\n- Compile evidence: run `32823122900`, job `97725322914`, artifact `9554031975`.\n- Audit records: `blueprint/P2_REJ_INVALID_LOT_DIAGNOSTICS_AUDIT_20260825.md` and `blueprint/P2_DASHBOARD_LIVE_TRADE_COUNT_AUDIT_20260825.md`.\n- No BBMA strategy, D1/NMJE authority, SL/TP, risk percentage, money-management admission or broker execution semantics were changed by these two items.\n- Next evidence layer: broker/demo runtime D1 owner matrix + D1O canonical dedup + validation-candle/order-open timing when market-connected evidence is available.\n'''
          current.write_text(c, encoding='utf-8', newline='\n')

          queue = Path('blueprint/MASTER_QUEUE.md')
          q = queue.read_text(encoding='utf-8')
          qmarker = '## 2026-08-25 — P2 Observability/UI Closure'
          if qmarker not in q:
              q = q.rstrip() + f'''\n\n---\n\n## 2026-08-25 — P2 Observability/UI Closure\n\nStatus: **CLOSED / PASS / CURRENT SOURCE 0E0W**\n\nCompleted:\n1. `REJ_INVALID_LOT` diagnostics — **CLOSED/PASS**, observability-only.\n2. Dashboard active-trade count refresh — **CLOSED/PASS**, display-only.\n\nEvidence:\n- canonical Git blob `{git_blob}`;\n- repository/LF SHA-256 `{repo_sha}`;\n- Windows compile checkout SHA-256 `{windows_sha}` (same blob; CRLF/LF only);\n- official MT4 MetaEditor run `32823122900`, job `97725322914`: **0 errors / 0 warnings**;\n- compile artifact `9554031975`;\n- `P2_REJ_INVALID_LOT_DIAGNOSTICS_AUDIT_20260825.md`;\n- `P2_DASHBOARD_LIVE_TRADE_COUNT_AUDIT_20260825.md`.\n\n### Active next safe order\n1. Broker/demo runtime evidence: D1 owner BUY/SELL/TRANSITION/UNRESOLVED matrix.\n2. D1 Opportunity canonical dedup telemetry: same fresh LTF identity retains execution hash across D1 attribution changes; execution hash never changes direction.\n3. Validation-candle-before-order-open timing evidence.\n4. Continue NMJE/runtime research evidence only within its read-only contract.\n5. Material Workbook HOLD rules remain blocked until an explicit strategy-decision gate.\n'''
          queue.write_text(q, encoding='utf-8', newline='\n')

          print('P2_OBSERVABILITY_CLOSURE_RECONCILE=PASS')
          PY
          git diff --check
          if git diff --name-only | grep -E '\.(mq4|mqh)$'; then
            echo 'Unexpected MQL source change'
            exit 1
          fi
      - name: Commit closure records
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blueprint/CURRENT.md blueprint/MASTER_QUEUE.md
          git commit -m 'docs: close P2 observability and dashboard fixes'
          git push origin HEAD:d1-owner-dev
