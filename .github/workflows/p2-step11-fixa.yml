name: P2 Step11 Fix A Apply

on:
  push:
    branches: [ blueprint-dev ]
    paths:
      - '.github/workflows/p2-step11-fixa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: blueprint-dev

      - name: Route timer through shared orchestration authority
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('blueprint/source/BBMA_PROFESSIONAL_EA.mq4')
          s = p.read_text(encoding='utf-8')
          start = s.find('void OnTimer()\n{')
          if start < 0:
              raise SystemExit('OnTimer start not found')
          end_marker = '\n//+------------------------------------------------------------------+\n//| END OF EXPERT ADVISOR'
          end = s.find(end_marker, start)
          if end < 0:
              raise SystemExit('OnTimer end marker not found')
          new = (
              'void OnTimer()\n'
              '{\n'
              '   if(!g_is_initialized) return;\n'
              '\n'
              '   // Timer owns only maintenance/reset work. Lifecycle, emergency gating,\n'
              '   // dashboard orchestration and strategy scanning have one shared authority:\n'
              '   // OnTickMain(). This prevents timer-only state advancement during emergency.\n'
              '   CleanupSignalHistoryEntries();\n'
              '   CleanupGlobalSignalHistory();\n'
              '\n'
              '   datetime todayStart = GetTodayStart();\n'
              '   if(todayStart > g_last_reset_date)\n'
              '   {\n'
              '      // Keep daily reset consistent with the M19 equity-drawdown contract.\n'
              '      double resetEquity = AccountEquity();\n'
              '      if(resetEquity > 0)\n'
              '         g_protection_reference_equity = resetEquity;\n'
              '      g_last_reset_date = todayStart;\n'
              '      g_last_daily_profit = 0;\n'
              '      Log(DBG_FULL, "Daily reset: protection reference = " + DoubleToString(g_protection_reference_equity, 2));\n'
              '   }\n'
              '\n'
              '   // Mirror OnTick connectivity semantics before entering shared live orchestration.\n'
              '   if(!IsTerminalConnected()) return;\n'
              '   OnTickMain();\n'
              '}\n'
          )
          p.write_text(s[:start] + new + s[end:], encoding='utf-8')
          PY

      - name: Commit canonical fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blueprint/source/BBMA_PROFESSIONAL_EA.mq4
          git commit -m "P2 step11 fix A: unify timer orchestration authority"
          git push
