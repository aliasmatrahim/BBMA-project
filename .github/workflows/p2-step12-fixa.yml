name: P2 Step12 Fix A Apply

on:
  push:
    branches: [ blueprint-dev ]
    paths:
      - '.github/workflows/p2-step12-fixa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: blueprint-dev

      - name: Register timer and kill on deinit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('blueprint/source/BBMA_PROFESSIONAL_EA.mq4')
          s = p.read_text(encoding='utf-8')

          init_start = s.find('int OnInit()\n{')
          init_end_marker = '\n//+------------------------------------------------------------------+\n//| EXPERT DEINITIALIZATION FUNCTION'
          init_end = s.find(init_end_marker, init_start)
          if init_start < 0 or init_end < 0:
              raise SystemExit('OnInit anchors not found')

          new_init = (
              'int OnInit()\n'
              '{\n'
              '   if(!ValidateInputParameters())\n'
              '   {\n'
              '      Log(DBG_ERROR, "Input parameter validation failed");\n'
              '      return INIT_PARAMETERS_INCORRECT;\n'
              '   }\n'
              '   \n'
              '   if(InitializeEA() != INIT_SUCCEEDED)\n'
              '   {\n'
              '      Log(DBG_ERROR, "EA initialization failed");\n'
              '      return INIT_FAILED;\n'
              '   }\n'
              '\n'
              '   // OnTimer is part of live lifecycle/protection fallback and maintenance.\n'
              '   // Initialization is not complete unless the terminal accepts the timer.\n'
              '   ResetLastError();\n'
              '   if(!EventSetTimer(1))\n'
              '   {\n'
              '      int timerError = GetLastError();\n'
              '      g_is_initialized = false;\n'
              '      Log(DBG_ERROR, "Failed to register EA timer, error=" + IntegerToString(timerError));\n'
              '      return INIT_FAILED;\n'
              '   }\n'
              '   \n'
              '   Log(DBG_FULL, "BBMA Professional EA V4.5.1 initialized successfully");\n'
              '   return INIT_SUCCEEDED;\n'
              '}\n'
          )
          s = s[:init_start] + new_init + s[init_end:]

          deinit_start = s.find('void OnDeinit(const int reason)\n{')
          deinit_end_marker = '\n//+------------------------------------------------------------------+\n//| EXPERT TICK FUNCTION'
          deinit_end = s.find(deinit_end_marker, deinit_start)
          if deinit_start < 0 or deinit_end < 0:
              raise SystemExit('OnDeinit anchors not found')

          old_deinit = s[deinit_start:deinit_end]
          if 'EventKillTimer();' not in old_deinit:
              old_deinit = old_deinit.replace(
                  '{\n',
                  '{\n   // Stop timer delivery before clearing orchestration state.\n   EventKillTimer();\n\n',
                  1
              )
          s = s[:deinit_start] + old_deinit + s[deinit_end:]

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit canonical fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blueprint/source/BBMA_PROFESSIONAL_EA.mq4
          git commit -m "P2 step12 fix A: register and kill timer"
          git push
