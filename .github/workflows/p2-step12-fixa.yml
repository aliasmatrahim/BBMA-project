name: P2 Step12 Fix A Apply

"on":
  push:
    branches: [ blueprint-dev ]
    paths:
      - '.github/workflows/p2-step12-fixa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: blueprint-dev

      - name: Register timer and kill on deinit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('blueprint/source/BBMA_PROFESSIONAL_EA.mq4')
          s = p.read_text(encoding='utf-8')

          old_init = '''int OnInit()
{
   if(!ValidateInputParameters())
   {
      Log(DBG_ERROR, "Input parameter validation failed");
      return INIT_PARAMETERS_INCORRECT;
   }
   
   if(InitializeEA() != INIT_SUCCEEDED)
   {
      Log(DBG_ERROR, "EA initialization failed");
      return INIT_FAILED;
   }
   
   Log(DBG_FULL, "BBMA Professional EA V4.5.1 initialized successfully");
   return INIT_SUCCEEDED;
}
'''

          new_init = '''int OnInit()
{
   if(!ValidateInputParameters())
   {
      Log(DBG_ERROR, "Input parameter validation failed");
      return INIT_PARAMETERS_INCORRECT;
   }
   
   if(InitializeEA() != INIT_SUCCEEDED)
   {
      Log(DBG_ERROR, "EA initialization failed");
      return INIT_FAILED;
   }

   // OnTimer is part of live lifecycle/protection fallback and maintenance.
   // Initialization is not complete unless the terminal accepts the timer.
   ResetLastError();
   if(!EventSetTimer(1))
   {
      int timerError = GetLastError();
      g_is_initialized = false;
      Log(DBG_ERROR, "Failed to register EA timer, error=" + IntegerToString(timerError));
      return INIT_FAILED;
   }
   
   Log(DBG_FULL, "BBMA Professional EA V4.5.1 initialized successfully");
   return INIT_SUCCEEDED;
}
'''

          old_deinit = '''void OnDeinit(const int reason)
{
   // Stop all local orchestration first. Do NOT erase execution-hash/tombstone
   // semantics here; restart recovery reconstructs them from broker history.
   g_is_initialized = false;
   g_is_scanning = false;
   g_is_managing_trade = false;
   g_dashboard_needs_update = false;
   if(ShowDashboard)
      Comment("");
   Log(DBG_FULL, "EA deinitialized, reason: " + IntegerToString(reason));
}
'''

          new_deinit = '''void OnDeinit(const int reason)
{
   // Stop timer delivery before clearing orchestration state.
   EventKillTimer();

   // Stop all local orchestration first. Do NOT erase execution-hash/tombstone
   // semantics here; restart recovery reconstructs them from broker history.
   g_is_initialized = false;
   g_is_scanning = false;
   g_is_managing_trade = false;
   g_dashboard_needs_update = false;
   if(ShowDashboard)
      Comment("");
   Log(DBG_FULL, "EA deinitialized, reason: " + IntegerToString(reason));
}
'''

          if s.count(old_init) != 1:
              raise SystemExit(f'OnInit anchor mismatch: {s.count(old_init)}')
          if s.count(old_deinit) != 1:
              raise SystemExit(f'OnDeinit anchor mismatch: {s.count(old_deinit)}')

          s = s.replace(old_init, new_init, 1).replace(old_deinit, new_deinit, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit canonical fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blueprint/source/BBMA_PROFESSIONAL_EA.mq4
          git commit -m "P2 step12 fix A: register and kill timer"
          git push
