name: P2 Step16 FixA

on:
  push:
    branches: [ blueprint-dev ]
    paths:
      - '.github/workflows/p2-step16-fixa.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: blueprint-dev
      - name: Patch canonical MQ4
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('blueprint/source/BBMA_PROFESSIONAL_EA.mq4')
          s = p.read_text(encoding='utf-8')
          old = '''      if(!OrderSelect(g_monitored_trades[i].ticket, SELECT_BY_TICKET))\n         continue;\n      if(OrderCloseTime() != 0)\n         continue;\n\n      if(g_monitored_trades[i].remaining_lot <= 0)\n         continue;'''
          new = '''      // P2 S16 Fix A: hard portfolio-risk accounting is fail-closed.\n      // A monitored ticket whose broker state cannot be selected is unknown risk,\n      // never zero risk. Reject the prospective entry instead of understating\n      // MaxTotalRiskPercent. Only a definitively closed broker order is ignored.\n      ResetLastError();\n      if(!OrderSelect(g_monitored_trades[i].ticket, SELECT_BY_TICKET))\n      {\n         valid = false;\n         return 0;\n      }\n      if(OrderCloseTime() != 0)\n         continue;\n\n      if(g_monitored_trades[i].remaining_lot <= 0)\n         continue;'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one risk-loop anchor, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blueprint/source/BBMA_PROFESSIONAL_EA.mq4
          git diff --cached --quiet && exit 0
          git commit -m 'P2 S16 Fix A: fail closed unknown monitored risk'
          git push origin HEAD:blueprint-dev
