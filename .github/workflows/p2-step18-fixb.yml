name: P2 Step18 FixB

on:
  push:
    branches:
      - blueprint-dev
    paths:
      - .github/workflows/p2-step18-fixb.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: blueprint-dev
          fetch-depth: 0

      - name: Remove duplicate TradeLock validation and gate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('blueprint/source/BBMA_PROFESSIONAL_EA.mq4')
          s = p.read_text(encoding='utf-8')
          v = '   if(TradeLockMode < LOCK_OFF || TradeLockMode > LOCK_ONE_POSITION) return false;\n'
          if s.count(v) != 2:
              raise SystemExit('Expected exactly two TradeLock validation lines before FixB')
          s = s.replace(v + v, v, 1)
          start = s.index('void ProcessEntry(BBMA_Decision &decision')
          end = s.index('int pairIdx = FindPairStateIndex(pair);', start)
          prefix = s[start:end]
          gate_start = prefix.index('   // P2 S18 Fix A: enforce the configured trade-lock policy before any\n')
          gate_end = prefix.index('   int pairIdx = FindPairStateIndex(pair);') if '   int pairIdx = FindPairStateIndex(pair);' in prefix else len(prefix)
          early = prefix[gate_start:gate_end]
          s = s[:start] + prefix[:gate_start] + s[end:]
          start = s.index('void ProcessEntry(BBMA_Decision &decision')
          next_marker = s.index('//+------------------------------------------------------------------+', start + 1)
          proc = s[start:next_marker]
          if s.count(v) != 1:
              raise SystemExit('TradeLock validation cleanup failed')
          if proc.count('if(!IsSignalAllowed(decision, pair, magic))') != 1:
              raise SystemExit('Expected exactly one final trade-lock gate')
          if 'lockPairIdx' in proc:
              raise SystemExit('Residual duplicate early trade-lock gate remains')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit canonical FixB
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blueprint/source/BBMA_PROFESSIONAL_EA.mq4
          git commit -m 'P2 Step18 FixB remove duplicate trade lock gates'
          git push origin blueprint-dev
