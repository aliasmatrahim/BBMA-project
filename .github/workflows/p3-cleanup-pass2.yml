name: P3 Cleanup Pass 2

on:
  pull_request:
    branches: [ blueprint-dev ]
    types: [ opened, reopened, synchronize ]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'p3-cleanup-pass2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Remove proven dead residual symbols
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('blueprint/source/BBMA_EA.mq4')
          s = p.read_text(encoding='utf-8')
          before = s
          removed = []

          name = 'GetEffectiveExpiry'
          if s.count(name + '(') != 1:
              raise SystemExit(f'{name}: expected definition-only count=1, got {s.count(name + "(")}')
          m = re.search(r'(?m)^datetime\s+' + name + r'\s*\(', s)
          if not m:
              raise SystemExit(f'{name}: definition not found')
          brace = s.find('{', m.end())
          depth = 0
          i = brace
          while i < len(s):
              if s[i] == '{': depth += 1
              elif s[i] == '}':
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      while end < len(s) and s[end] in ' \t\r\n': end += 1
                      s = s[:m.start()] + s[end:]
                      removed.append(name + '()')
                      break
              i += 1
          else:
              raise SystemExit(f'{name}: unbalanced function body')

          enum_name = 'ENUM_SIGNAL_MODE'
          em = re.search(r'(?ms)^enum\s+' + enum_name + r'\s*\{.*?\};\s*\n', s)
          if not em:
              raise SystemExit(f'{enum_name}: enum not found')
          if s.count(enum_name) != 1:
              raise SystemExit(f'{enum_name}: expected definition-only count=1, got {s.count(enum_name)}')
          s = s[:em.start()] + s[em.end():]
          removed.append(enum_name)

          for field in ['buy_signal_memory', 'sell_signal_memory']:
              if s.count(field) != 1:
                  raise SystemExit(f'{field}: expected declaration-only count=1, got {s.count(field)}')
              s2, n = re.subn(r'(?m)^\s*SignalMemory\s+' + field + r'\s*;.*\n', '', s, count=1)
              if n != 1:
                  raise SystemExit(f'{field}: declaration not found')
              s = s2
              removed.append(field)

          if s.count('SignalMemory') != 1:
              raise SystemExit(f'SignalMemory: expected type-only count=1 after field removal, got {s.count("SignalMemory")}')
          sm = re.search(r'(?ms)^struct\s+SignalMemory\s*\{.*?^\};\s*\n', s)
          if not sm:
              raise SystemExit('SignalMemory: struct block not found')
          s = s[:sm.start()] + s[sm.end():]
          removed.append('struct SignalMemory')

          enum_name = 'ENUM_CYCLE_STATE'
          em = re.search(r'(?ms)^enum\s+' + enum_name + r'\s*\{.*?\};\s*\n', s)
          if em and s.count(enum_name) == 1:
              s = s[:em.start()] + s[em.end():]
              removed.append(enum_name)

          for const in ['SIGNAL_REVERSAL','SIGNAL_CONTINUATION','SIGNAL_MAJOR_REVERSAL']:
              if s.count(const) == 1:
                  s2, n = re.subn(r'(?m)^\s*' + const + r'\s*,?\s*\n', '', s, count=1)
                  if n == 1:
                      s = s2
                      removed.append(const)

          anchors = [
              'bool DetectExtreme(',
              'ENUM_MLV_STATE UpdateCanonicalMLVState(',
              'ENUM_RE_STATE UpdateReEntryState(',
              'void PriorityEngine_Atomic(',
              'void InvalidationEngine_Atomic(',
              'bool ResolveApprovedInitialSLTP(',
              'RiskStatus CheckRiskBeforeTrade(',
              'double CalculateLotSize(',
              'void ProcessEntry(',
              'void ProcessPair(',
              'int OnInit()',
              'void OnTick()'
          ]
          for a in anchors:
              if before.count(a) != 1 or s.count(a) != 1:
                  raise SystemExit('Critical anchor changed/missing: ' + a)

          if s.count('{') != s.count('}'):
              raise SystemExit('Brace imbalance after cleanup')
          if s == before:
              raise SystemExit('No cleanup changes produced')

          p.write_text(s, encoding='utf-8')
          rec = Path('blueprint/P3_CLEANUP_PASS2_RESULT.md')
          rec.write_text(
              '# P3 Cleanup Pass 2 Result\n\n'
              'Status: STATIC CLEANUP APPLIED; NATIVE METAEDITOR RECOMPILE REQUIRED\n\n'
              'Removed only proven dead residual symbols after Pass 1 0E0W:\n' +
              ''.join(f'- `{x}`\n' for x in removed) +
              '\nNo BBMA strategy, risk, execution, recovery, SL/TP, or portfolio condition was rewritten.\n',
              encoding='utf-8'
          )
          print('Removed:', ', '.join(removed))
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- blueprint/source/BBMA_EA.mq4 blueprint/P3_CLEANUP_PASS2_RESULT.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "P3 cleanup pass 2: prune proven dead residuals"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  m2_07_guard:
    if: github.event.pull_request.head.ref == 'p3-m2-07-cycle-direction-guard'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply M2-07 source-derived guard
        run: python3 blueprint/tools/apply_p3_m2_07_guard.py
      - name: Verify patch shape
        run: |
          git diff --check
          grep -q 'P3-M2-07 OPPOSITE GUARD' blueprint/source/BBMA_EA.mq4
          grep -q '#property description "P3-M2-07 Cycle Direction Guard"' blueprint/source/BBMA_EA.mq4
          grep -q 'SOURCE-DERIVED CYCLE DIRECTION GUARD' blueprint/source/BBMA_EA.mq4
      - name: Commit M2-07 patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "P3-M2-07: enforce source-derived cycle direction guard"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
