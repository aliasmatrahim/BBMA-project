name: P3 M1 Runtime Trace Patch

on:
  pull_request:
    branches: [ blueprint-dev ]
    types: [ opened, reopened, synchronize ]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'p3-m1-runtime-trace'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Add trace-only Mode 1 diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('blueprint/source/BBMA_EA.mq4')
          s = p.read_text(encoding='utf-8')
          before = s

          def rep(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              s = s.replace(old, new, 1)

          # M15 source candidate diagnostic: log the frozen RE/H4 facts before
          # any admission return, then log only after the candidate is valid.
          rep(
          '''void BuildConfirmedReEntryCandidate(ReEntryData &reEntry,
                                    H4DirectionalOwner &h4Owner,
                                    ValidatedSequenceCandidate &candidate)
{
   ZeroMemory(candidate);
''',
          '''void BuildConfirmedReEntryCandidate(ReEntryData &reEntry,
                                    H4DirectionalOwner &h4Owner,
                                    ValidatedSequenceCandidate &candidate)
{
   ZeroMemory(candidate);

   if(EntryMode == 1 && reEntry.State == RE_STATE_CONFIRMED)
   {
      Print("[P3M1][RE_EVAL] PairTF=H1 Type=", EnumToString(reEntry.Type),
            " Dir=", EnumToString(reEntry.Direction),
            " Valid=", reEntry.IsValid ? "Y" : "N",
            " Confirm=", TimeToString(reEntry.ConfirmationCandle),
            " Expiry=", TimeToString(reEntry.ExpiryCandleTime),
            " H4State=", EnumToString(h4Owner.State),
            " H4Dir=", EnumToString(h4Owner.Direction),
            " H4Valid=", h4Owner.IsValid ? "Y" : "N",
            " H4Recovery=", h4Owner.RecoveryComplete ? "Y" : "N");
   }
''', 'RE_EVAL')

          rep(
          '''   candidate.PatternStrength = 0;
   candidate.Valid = true;
}
''',
          '''   candidate.PatternStrength = 0;
   candidate.Valid = true;

   if(EntryMode == 1)
   {
      Print("[P3M1][RE_ADMIT] Type=", EnumToString(reEntry.Type),
            " Dir=", EnumToString(reEntry.Direction),
            " Confirm=", TimeToString(reEntry.ConfirmationCandle),
            " Hash=", candidate.SequenceHash);
   }
}
''', 'RE_ADMIT')

          # M15 counts/conflict/selection.
          rep(
          '''   if(buyCount > 0 && sellCount > 0)
   {
''',
          '''   if(EntryMode == 1 && (buyCount > 0 || sellCount > 0))
      Print("[P3M1][M15_COUNTS] Buy=", buyCount, " Sell=", sellCount,
            " Pool=", count, " Time=", TimeToString(g_processing_time));

   if(buyCount > 0 && sellCount > 0)
   {
''', 'M15_COUNTS')

          rep(
          '''      conflict.FrozenSnapshotTime = g_processing_time;
      return;
   }
''',
          '''      conflict.FrozenSnapshotTime = g_processing_time;
      if(EntryMode == 1)
         Print("[P3M1][M15_CONFLICT] Opposite eligible RE candidates; no winner selected");
      return;
   }
''', 'M15_CONFLICT')

          rep(
          '''   decision.DecisionID = GenerateDecisionID(decision.Pair, decision.CandleTime,
                                             decision.Direction,
                                             decision.SignalType,
                                             decision.SequenceHash);
}
''',
          '''   decision.DecisionID = GenerateDecisionID(decision.Pair, decision.CandleTime,
                                             decision.Direction,
                                             decision.SignalType,
                                             decision.SequenceHash);

   if(EntryMode == 1)
      Print("[P3M1][M15_SELECT] Pair=", decision.Pair,
            " Signal=", EnumToString(decision.SignalType),
            " Dir=", EnumToString(decision.Direction),
            " Candle=", TimeToString(decision.CandleTime),
            " DecisionID=", decision.DecisionID);
}
''', 'M15_SELECT')

          # M16 rejection/pass diagnostics.
          rep(
          '''      decision.DecisionState = DEC_INVALIDATED;
      decision.RejectionReason = REJ_OPPOSITE_SIGNAL;
      return;
''',
          '''      decision.DecisionState = DEC_INVALIDATED;
      decision.RejectionReason = REJ_OPPOSITE_SIGNAL;
      if(EntryMode == 1)
         Print("[P3M1][M16_REJECT] DecisionID=", decision.DecisionID,
               " Reason=", EnumToString(decision.RejectionReason));
      return;
''', 'M16_OPPOSITE')

          rep(
          '''         decision.DecisionState = DEC_EXPIRED;
         decision.RejectionReason = REJ_EXPIRED;
''',
          '''         decision.DecisionState = DEC_EXPIRED;
         decision.RejectionReason = REJ_EXPIRED;
         if(EntryMode == 1)
            Print("[P3M1][M16_REJECT] DecisionID=", decision.DecisionID,
                  " Reason=", EnumToString(decision.RejectionReason));
''', 'M16_OWNER_EXPIRED')

          rep(
          '''         decision.DecisionState = DEC_INVALIDATED;
         decision.RejectionReason = REJ_SEQUENCE_BREAK;
''',
          '''         decision.DecisionState = DEC_INVALIDATED;
         decision.RejectionReason = REJ_SEQUENCE_BREAK;
         if(EntryMode == 1)
            Print("[P3M1][M16_REJECT] DecisionID=", decision.DecisionID,
                  " Reason=", EnumToString(decision.RejectionReason));
''', 'M16_OWNER_INVALID')

          rep(
          '''      decision.DecisionState = DEC_EXPIRED;
      decision.RejectionReason = REJ_EXPIRED;
      return;
   }

   decision.DecisionState = DEC_VALIDATED;
   decision.RejectionReason = REJ_NONE;
}
''',
          '''      decision.DecisionState = DEC_EXPIRED;
      decision.RejectionReason = REJ_EXPIRED;
      if(EntryMode == 1)
         Print("[P3M1][M16_REJECT] DecisionID=", decision.DecisionID,
               " Reason=", EnumToString(decision.RejectionReason));
      return;
   }

   decision.DecisionState = DEC_VALIDATED;
   decision.RejectionReason = REJ_NONE;
   if(EntryMode == 1)
      Print("[P3M1][M16_PASS] DecisionID=", decision.DecisionID,
            " Signal=", EnumToString(decision.SignalType),
            " Candle=", TimeToString(decision.CandleTime));
}
''', 'M16_PASS')

          # Preflight trace: log each broker/risk boundary without altering any gate.
          rep(
          '''bool RunEntryPreflightAndExecute(BBMA_Decision &decision, string pair)
{
   if(decision.DecisionState != DEC_VALIDATED) return false;
   if(pair == "" || decision.Pair != pair) return false;
''',
          '''bool RunEntryPreflightAndExecute(BBMA_Decision &decision, string pair)
{
   if(decision.DecisionState != DEC_VALIDATED) return false;
   if(pair == "" || decision.Pair != pair) return false;

   if(EntryMode == 1)
      Print("[P3M1][PREFLIGHT_START] Pair=", pair,
            " DecisionID=", decision.DecisionID,
            " Signal=", EnumToString(decision.SignalType),
            " Dir=", EnumToString(decision.Direction),
            " ValidateCandle=", TimeToString(decision.CandleTime),
            " ProcessTime=", TimeToString(g_processing_time));
''', 'PREFLIGHT_START')

          rep(
          '''      decision.DecisionState = DEC_REJECTED;
      decision.RejectionReason = REJ_MARKET_PRICE_INVALID;
      return false;
''',
          '''      decision.DecisionState = DEC_REJECTED;
      decision.RejectionReason = REJ_MARKET_PRICE_INVALID;
      if(EntryMode == 1)
         Print("[P3M1][PREFLIGHT_REJECT] DecisionID=", decision.DecisionID,
               " Reason=", EnumToString(decision.RejectionReason));
      return false;
''', 'PREFLIGHT_PRICE')

          rep(
          '''      decision.DecisionState = DEC_REJECTED;
      decision.RejectionReason = REJ_SLTP_UNRESOLVED;
      return false;
''',
          '''      decision.DecisionState = DEC_REJECTED;
      decision.RejectionReason = REJ_SLTP_UNRESOLVED;
      if(EntryMode == 1)
         Print("[P3M1][PREFLIGHT_REJECT] DecisionID=", decision.DecisionID,
               " Reason=", EnumToString(decision.RejectionReason));
      return false;
''', 'PREFLIGHT_SLTP_RESOLVE')

          rep(
          '''      decision.RejectionReason = (sltpRejection != REJ_NONE) ?
                                 sltpRejection : REJ_SLTP_UNRESOLVED;
      return false;
''',
          '''      decision.RejectionReason = (sltpRejection != REJ_NONE) ?
                                 sltpRejection : REJ_SLTP_UNRESOLVED;
      if(EntryMode == 1)
         Print("[P3M1][PREFLIGHT_REJECT] DecisionID=", decision.DecisionID,
               " Reason=", EnumToString(decision.RejectionReason));
      return false;
''', 'PREFLIGHT_SLTP_VALIDATE')

          rep(
          '''      decision.DecisionState = DEC_REJECTED;
      decision.RejectionReason = REJ_INVALID_LOT;
      return false;
''',
          '''      decision.DecisionState = DEC_REJECTED;
      decision.RejectionReason = REJ_INVALID_LOT;
      if(EntryMode == 1)
         Print("[P3M1][PREFLIGHT_REJECT] DecisionID=", decision.DecisionID,
               " Reason=", EnumToString(decision.RejectionReason));
      return false;
''', 'PREFLIGHT_LOT')

          rep(
          '''      decision.RejectionReason = (riskStatus.rejection_reason != REJ_NONE) ?
                                 riskStatus.rejection_reason : REJ_TOTAL_RISK;
      return false;
''',
          '''      decision.RejectionReason = (riskStatus.rejection_reason != REJ_NONE) ?
                                 riskStatus.rejection_reason : REJ_TOTAL_RISK;
      if(EntryMode == 1)
         Print("[P3M1][RISK_REJECT] DecisionID=", decision.DecisionID,
               " Reason=", EnumToString(decision.RejectionReason),
               " Detail=", riskStatus.reason);
      return false;
''', 'PREFLIGHT_RISK')

          rep(
          '''   FinalPortfolioGuard(decision);
   if(decision.DecisionState != DEC_VALIDATED) return false;

   ProcessEntry(decision, pair, snapshot, lot);
   return (decision.DecisionState == DEC_EXECUTED);
}
''',
          '''   FinalPortfolioGuard(decision);
   if(decision.DecisionState != DEC_VALIDATED)
   {
      if(EntryMode == 1)
         Print("[P3M1][PORTFOLIO_REJECT] DecisionID=", decision.DecisionID,
               " Reason=", EnumToString(decision.RejectionReason));
      return false;
   }

   if(EntryMode == 1)
      Print("[P3M1][PREFLIGHT_PASS] DecisionID=", decision.DecisionID,
            " Entry=", DoubleToString(decision.EntryPrice, snapshot.Digits),
            " SL=", DoubleToString(decision.StopLoss, snapshot.Digits),
            " TP=", DoubleToString(decision.TakeProfit, snapshot.Digits),
            " Lot=", DoubleToString(lot, snapshot.LotDigits));

   ProcessEntry(decision, pair, snapshot, lot);
   return (decision.DecisionState == DEC_EXECUTED);
}
''', 'PREFLIGHT_PASS')

          # Execution proof: actual broker open time and source decision identity.
          rep(
          '''         decision.DecisionState = DEC_EXECUTED;
         MarkDecisionExecuted(decision.DecisionID, ticket);
         decision.DecisionState = DEC_EXECUTED;
         decision.RejectionReason = REJ_NONE;
         return;
''',
          '''         decision.DecisionState = DEC_EXECUTED;
         MarkDecisionExecuted(decision.DecisionID, ticket);
         decision.DecisionState = DEC_EXECUTED;
         decision.RejectionReason = REJ_NONE;
         if(EntryMode == 1)
            Print("[P3M1][EXEC] Ticket=", ticket,
                  " Pair=", pair,
                  " DecisionID=", decision.DecisionID,
                  " Signal=", EnumToString(decision.SignalType),
                  " Dir=", EnumToString(decision.Direction),
                  " ValidateCandle=", TimeToString(decision.CandleTime),
                  " OrderOpen=", TimeToString(OrderOpenTime()),
                  " SourceTF=", decision.HasSLTPSourceComponent ? decision.SLTPSourceComponent.Timeframe : 0,
                  " SourceCandle=", decision.HasSLTPSourceComponent ? TimeToString(decision.SLTPSourceComponent.CandleTime) : "NA");
         return;
''', 'EXEC')

          if s == before:
              raise SystemExit('No source changes produced')

          # Trace-only invariants: no strategy constants/inputs changed and all
          # critical functional anchors remain exactly once.
          anchors = [
              'bool IsEntryModeCandidateAllowed(',
              'void BuildConfirmedReEntryCandidate(',
              'void PriorityEngine_Atomic(',
              'void InvalidationEngine_Atomic(',
              'bool ResolveApprovedInitialSLTP(',
              'RiskStatus CheckRiskBeforeTrade(',
              'double CalculateLotSize(',
              'void ProcessEntry(',
              'bool RunEntryPreflightAndExecute(',
              'void ProcessPair(',
              'void OnTick()'
          ]
          for a in anchors:
              if before.count(a) != 1 or s.count(a) != 1:
                  raise SystemExit('Anchor changed/missing: ' + a)

          # Forbid any accidental alteration of the EntryMode input declaration.
          input_line = 'input int      EntryMode                          = 2;'
          if before.count(input_line) != 1 or s.count(input_line) != 1:
              raise SystemExit('EntryMode input changed')

          p.write_text(s, encoding='utf-8')

          Path('blueprint/P3_M1_RUNTIME_TRACE_PATCH.md').write_text(
              '# P3-M1 Runtime Trace Patch\n\n'
              'Status: TRACE-ONLY PATCH APPLIED; NATIVE METAEDITOR 0E0W REQUIRED BEFORE MERGE.\n\n'
              'Added `[P3M1]` runtime evidence at Re-Entry/H4 admission, M15 selection/conflict, M16 validation, preflight/risk/portfolio rejection, SLTP/lot pass, and actual broker execution.\n\n'
              'No entry condition, BBMA rule, SL/TP formula, lot formula, risk threshold, portfolio threshold, trade-lock predicate, or execution predicate was changed.\n',
              encoding='utf-8')
          PY

          git diff --check
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- blueprint/source/BBMA_EA.mq4 blueprint/P3_M1_RUNTIME_TRACE_PATCH.md
          git rm -- .github/workflows/p3-m1-runtime-trace-patch.yml
          git commit -m "P3-M1: add trace-only runtime diagnostics"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
