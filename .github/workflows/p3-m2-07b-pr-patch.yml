name: P3-M2-07B temporary patch runner

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'p3-m2-07b-opposite-extreme-supersession'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p3-m2-07b-opposite-extreme-supersession

      - name: Patch atomic opposite Extreme supersession
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('blueprint/source/BBMA_EA.mq4')
          s = p.read_text(encoding='utf-8')

          if 'P3-M2-07B Opposite Extreme Supersession' in s:
              print('Patch already applied.')
              raise SystemExit(0)

          s = s.replace('Version 4.5.1 - PATCHED 2.1',
                        'Version 4.5.1 - P3-M2-07B Opposite Extreme Supersession', 1)

          old_enum = '''enum ENUM_EXTREME_MATURITY
{
   EXT_MAT_NONE,
   EXT_MAT_RAW,
   EXT_MAT_REVERSAL_CONFIRMED,
   EXT_MAT_RETEST_PHASE,
   EXT_MAT_RETEST_READY,
   EXT_MAT_VOID
};'''
          new_enum = '''enum ENUM_EXTREME_MATURITY
{
   EXT_MAT_NONE,
   EXT_MAT_RAW,
   EXT_MAT_REVERSAL_CONFIRMED,
   EXT_MAT_RETEST_PHASE,
   EXT_MAT_RETEST_READY,
   EXT_MAT_VOID,
   EXT_MAT_SUPERSEDED
};'''
          if s.count(old_enum) != 1:
              raise SystemExit(f'expected one Extreme enum anchor, got {s.count(old_enum)}')
          s = s.replace(old_enum, new_enum, 1)

          anchor = '''void MarkExtremeLifecycleVoid(ExtremeLifecycleData &extreme,
                              TimeframeData &data, string reason)
{
   extreme.Maturity = EXT_MAT_VOID;
   extreme.IsValid = false;
   extreme.LastUpdateBar = data.barIndex;
   extreme.LastUpdateCandleTime = data.candle_time;
   extreme.PreviousClose = data.close;
   extreme.Reason = reason;
}
'''
          insert = anchor + '''
bool IsExtremeCycleOwnerMature(ExtremeLifecycleData &extreme)
{
   if(!extreme.IsValid) return false;
   if(extreme.ConfirmationCandleTime <= 0) return false;
   return (extreme.Maturity == EXT_MAT_REVERSAL_CONFIRMED ||
           extreme.Maturity == EXT_MAT_RETEST_PHASE ||
           extreme.Maturity == EXT_MAT_RETEST_READY);
}

void MarkExtremeLifecycleSuperseded(ExtremeLifecycleData &extreme,
                                    TimeframeData &data, string reason)
{
   extreme.Maturity = EXT_MAT_SUPERSEDED;
   extreme.IsValid = false;
   extreme.LastUpdateBar = data.barIndex;
   extreme.LastUpdateCandleTime = data.candle_time;
   extreme.PreviousClose = data.close;
   extreme.Reason = reason;
}

void ResolveOppositeExtremeSupersession(ExtremeLifecycleData &buyExtreme,
                                        ExtremeLifecycleData &sellExtreme,
                                        TimeframeData &data)
{
   if(!data.is_valid || !data.is_closed || data.candle_time <= 0) return;
   if(buyExtreme.Timeframe != data.timeframe ||
      sellExtreme.Timeframe != data.timeframe) return;

   bool buyMature = IsExtremeCycleOwnerMature(buyExtreme);
   bool sellMature = IsExtremeCycleOwnerMature(sellExtreme);
   if(!buyMature || !sellMature) return;

   // Source rule: opposite RAW Extreme is not enough. A newer opposite
   // reversal-confirmed Extreme supersedes the old source-TF Extreme/cycle.
   // This transition affects strategy ownership only; it never OrderClose()s
   // an already-open position.
   if(buyExtreme.ConfirmationCandleTime > sellExtreme.ConfirmationCandleTime)
   {
      MarkExtremeLifecycleSuperseded(
         sellExtreme, data,
         "SELL Extreme superseded by newer reversal-confirmed opposite BUY Extreme");
   }
   else if(sellExtreme.ConfirmationCandleTime > buyExtreme.ConfirmationCandleTime)
   {
      MarkExtremeLifecycleSuperseded(
         buyExtreme, data,
         "BUY Extreme superseded by newer reversal-confirmed opposite SELL Extreme");
   }
   // Equal confirmation time is left unresolved; downstream conflict logic
   // remains fail-closed rather than inventing a directional winner.
}
'''
          if s.count(anchor) != 1:
              raise SystemExit(f'expected one void anchor, got {s.count(anchor)}')
          s = s.replace(anchor, insert, 1)

          old_terminal = '''   if(extreme.Maturity == EXT_MAT_VOID)
   {
      if(!rawDetected || data.candle_time <= extreme.LastUpdateCandleTime)
         return EXT_MAT_VOID;
      ResetExtremeLifecycle(extreme, direction, data.timeframe);
   }
'''
          new_terminal = '''   if(extreme.Maturity == EXT_MAT_VOID ||
      extreme.Maturity == EXT_MAT_SUPERSEDED)
   {
      ENUM_EXTREME_MATURITY terminalState = extreme.Maturity;
      if(!rawDetected || data.candle_time <= extreme.LastUpdateCandleTime)
         return terminalState;
      ResetExtremeLifecycle(extreme, direction, data.timeframe);
   }
'''
          if s.count(old_terminal) != 1:
              raise SystemExit(f'expected one terminal block, got {s.count(old_terminal)}')
          s = s.replace(old_terminal, new_terminal, 1)

          old_preloop = '''   UpdateExtremeLifecycle(g_pair_states[pairIndex].extreme_m15_sell_lifecycle,
                          actual, DIR_SELL, g_pair_states[pairIndex].m15_data,
                          m15Band, m15RawSellExtreme);

   for(int dirIdx = 0; dirIdx < 2; dirIdx++)
'''
          new_preloop = '''   UpdateExtremeLifecycle(g_pair_states[pairIndex].extreme_m15_sell_lifecycle,
                          actual, DIR_SELL, g_pair_states[pairIndex].m15_data,
                          m15Band, m15RawSellExtreme);
   ResolveOppositeExtremeSupersession(
      g_pair_states[pairIndex].extreme_m15_buy_lifecycle,
      g_pair_states[pairIndex].extreme_m15_sell_lifecycle,
      g_pair_states[pairIndex].m15_data);

   // Resolve H1/H4 opposite Extreme ownership before either direction is
   // exported into REM/RRE/REE. This removes BUY-first/SELL-second ordering.
   bool h1RawBuyExtreme = DetectExtreme(actual, DIR_BUY,
                                        g_pair_states[pairIndex].h1_data, h1Band);
   bool h1RawSellExtreme = DetectExtreme(actual, DIR_SELL,
                                         g_pair_states[pairIndex].h1_data, h1Band);
   UpdateExtremeLifecycle(g_pair_states[pairIndex].extreme_h1_buy_lifecycle,
                          actual, DIR_BUY, g_pair_states[pairIndex].h1_data,
                          h1Band, h1RawBuyExtreme);
   UpdateExtremeLifecycle(g_pair_states[pairIndex].extreme_h1_sell_lifecycle,
                          actual, DIR_SELL, g_pair_states[pairIndex].h1_data,
                          h1Band, h1RawSellExtreme);
   ResolveOppositeExtremeSupersession(
      g_pair_states[pairIndex].extreme_h1_buy_lifecycle,
      g_pair_states[pairIndex].extreme_h1_sell_lifecycle,
      g_pair_states[pairIndex].h1_data);

   bool h4RawBuyExtreme = DetectExtreme(actual, DIR_BUY,
                                        g_pair_states[pairIndex].h4_data, h4Band);
   bool h4RawSellExtreme = DetectExtreme(actual, DIR_SELL,
                                         g_pair_states[pairIndex].h4_data, h4Band);
   UpdateExtremeLifecycle(g_pair_states[pairIndex].extreme_h4_buy_lifecycle,
                          actual, DIR_BUY, g_pair_states[pairIndex].h4_data,
                          h4Band, h4RawBuyExtreme);
   UpdateExtremeLifecycle(g_pair_states[pairIndex].extreme_h4_sell_lifecycle,
                          actual, DIR_SELL, g_pair_states[pairIndex].h4_data,
                          h4Band, h4RawSellExtreme);
   ResolveOppositeExtremeSupersession(
      g_pair_states[pairIndex].extreme_h4_buy_lifecycle,
      g_pair_states[pairIndex].extreme_h4_sell_lifecycle,
      g_pair_states[pairIndex].h4_data);

   Signal resolvedH1BuyExtreme, resolvedH1SellExtreme;
   Signal resolvedH4BuyExtreme, resolvedH4SellExtreme;
   ZeroMemory(resolvedH1BuyExtreme); ZeroMemory(resolvedH1SellExtreme);
   ZeroMemory(resolvedH4BuyExtreme); ZeroMemory(resolvedH4SellExtreme);
   ExportReversalConfirmedExtremeSignal(
      g_pair_states[pairIndex].extreme_h1_buy_lifecycle, resolvedH1BuyExtreme);
   ExportReversalConfirmedExtremeSignal(
      g_pair_states[pairIndex].extreme_h1_sell_lifecycle, resolvedH1SellExtreme);
   ExportReversalConfirmedExtremeSignal(
      g_pair_states[pairIndex].extreme_h4_buy_lifecycle, resolvedH4BuyExtreme);
   ExportReversalConfirmedExtremeSignal(
      g_pair_states[pairIndex].extreme_h4_sell_lifecycle, resolvedH4SellExtreme);

   UpdatePersistentExtremeState(resolvedH1BuyExtreme,
                                g_pair_states[pairIndex].extreme_h1_buy_state);
   UpdatePersistentExtremeState(resolvedH1SellExtreme,
                                g_pair_states[pairIndex].extreme_h1_sell_state);
   UpdatePersistentExtremeState(resolvedH4BuyExtreme,
                                g_pair_states[pairIndex].extreme_h4_buy_state);
   UpdatePersistentExtremeState(resolvedH4SellExtreme,
                                g_pair_states[pairIndex].extreme_h4_sell_state);

   for(int dirIdx = 0; dirIdx < 2; dirIdx++)
'''
          if s.count(old_preloop) != 1:
              raise SystemExit(f'expected one M15 preloop anchor, got {s.count(old_preloop)}')
          s = s.replace(old_preloop, new_preloop, 1)

          old_h1 = '''      Signal detectedH1Extreme, detectedH4Extreme;
      ZeroMemory(detectedH1Extreme); ZeroMemory(detectedH4Extreme);

      bool h1RawExtreme = DetectExtreme(actual, direction,
                                        g_pair_states[pairIndex].h1_data, h1Band);
      if(direction == DIR_BUY)
      {
         UpdateExtremeLifecycle(g_pair_states[pairIndex].extreme_h1_buy_lifecycle,
                                actual, direction,
                                g_pair_states[pairIndex].h1_data, h1Band, h1RawExtreme);
         ExportReversalConfirmedExtremeSignal(
            g_pair_states[pairIndex].extreme_h1_buy_lifecycle, detectedH1Extreme);
      }
      else
      {
         UpdateExtremeLifecycle(g_pair_states[pairIndex].extreme_h1_sell_lifecycle,
                                actual, direction,
                                g_pair_states[pairIndex].h1_data, h1Band, h1RawExtreme);
         ExportReversalConfirmedExtremeSignal(
            g_pair_states[pairIndex].extreme_h1_sell_lifecycle, detectedH1Extreme);
      }
'''
          new_h1 = '''      Signal detectedH1Extreme, detectedH4Extreme;
      ZeroMemory(detectedH1Extreme); ZeroMemory(detectedH4Extreme);
      if(direction == DIR_BUY)
      {
         detectedH1Extreme = resolvedH1BuyExtreme;
         detectedH4Extreme = resolvedH4BuyExtreme;
      }
      else
      {
         detectedH1Extreme = resolvedH1SellExtreme;
         detectedH4Extreme = resolvedH4SellExtreme;
      }
'''
          if s.count(old_h1) != 1:
              raise SystemExit(f'expected one H1 loop block, got {s.count(old_h1)}')
          s = s.replace(old_h1, new_h1, 1)

          old_persist = '''      if(direction == DIR_BUY)
      {
         UpdatePersistentExtremeState(detectedH1Extreme,
                                      g_pair_states[pairIndex].extreme_h1_buy_state);
         h1ExtremeSnapshot = g_pair_states[pairIndex].extreme_h1_buy_state;
      }
      else
      {
         UpdatePersistentExtremeState(detectedH1Extreme,
                                      g_pair_states[pairIndex].extreme_h1_sell_state);
         h1ExtremeSnapshot = g_pair_states[pairIndex].extreme_h1_sell_state;
      }
'''
          new_persist = '''      if(direction == DIR_BUY)
         h1ExtremeSnapshot = g_pair_states[pairIndex].extreme_h1_buy_state;
      else
         h1ExtremeSnapshot = g_pair_states[pairIndex].extreme_h1_sell_state;
'''
          if s.count(old_persist) != 1:
              raise SystemExit(f'expected one persistent H1 block, got {s.count(old_persist)}')
          s = s.replace(old_persist, new_persist, 1)

          old_h4 = '''      bool h4RawExtreme = DetectExtreme(actual, direction,
                                        g_pair_states[pairIndex].h4_data, h4Band);
      if(direction == DIR_BUY)
      {
         UpdateExtremeLifecycle(g_pair_states[pairIndex].extreme_h4_buy_lifecycle,
                                actual, direction,
                                g_pair_states[pairIndex].h4_data, h4Band, h4RawExtreme);
         ExportReversalConfirmedExtremeSignal(
            g_pair_states[pairIndex].extreme_h4_buy_lifecycle, detectedH4Extreme);
         UpdatePersistentExtremeState(detectedH4Extreme,
                                      g_pair_states[pairIndex].extreme_h4_buy_state);
         h4ExtremeSnapshot = g_pair_states[pairIndex].extreme_h4_buy_state;
      }
      else
      {
         UpdateExtremeLifecycle(g_pair_states[pairIndex].extreme_h4_sell_lifecycle,
                                actual, direction,
                                g_pair_states[pairIndex].h4_data, h4Band, h4RawExtreme);
         ExportReversalConfirmedExtremeSignal(
            g_pair_states[pairIndex].extreme_h4_sell_lifecycle, detectedH4Extreme);
         UpdatePersistentExtremeState(detectedH4Extreme,
                                      g_pair_states[pairIndex].extreme_h4_sell_state);
         h4ExtremeSnapshot = g_pair_states[pairIndex].extreme_h4_sell_state;
      }
      h4_extreme = h4ExtremeSnapshot;
'''
          new_h4 = '''      if(direction == DIR_BUY)
         h4ExtremeSnapshot = g_pair_states[pairIndex].extreme_h4_buy_state;
      else
         h4ExtremeSnapshot = g_pair_states[pairIndex].extreme_h4_sell_state;
      h4_extreme = h4ExtremeSnapshot;
'''
          if s.count(old_h4) != 1:
              raise SystemExit(f'expected one H4 loop block, got {s.count(old_h4)}')
          s = s.replace(old_h4, new_h4, 1)

          required = [
              'EXT_MAT_SUPERSEDED',
              'void ResolveOppositeExtremeSupersession',
              'resolvedH1BuyExtreme',
              'resolvedH4BuyExtreme',
              'strategy ownership only; it never OrderClose()',
          ]
          for token in required:
              if token not in s:
                  raise SystemExit(f'missing static assertion token: {token}')

          p.write_text(s, encoding='utf-8')
          PY

          if git diff --quiet -- blueprint/source/BBMA_EA.mq4; then
            echo 'No source diff to commit.'
            exit 0
          fi

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- blueprint/source/BBMA_EA.mq4
          git commit -m "P3-M2-07B: atomic opposite Extreme cycle supersession"
          git push origin HEAD:p3-m2-07b-opposite-extreme-supersession
