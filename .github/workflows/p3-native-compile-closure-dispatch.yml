name: P3 native compile closure dispatch

on:
  pull_request:
    branches: [ blueprint-dev ]
    types: [opened, reopened, synchronize]
    paths:
      - 'blueprint/.native-compile-closure-dispatch'

permissions:
  contents: write

jobs:
  close-native-compile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: blueprint-dev
          fetch-depth: 0

      - name: Reconcile native compile status
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          paths = [Path('blueprint/MASTER_QUEUE.md'), Path('blueprint/CURRENT.md')]
          replacements = {
              'CODE IMPLEMENTED / STATIC REGRESSION PASS — NATIVE METAEDITOR COMPILE + RUNTIME TRACE PENDING':
                  'CODE IMPLEMENTED / STATIC REGRESSION PASS / NATIVE METAEDITOR 0E0W PASS — RUNTIME TRACE PENDING',
              'CODE IMPLEMENTED / STATIC REGRESSION PASS — NATIVE METAEDITOR COMPILE + RUNTIME TRACE PENDING':
                  'CODE IMPLEMENTED / STATIC REGRESSION PASS / NATIVE METAEDITOR 0E0W PASS — RUNTIME TRACE PENDING',
              'CODE IMPLEMENTED / STATIC REGRESSION PASS — NATIVE METAEDITOR COMPILE + RUNTIME TRACE PENDING':
                  'CODE IMPLEMENTED / STATIC REGRESSION PASS / NATIVE METAEDITOR 0E0W PASS — RUNTIME TRACE PENDING',
              'CODE IMPLEMENTED / STATIC REGRESSION PASS — NATIVE METAEDITOR COMPILE + RUNTIME TRACE PENDING':
                  'CODE IMPLEMENTED / STATIC REGRESSION PASS / NATIVE METAEDITOR 0E0W PASS — RUNTIME TRACE PENDING',
              'CODE IMPLEMENTED / STATIC REGRESSION PASS — NATIVE METAEDITOR COMPILE + RUNTIME TRACE PENDING':
                  'CODE IMPLEMENTED / STATIC REGRESSION PASS / NATIVE METAEDITOR 0E0W PASS — RUNTIME TRACE PENDING',
              'STATIC END-TO-END COMPLIANCE PASS — NATIVE METAEDITOR + RUNTIME MODE1 TRACE PENDING':
                  'STATIC END-TO-END COMPLIANCE PASS / NATIVE METAEDITOR 0E0W PASS — RUNTIME MODE1 TRACE PENDING',
              'STATIC TIMING VERIFIED / METADATA REPAIRED — NATIVE METAEDITOR + RUNTIME ORDER-TIME TRACE PENDING':
                  'STATIC TIMING VERIFIED / METADATA REPAIRED / NATIVE METAEDITOR 0E0W PASS — RUNTIME ORDER-TIME TRACE PENDING',
              'BUG CONFIRMED / FIX IMPLEMENTED / STATIC REGRESSION PASS — METAEDITOR + RUNTIME TRACE PENDING':
                  'BUG CONFIRMED / FIX IMPLEMENTED / STATIC REGRESSION PASS / NATIVE METAEDITOR 0E0W PASS — RUNTIME TRACE PENDING',
              'STATIC RE-AUDIT PASS — METAEDITOR/RUNTIME EVIDENCE PENDING':
                  'STATIC RE-AUDIT PASS / NATIVE METAEDITOR 0E0W PASS — RUNTIME EVIDENCE PENDING',
          }

          for p in paths:
              s = p.read_text(encoding='utf-8')
              original = s
              for old, new in replacements.items():
                  s = s.replace(old, new)
              if p.name == 'CURRENT.md':
                  overlay = '''\n\n# 2026-08-22 Native MetaEditor Compile Closure Overlay\n- The current integrated `blueprint/source/BBMA_EA.mq4` was recompiled by the user in native MT4 MetaEditor after the F4 duplicated-signature repair.\n- Reported result: **0 errors / 0 warnings (0E0W)**.\n- Native compile is therefore closed for the integrated F1-F6 / Mode1 / TradeLock / sequential-risk source state at this revision.\n- Remaining gates are runtime evidence only unless a runtime trace exposes a new defect.\n- P3 Step 5 remains open until its runtime Tests A-D are directly evidenced.\n'''
                  if 'Native MetaEditor Compile Closure Overlay' not in s:
                      s += overlay
              if s != original:
                  p.write_text(s, encoding='utf-8')

          audit = Path('blueprint/P3_NATIVE_METAEDITOR_COMPILE_REPAIR_20260822.md')
          if '0 errors / 0 warnings' not in audit.read_text(encoding='utf-8'):
              raise SystemExit('native compile closure audit missing 0E0W record')
          PY
          git diff --check

      - name: Commit compile closure reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- blueprint/MASTER_QUEUE.md blueprint/CURRENT.md
          if git diff --cached --quiet; then
            echo 'No tracking changes required.'
            exit 0
          fi
          git commit -m "P3: reconcile 0E0W native compile closure"
          git push origin HEAD:blueprint-dev
