name: P3 PairID PR Native Verify

on:
  pull_request:
    branches: [ blueprint-dev ]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate requested 20-pair PairID and magic uniqueness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          s = Path('blueprint/source/BBMA_PROFESSIONAL_EA.mq4').read_text(encoding='utf-8')
          requested = [
              'EURUSD','GBPUSD','USDJPY','USDCHF','USDCAD','AUDUSD','NZDUSD',
              'EURJPY','GBPJPY','AUDJPY','CADJPY','CHFJPY','NZDJPY','EURGBP',
              'EURAUD','EURCAD','EURCHF','GBPAUD','GBPCAD','AUDCAD'
          ]
          registry = {
              sym: int(pid)
              for sym, pid in re.findall(r'if\(clean\s*==\s*"([A-Z0-9]+)"\)\s*return\s+(\d+)\s*;', s)
          }
          ids = [registry[p] for p in requested]
          assert len(ids) == 20
          assert len(set(ids)) == 20
          assert all(1 <= pid <= 99 for pid in ids)
          assert re.search(r'^#define\s+MAX_PAIRS\s+20\s*$', s, re.M)
          assert re.search(r'^#define\s+PAIR_ID_MAX\s+99\s*$', s, re.M)
          mb = int(re.search(r'^#define\s+MAGIC_BASE\s+(\d+)\s*$', s, re.M).group(1))
          magics = [mb + 10000 + pid for pid in ids]
          assert len(set(magics)) == 20
          print('P3_PAIRID_STATIC=PASS')
          print(','.join(f'{p}:{registry[p]}' for p in requested))
          PY

  native:
    needs: static
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Acquire official MT4 MetaEditor with bounded wait
        timeout-minutes: 3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Find-MetaEditor {
            $roots = @('C:\Program Files','C:\Program Files (x86)',"$env:APPDATA\MetaQuotes")
            foreach ($root in $roots) {
              if (Test-Path $root) {
                $found = Get-ChildItem $root -Filter 'metaeditor*.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($found) { return $found }
              }
            }
            return $null
          }

          $meta = Find-MetaEditor
          if (-not $meta) {
            $setup = Join-Path $env:RUNNER_TEMP 'mt4setup.exe'
            Invoke-WebRequest -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt4/mt4setup.exe' -OutFile $setup -UseBasicParsing
            $proc = Start-Process -FilePath $setup -ArgumentList '/auto' -PassThru
            $deadline = (Get-Date).AddSeconds(90)
            do {
              Start-Sleep -Seconds 3
              $meta = Find-MetaEditor
              if ($meta) { break }
            } while ((Get-Date) -lt $deadline)

            if (-not $meta) {
              if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
              throw 'MT4 MetaEditor not found within bounded installer window'
            }
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }

          Write-Host "Using MetaEditor: $($meta.FullName)"
          "METAEDITOR=$($meta.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Native MetaEditor compile current canonical source
        timeout-minutes: 2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = (Resolve-Path '.\blueprint\source\BBMA_PROFESSIONAL_EA.mq4').Path
          $log = Join-Path $env:RUNNER_TEMP 'p3-pairid-metaeditor.log'
          $args = @("/compile:$src", "/log:$log")
          $p = Start-Process -FilePath "$env:METAEDITOR" -ArgumentList $args -PassThru
          if (-not $p.WaitForExit(60000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'MetaEditor compile process exceeded 60 seconds'
          }
          Start-Sleep -Seconds 2
          if (-not (Test-Path $log)) { throw 'MetaEditor compile log missing' }
          $txt = Get-Content $log -Raw
          $txt | Write-Host
          $ex4 = [System.IO.Path]::ChangeExtension($src,'.ex4')
          if (-not (Test-Path $ex4)) { throw 'MetaEditor did not produce EX4' }
          if ($txt -notmatch '(?i)0\s+errors?\s*,?\s*0\s+warnings?') {
            throw 'Native compile is not confirmed 0 errors / 0 warnings'
          }
          Write-Host 'P3_PAIRID_NATIVE_MT4_COMPILE=PASS_0E0W'

      - uses: actions/upload-artifact@v4
        with:
          name: p3-pairid-pr-native-verify
          path: |
            blueprint/source/BBMA_PROFESSIONAL_EA.ex4
            ${{ runner.temp }}/p3-pairid-metaeditor.log
          if-no-files-found: error
