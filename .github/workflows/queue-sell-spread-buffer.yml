name: Queue SELL spread-buffer normalization
on:
  push:
    branches: [d1-owner-dev]
    paths: ['blueprint/.queue-sell-spread-buffer-trigger-v2']
permissions:
  contents: write
jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d1-owner-dev
          fetch-depth: 0
      - name: Append locked queue item
        shell: bash
        run: |
          set -euo pipefail
          marker='## 2026-08-25 — Locked Next-Update Item: SELL Spread-Buffer Execution Normalization'
          if ! grep -Fq "$marker" blueprint/MASTER_QUEUE.md; then
            echo '' | base64 -d >> blueprint/MASTER_QUEUE.md
          fi
          git diff --check
          if git diff --name-only | grep -E '\.(mq4|mqh)$'; then
            echo 'Unexpected MQL source change'
            exit 1
          fi
      - name: Commit queue update
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blueprint/MASTER_QUEUE.md
          git commit -m 'docs: queue locked SELL spread-buffer normalization'
          git push origin HEAD:d1-owner-dev
