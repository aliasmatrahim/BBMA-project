name: P2 observability native MT4 compile
on:
  push:
    branches: [d1-owner-dev]
    paths: ['blueprint/.rej-invalid-lot-native-trigger']
permissions:
  contents: read
jobs:
  native-compile:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d1-owner-dev
          fetch-depth: 0
      - name: Verify observability source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = '.\blueprint\source\BBMA_EA.mq4'
          $text = Get-Content $src -Raw
          if ($text -notmatch 'P2-LOTDIAG-01') { throw 'LOTDIAG marker missing' }
          if ($text -notmatch '\[LOT_DIAG\]\[REJ_INVALID_LOT\]') { throw 'LOTDIAG telemetry missing' }
          if ($text -notmatch 'P2-DASHCOUNT-01') { throw 'DASHCOUNT marker missing' }
          if ($text -notmatch 'CountDashboardLiveEAOwnedTrades') { throw 'DASHCOUNT helper missing' }
          $sha = (Get-FileHash $src -Algorithm SHA256).Hash.ToLower()
          Write-Host "EA_SHA256=$sha"
          "EA_SHA256=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Acquire official MT4 MetaEditor
        timeout-minutes: 12
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Find-MetaEditor {
            $roots = @('C:\Program Files', 'C:\Program Files (x86)', $env:LOCALAPPDATA)
            foreach ($root in $roots) {
              if (-not $root -or -not (Test-Path $root)) { continue }
              $hit = Get-ChildItem $root -Filter metaeditor.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($hit) { return $hit }
            }
            return $null
          }

          $meta = Find-MetaEditor
          if (-not $meta) {
            $setup = Join-Path $env:RUNNER_TEMP 'mt4setup.exe'
            Invoke-WebRequest -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt4/mt4setup.exe' -OutFile $setup -UseBasicParsing
            $proc = Start-Process -FilePath $setup -ArgumentList '/auto' -PassThru

            # Bounded acquisition window. Previous 8-minute step could expire
            # before the installer/search loop completed on Windows 2025 runners.
            for ($i=0; $i -lt 108; $i++) {
              Start-Sleep -Seconds 5
              $meta = Find-MetaEditor
              if ($meta) { break }
              if ($proc.HasExited -and $i -gt 12) {
                # Installer exited: continue a short grace period for final files.
                if ($i -gt 24) { break }
              }
            }

            if ($proc -and -not $proc.HasExited) { try { $proc.Kill() } catch {} }
            if (-not $meta) { $meta = Find-MetaEditor }
          }

          if (-not $meta) { throw 'Official MT4 MetaEditor not found after bounded acquisition window' }
          "METAEDITOR=$($meta.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "METAEDITOR=$($meta.FullName)"
      - name: Compile current owner source 0E0W
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = (Resolve-Path '.\blueprint\source\BBMA_EA.mq4').Path
          $work = Join-Path $env:RUNNER_TEMP 'p2-observability-compile'
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          $dst = Join-Path $work 'BBMA_EA.mq4'
          Copy-Item $src $dst -Force
          $log = Join-Path $env:RUNNER_TEMP 'p2-observability-native-compile.log'
          & $env:METAEDITOR "/compile:$dst" "/log:$log"
          Start-Sleep -Seconds 2
          if (-not (Test-Path $log)) { throw 'MetaEditor compile log missing' }
          $txt = Get-Content $log -Raw
          $txt | Write-Host
          $matches = [regex]::Matches($txt, '(?i)(\d+)\s+errors?,\s*(\d+)\s+warnings?')
          if ($matches.Count -lt 1) { throw 'Unable to parse MetaEditor summary' }
          $m = $matches[$matches.Count - 1]
          $errors = [int]$m.Groups[1].Value
          $warnings = [int]$m.Groups[2].Value
          Write-Host "ERRORS=$errors"
          Write-Host "WARNINGS=$warnings"
          if ($errors -ne 0 -or $warnings -ne 0) { throw "MetaEditor produced $errors errors / $warnings warnings" }
          $ex4 = [System.IO.Path]::ChangeExtension($dst,'.ex4')
          if (-not (Test-Path $ex4)) { throw 'EX4 not produced' }
          Write-Host 'P2_OBSERVABILITY_NATIVE_METAEDITOR=PASS'
      - name: Publish compile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-observability-native-compile-evidence
          path: ${{ runner.temp }}/p2-observability-native-compile.log
          if-no-files-found: warn
