name: Sequential risk-budget audit dispatch

on:
  pull_request:
    branches: [ blueprint-dev ]
    types: [opened, reopened, synchronize]
    paths:
      - 'blueprint/.sequential-risk-dispatch'

permissions:
  contents: write

jobs:
  audit-sequential-risk:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: blueprint-dev
          fetch-depth: 0

      - name: Audit sequential cumulative risk-budget admission
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_sequential_risk_budget_audit.py
          git diff --check

      - name: Commit risk audit to blueprint-dev
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- blueprint/P3_SEQUENTIAL_RISK_BUDGET_ADMISSION_AUDIT.md \
                     blueprint/MASTER_QUEUE.md \
                     blueprint/CURRENT.md
          if git diff --cached --quiet; then
            echo 'No sequential-risk audit changes to commit.'
            exit 0
          fi
          git commit -m "P3: audit sequential cumulative risk admission"
          git push origin HEAD:blueprint-dev
