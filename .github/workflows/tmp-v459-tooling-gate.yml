name: TEMP v4.59 runtime tooling gate

on:
  push:
    branches: [p0-v459-postpass-integration-20260827]
    paths:
      - 'blueprint/.run-v459-tooling-gate'

permissions:
  contents: read

jobs:
  tooling-gate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0-v459-postpass-integration-20260827
          fetch-depth: 0

      - name: Verify exact v4.59 integration source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $blob = (git hash-object blueprint/source/BBMA_EA.mq4).Trim()
          $sha = (Get-FileHash .\blueprint\source\BBMA_EA.mq4 -Algorithm SHA256).Hash.ToLower()
          if ($blob -ne 'dc83e62748c93171d89a312e9f7a53c06d97e261') { throw "Unexpected source blob: $blob" }
          if ($sha -ne '0a42ee2e6c32810f655b592d8738f500e8b63b4e08c4c874e82452f75ce94b2e') { throw "Unexpected source SHA256: $sha" }
          git diff --check

      - name: Run v4.59 selftests and native compile matrix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'v459-tooling-matrix'
          & .\blueprint\runtime\v459_native_compile_matrix.ps1 -WorkDir $work 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'v459-tooling-gate.log')
          if ($LASTEXITCODE -ne 0) { throw "v4.59 tooling matrix failed: $LASTEXITCODE" }

      - name: Upload tooling evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v459-runtime-tooling-gate-evidence
          path: |
            ${{ runner.temp }}/v459-tooling-matrix
            ${{ runner.temp }}/v459-tooling-gate.log
          if-no-files-found: warn
