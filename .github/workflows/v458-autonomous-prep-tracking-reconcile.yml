name: v458 autonomous prep tracking reconciliation

on:
  push:
    branches: [d1-owner-dev]
    paths:
      - '.github/workflows/v458-autonomous-prep-tracking-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d1-owner-dev
          fetch-depth: 0

      - name: Verify frozen v4.58 source
        shell: bash
        run: |
          set -euo pipefail
          blob="$(git rev-parse HEAD:blueprint/source/BBMA_EA.mq4)"
          test "$blob" = "a166ffb23aba5e6b4011a28d9de8896cd00e33a1"
          echo "TRACKING_SOURCE_IDENTITY=PASS $blob"

      - name: Append authoritative latest overlays
        shell: python
        run: |
          from pathlib import Path
          current = Path('blueprint/CURRENT.md')
          queue = Path('blueprint/MASTER_QUEUE.md')
          current_marker = '# 2026-08-26 v4.58 Autonomous Runtime Preparation Closure Overlay'
          queue_marker = '## 2026-08-26 — Autonomous Preparation Complete / Broker Runtime Next Overlay'
          current_block = '''\n\n# 2026-08-26 v4.58 Autonomous Runtime Preparation Closure Overlay\n- **AUTONOMOUS BROKER-RUNTIME PREPARATION: CLOSED / PASS.**\n- Validation package commit: `d3e209c86ad702a4d2edefb2951e07dbd876cfc4`.\n- Native validation workflow run `32917428334`, job `98023961888`: SUCCESS.\n- Official MetaEditor gates: BASELINE 0E0W, R1 D1TPW 0E0W, R2 C044 0E0W, Runtime Observer 0E0W.\n- Variant-builder selftest, unified-analyzer selftest, observer read-only static guard, and frozen-source identity guard all PASS.\n- Canonical EA remains v4.58 blob `a166ffb23aba5e6b4011a28d9de8896cd00e33a1`; canonical D1TPW/C044 gates remain OFF and N3 execution remains NONE/inactive.\n- Full evidence: `blueprint/V458_AUTONOMOUS_RUNTIME_PREP_CLOSURE_20260826.md`.\n- **Next authoritative action: authenticated broker/demo MT4 runtime validation R1–R6 using `blueprint/V458_BROKER_RUNTIME_VALIDATION_RUNBOOK_20260826.md`.**\n- No further strategy/NMJE feature work should precede this runtime gate unless runtime evidence reveals a scoped defect.\n'''
          queue_block = '''\n\n## 2026-08-26 — Autonomous Preparation Complete / Broker Runtime Next Overlay\nThis overlay supersedes older queue wording where it conflicts.\n\n- N1/N2/N3 technical preparation is complete; N3 execution policy remains `NONE`.\n- v4.58 autonomous runtime package is CLOSED/PASS, including native 0E0W for BASELINE, R1 D1TPW, R2 C044, and Runtime Observer.\n- Canonical strategy/source remains frozen at Git blob `a166ffb23aba5e6b4011a28d9de8896cd00e33a1`.\n- **ACTIVE QUEUE: broker/demo runtime closure R1 -> R2 -> R3 -> R4 -> R5 -> R6.**\n- R1: D1 TP-Wajib lifecycle checkpoint/restart/completion/idempotency.\n- R2: C044 failed-Momentum/rearm/supersession/M20 precedence/restart.\n- R3: D1 owner matrix + D1O identity/dedup.\n- R4: validation-to-order timing + M17 live SL geometry.\n- R5: TradeLock + cumulative risk + P3 B/C/D.\n- R6: N2 real forward identity/outcome chain; N3 remains activation-firewalled.\n- Runtime evidence must come from an authenticated connected MT4 demo/broker session. Hosted smoke is not a substitute.\n'''
          def append_once(path, marker, block):
              text = path.read_text(encoding='utf-8')
              if marker not in text:
                  path.write_text(text.rstrip() + block + '\n', encoding='utf-8')
          append_once(current, current_marker, current_block)
          append_once(queue, queue_marker, queue_block)

      - name: Commit tracking reconciliation and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/v458-autonomous-prep-tracking-reconcile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blueprint/CURRENT.md blueprint/MASTER_QUEUE.md
          git commit -m 'Close v4.58 autonomous runtime preparation tracking [skip ci]'
          git push origin HEAD:d1-owner-dev
