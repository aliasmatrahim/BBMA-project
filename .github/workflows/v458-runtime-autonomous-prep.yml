name: v458-runtime-autonomous-prep

on:
  workflow_dispatch:
  push:
    branches: [d1-owner-dev]
    paths:
      - 'blueprint/source/BBMA_EA.mq4'
      - 'blueprint/source/EA_RELEASE_IDENTITY.json'
      - 'blueprint/runtime/**'
      - 'blueprint/tools/v458_*'
      - 'blueprint/tools/check_release_identity.py'
      - 'blueprint/tests/test_v458_*'
      - '.github/workflows/v458-runtime-autonomous-prep.yml'

jobs:
  native-prep-gate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify synchronized EA release identity
        shell: pwsh
        run: python ./blueprint/tools/check_release_identity.py
      - name: Verify frozen canonical source identity
        shell: pwsh
        run: |
          $blob = (git rev-parse HEAD:blueprint/source/BBMA_EA.mq4).Trim()
          if ($blob -ne '5c1b93d7783a00877cb7fd233673ca1ac1340151') { throw "Unexpected canonical source blob: $blob" }
          $sha = (& python -c "import subprocess,hashlib; d=subprocess.check_output(['git','cat-file','blob','$blob']); print(hashlib.sha256(d).hexdigest())").Trim()
          if ($sha -ne '6fd9eb52b63dee8861ebf205b1c031d80646b58e0b4941ef21ece9431fe6be5a') { throw "Unexpected canonical SHA256: $sha" }
          Write-Host "CANONICAL_SOURCE_FROZEN=PASS blob=$blob sha256=$sha"
      - name: Run autonomous native prep matrix
        shell: pwsh
        run: ./blueprint/runtime/v458_native_compile_matrix.ps1 -RepoRoot $PWD
      - name: Package R1 D1TPW runtime build
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'bbma-v458-runtime-prep'
          $pkg = Join-Path $env:RUNNER_TEMP 'bbma-v458-r1-package'
          New-Item -ItemType Directory -Path $pkg -Force | Out-Null
          Copy-Item (Join-Path $work 'R1_D1TPW.mq4') (Join-Path $pkg 'BBMA_EA_V458_R1_D1TPW_TEST_ONLY.mq4') -Force
          Copy-Item (Join-Path $work 'R1_D1TPW.json') (Join-Path $pkg 'BBMA_EA_V458_R1_D1TPW_TEST_ONLY.metadata.json') -Force
          $ex4 = Join-Path $work 'mt4portable\MQL4\Experts\R1_D1TPW.ex4'
          if (-not (Test-Path $ex4)) { throw 'R1 compiled EX4 missing after native matrix' }
          Copy-Item $ex4 (Join-Path $pkg 'BBMA_EA_V458_R1_D1TPW_TEST_ONLY.ex4') -Force
          @"
          TEST-ONLY R1 PACKAGE
          Canonical release: BBMA EA v4.58
          Profile: R1 D1TPW
          EnableD1TPWLifecycle=true
          EnableC044Lifecycle=false
          Generated from frozen canonical source and native-compiled 0E0W in this workflow run.
          Do not replace the canonical source with this file.
          "@ | Set-Content (Join-Path $pkg 'README.txt') -Encoding UTF8
      - name: Upload R1 D1TPW test package
        uses: actions/upload-artifact@v4
        with:
          name: BBMA-V458-R1-D1TPW-TEST-ONLY
          path: ${{ runner.temp }}\bbma-v458-r1-package
          if-no-files-found: error
          retention-days: 30
